<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kanban Board</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"></span><strong>S-Kanban</strong>
      </div>
      <div class="board-title">
        <input id="boardName" />
        <span id="autoAdoptIndicator" class="auto-adopt-square" title="Auto-adopt"></span>
        <span id="statusText"></span>
      </div>
      <div class="top-actions">
        <button id="selfAvatarBtn" class="header-avatar-btn" title="Edit your profile"></button>
        <button id="networkBtn">local</button>
        <button id="menuToggleBtn" class="icon-btn" title="Board menu" aria-label="Board menu">
          &#9776;
        </button>
      </div>
    </header>

    <div id="sidePanelOverlay" class="side-panel-overlay"></div>
    <aside id="sidePanel" class="side-panel">
      <div class="side-panel-header">
        <strong>Board menu</strong>
        <button id="sidePanelCloseBtn" class="icon-btn" title="Close" aria-label="Close">
          &#10005;
        </button>
      </div>
      <div class="side-panel-section">
        <h3>Boards</h3>
        <div id="boardList" class="board-list"></div>
      </div>
      <div class="side-panel-section">
        <h3>Settings</h3>
        <div class="auto-adopt-control">
          <button
            id="autoAdoptToggleBtn"
            type="button"
            class="auto-adopt-square"
            title="Click to change"
          ></button>
          <span id="autoAdoptModeLabel"></span>
        </div>
      </div>
    </aside>

    <main>
      <section id="board" class="board"></section>
    </main>

    <dialog id="cardModal">
      <form method="dialog" id="cardForm">
        <h2 id="cardModalTitle">Card</h2>
        <label>Name<input id="cardName" /></label>
        <label>Description<textarea id="cardDescription" rows="5"></textarea></label>
        <label>Owner<select id="cardOwner"></select></label>
        <label>Members</label>
        <div id="participantPicker" class="user-picker"></div>
        <menu>
          <button id="deleteCardBtn" type="button" class="danger">Delete</button>
          <span></span>
          <button type="button" id="cancelCardBtn">Cancel</button>
          <button type="submit" class="primary">Save</button>
        </menu>
      </form>
    </dialog>

    <dialog id="simpleModal">
      <form method="dialog" id="simpleForm">
        <h2 id="simpleTitle">Action</h2>
        <div id="simpleFields"></div>
        <menu>
          <button type="button" id="cancelSimpleBtn">Cancel</button>
          <button type="submit" id="submitSimpleBtn" class="primary">Apply</button>
        </menu>
      </form>
    </dialog>

    <script>
      let state = null;
      let draggedCard = null;
      let draggedColumn = null;
      let dragActive = false;
      let modalCard = null;
      let modalColumn = null;
      let modalParticipants = [];
      let modalOwner = null;
      let statusResetAt = 0;

      const AUTO_ADOPT_MODES = ["always", "not_owner", "not_member", "never"];
      const AUTO_ADOPT_LABELS = {
        always: "Always",
        not_owner: "Except cards I own",
        not_member: "Except cards I'm on",
        never: "Never",
      };
      const AUTO_ADOPT_FILL = { always: 4, not_owner: 2, not_member: 1, never: 0 };

      const el = (id) => document.getElementById(id);

      function autoAdoptAllowsNode(node) {
        const mode = state.auto_adopt_mode;
        if (mode === "always") return true;
        if (mode === "never") return false;
        if (!node || node.data.type !== "kanban_card") return true;
        const myId = (state.users || [])[0]?.id;
        if (mode === "not_owner") return node.data.owner !== myId;
        if (mode === "not_member") return !(node.data.participants || []).includes(myId);
        return true;
      }

      function isReaffirmed(node) {
        return !!node.reaffirmed;
      }

      function hasPendingDivergence(node) {
        const info = transitionInfo(node.uuid);
        return !!info && info.type !== "in_agreement";
      }

      function needsManualAdopt(node) {
        if (!hasPendingDivergence(node) || isReaffirmed(node)) return false;
        const info = transitionInfo(node.uuid);
        const autoResolvableType = info.type === "peer_made_changes" || info.type === "local_missing_node";
        return !autoResolvableType || !autoAdoptAllowsNode(node);
      }

      function needsReaffirmedBadge(node) {
        return hasPendingDivergence(node) && isReaffirmed(node);
      }

      function renderAutoAdoptSquare(container) {
        container.replaceChildren();
        const filled = AUTO_ADOPT_FILL[state.auto_adopt_mode] ?? 4;
        for (let i = 0; i < 4; i++) {
          const cell = document.createElement("span");
          cell.className = "auto-adopt-cell";
          if (i < filled) cell.classList.add("filled");
          container.append(cell);
        }
      }

      async function api(path, body) {
        const response = await fetch(path, {
          method: body === undefined ? "GET" : "POST",
          headers: body === undefined ? {} : { "Content-Type": "application/json" },
          body: body === undefined ? undefined : JSON.stringify(body),
        });
        const payload = await response.json();
        if (!response.ok || payload.status === "error") {
          throw new Error(payload.reason || "Request failed");
        }
        return payload;
      }

      function renderNetwork() {
        const peers = (state.network.members || []).filter((item) => item !== state.address);
        const networkBtn = el("networkBtn");
        networkBtn.replaceChildren();
        networkBtn.className = peers.length ? "peer-cluster" : "peer-cluster local";
        if (!peers.length) {
          networkBtn.textContent = "local";
        } else {
          for (const addr of peers.slice(0, 4)) {
            const user = userForParticipant(addr);
            const online = peerStatus(addr).state !== "offline";
            const avatar = document.createElement("span");
            avatar.className = "header-avatar";
            avatar.classList.add(online ? "status-online" : "status-offline");
            if (user.picture) {
              avatar.style.backgroundImage = `url("${cssUrl(user.picture)}")`;
            } else {
              avatar.textContent = initials(user.name || peerLabel(addr));
            }
            avatar.title = peerLabel(addr);
            networkBtn.append(avatar);
          }
          if (peers.length > 4) {
            const more = document.createElement("span");
            more.className = "header-avatar more";
            more.textContent = `+${peers.length - 4}`;
            networkBtn.append(more);
          }
        }
        el("networkBtn").title = peers
          .map((addr) => {
            const status = peerStatus(addr);
            const suffix =
              status.state === "offline"
                ? ` (on hold${status.last_error ? `: ${status.last_error}` : ""})`
                : "";
            return `${peerLabel(addr)}${suffix}`;
          })
          .join("\\n");
        if (Date.now() > statusResetAt) {
          el("statusText").textContent = "";
          el("statusText").className = "idle";
        }
      }

      function renderSelfAvatar() {
        const self = (state.users || [])[0];
        const button = el("selfAvatarBtn");
        button.replaceChildren();
        const avatar = document.createElement("span");
        avatar.className = "header-avatar status-online";
        if (self?.picture) {
          avatar.style.backgroundImage = `url("${cssUrl(self.picture)}")`;
        } else {
          avatar.textContent = initials(self?.name || "?");
        }
        button.append(avatar);
        button.title = self?.name ? `${self.name} (edit profile)` : "Edit your profile";
      }

      function renderAutoAdoptIndicator() {
        const indicator = el("autoAdoptIndicator");
        renderAutoAdoptSquare(indicator);
        indicator.title = `Auto-adopt: ${AUTO_ADOPT_LABELS[state.auto_adopt_mode] || "Always"}`;
      }

      function renderAutoAdoptControl() {
        const button = el("autoAdoptToggleBtn");
        renderAutoAdoptSquare(button);
        el("autoAdoptModeLabel").textContent = AUTO_ADOPT_LABELS[state.auto_adopt_mode] || "Always";
      }

      function encodeConnectToken(address, topicUuids) {
        return btoa(JSON.stringify({ address, topic_uuids: topicUuids }));
      }

      function decodeConnectToken(token) {
        const payload = JSON.parse(atob(token.trim()));
        if (!payload.address || !Array.isArray(payload.topic_uuids) || !payload.topic_uuids.length) {
          throw new Error("Invalid token");
        }
        return payload;
      }

      function avatarElement(user, online) {
        const avatar = document.createElement("span");
        avatar.className = "header-avatar";
        avatar.classList.add(online ? "status-online" : "status-offline");
        if (user.picture) {
          avatar.style.backgroundImage = `url("${cssUrl(user.picture)}")`;
        } else {
          avatar.textContent = initials(user.name);
        }
        return avatar;
      }

      function openNetworkPanel() {
        setModalFooterMode("done");
        el("simpleTitle").textContent = "Peers";
        const fields = el("simpleFields");
        fields.replaceChildren();

        // 1) Graphical overview of who's connected on this board.
        const graph = document.createElement("div");
        graph.className = "peer-graph";
        const self = (state.users || [])[0] || { name: "You" };
        const youNode = document.createElement("div");
        youNode.className = "peer-graph-you";
        youNode.append(avatarElement(self, true), document.createTextNode("You"));
        graph.append(youNode);

        const boardPeers = boardPeerAddresses();
        const peerList = document.createElement("div");
        peerList.className = "peer-graph-peers";
        if (!boardPeers.length) {
          const empty = document.createElement("p");
          empty.className = "confirm-text";
          empty.textContent = "No one else is discussing this board yet.";
          peerList.append(empty);
        }
        for (const addr of boardPeers) {
          const info = peerStatus(addr);
          const online = info.state !== "offline";
          const row = document.createElement("div");
          row.className = "peer-graph-peer";
          row.append(avatarElement(userForParticipant(addr), online));
          const details = document.createElement("div");
          details.className = "peer-graph-peer-info";
          const name = document.createElement("span");
          name.className = "peer-graph-peer-name";
          name.textContent = peerLabel(addr);
          const meta = document.createElement("span");
          meta.className = "peer-graph-peer-meta";
          meta.textContent = `${online ? "online" : "on hold"} - ${formatLastSeen(info.last_seen)}`;
          details.append(name, meta);
          row.append(details);
          peerList.append(row);
        }
        graph.append(peerList);
        fields.append(graph);

        // 2) Create a token so someone else can connect to this board.
        const tokenHint = document.createElement("p");
        tokenHint.className = "confirm-text";
        tokenHint.textContent =
          "Copy a token and send it to someone (email, chat, ...) so they can connect to this board.";
        fields.append(tokenHint);
        const tokenRow = document.createElement("div");
        tokenRow.className = "network-share-row";
        const copyTokenBtn = document.createElement("button");
        copyTokenBtn.type = "button";
        copyTokenBtn.textContent = "Copy token";
        copyTokenBtn.onclick = async () => {
          const token = encodeConnectToken(state.address, [state.board.uuid, state.user_profile.uuid]);
          await navigator.clipboard.writeText(token);
          showStatus("Token copied");
        };
        tokenRow.append(copyTokenBtn);
        fields.append(tokenRow);

        // 3) Connect to somebody else using a token they gave you.
        const connectHint = document.createElement("p");
        connectHint.className = "confirm-text";
        connectHint.textContent = "Received a token from someone else? Paste it here to connect.";
        fields.append(connectHint);
        const connectRow = document.createElement("div");
        connectRow.className = "network-share-row";
        const connectInput = document.createElement("input");
        connectInput.placeholder = "Paste a token";
        const connectBtn = document.createElement("button");
        connectBtn.type = "button";
        connectBtn.textContent = "Connect";
        connectBtn.onclick = () => {
          let payload;
          try {
            payload = decodeConnectToken(connectInput.value);
          } catch (error) {
            showStatus("Invalid token", true);
            return;
          }
          return run(
            () =>
              api("/api/join_discussion", {
                address: payload.address,
                topic_uuids: payload.topic_uuids,
              }),
            "Connected",
          );
        };
        connectRow.append(connectInput, connectBtn);
        fields.append(connectRow);

        // 4) Stop discussing this board with everyone currently on it.
        if (boardPeers.length) {
          const unshareBtn = document.createElement("button");
          unshareBtn.type = "button";
          unshareBtn.className = "danger";
          unshareBtn.textContent = `Stop discussing this board (${boardPeers.length})`;
          unshareBtn.onclick = () =>
            confirmAction(
              "Stop discussing this board?",
              `You and ${boardPeers.length} peer${boardPeers.length === 1 ? "" : "s"} will no longer sync this board. The board itself is not deleted.`,
              () =>
                run(
                  () => api("/api/kanban/boards/unshare", { board_uuid: state.board.uuid }),
                  "Stopped discussing this board",
                ),
            );
          fields.append(unshareBtn);
        }

        el("simpleForm").onsubmit = (event) => {
          event.preventDefault();
          el("simpleModal").close();
        };
        el("simpleModal").showModal();
      }

      function formatLastSeen(timestamp) {
        if (!timestamp) return "never";
        const seconds = Math.max(0, Date.now() / 1000 - timestamp);
        if (seconds < 60) return "just now";
        if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
        if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
        return `${Math.floor(seconds / 86400)}d ago`;
      }

      function renderBoardList() {
        const container = el("boardList");
        container.replaceChildren();
        const boards = state.boards || [];
        for (const board of boards) {
          const row = document.createElement("div");
          row.className = "board-list-row";
          if (board.uuid === state.board.uuid) row.classList.add("active");
          const name = document.createElement("span");
          name.className = "board-list-name";
          name.textContent = board.data.name || "Kanban Board";
          name.onclick = () =>
            run(
              () => api("/api/kanban/boards/select", { board_uuid: board.uuid }),
              "Board selected",
            );
          row.append(name);
          if (boards.length > 1) {
            const del = document.createElement("button");
            del.type = "button";
            del.className = "icon-btn board-list-delete";
            del.title = "Delete board";
            del.textContent = "✕";
            del.onclick = (event) => {
              event.stopPropagation();
              confirmAction(
                "Delete board?",
                `Delete "${board.data.name || "Kanban Board"}" and all cards inside it.`,
                () =>
                  run(
                    () => api("/api/kanban/boards/delete", { board_uuid: board.uuid }),
                    "Board deleted",
                  ),
              );
            };
            row.append(del);
          }
          container.append(row);
        }
        const add = document.createElement("button");
        add.type = "button";
        add.className = "board-list-add";
        add.textContent = "+ Add board";
        add.onclick = openNewBoardModal;
        container.append(add);
      }

      function openNewBoardModal() {
        const boards = state.boards || [];
        openSimple(
          "New Board",
          [
            { name: "name", label: "Name", value: "Kanban Board" },
            {
              name: "template",
              label: "Copy from (optional)",
              type: "select",
              value: "",
              options: [
                { value: "", label: "Start empty" },
                ...boards.map((board) => ({
                  value: board.uuid,
                  label: board.data.name || "Kanban Board",
                })),
              ],
            },
          ],
          async (form) => {
            const templateUuid = form.get("template");
            if (templateUuid) {
              const result = await api("/api/kanban/boards/copy", { board_uuid: templateUuid });
              if (result.value) {
                await api("/api/kanban/boards/rename", {
                  board_uuid: result.value,
                  name: form.get("name"),
                });
              }
              return result;
            }
            return api("/api/kanban/boards/create", { name: form.get("name") });
          },
        );
      }

      function renderUserPicker(containerId) {
        const container = el(containerId);
        container.replaceChildren();
        for (const user of state.users || []) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "user-choice";
          if (modalParticipants.includes(user.id)) button.classList.add("selected");
          const avatar = document.createElement("span");
          avatar.className = "participant-avatar";
          if (user.picture) {
            avatar.style.backgroundImage = `url("${cssUrl(user.picture)}")`;
          } else {
            avatar.textContent = initials(user.name);
          }
          const name = document.createElement("span");
          name.textContent = user.name;
          button.append(avatar, name);
          button.onclick = () => {
            const index = modalParticipants.indexOf(user.id);
            if (index >= 0) {
              modalParticipants.splice(index, 1);
              if (modalOwner === user.id) modalOwner = null;
            } else if (user.id) {
              modalParticipants.push(user.id);
            }
            renderUserPicker(containerId);
            renderOwnerSelect();
          };
          container.append(button);
        }
      }

      function renderOwnerSelect() {
        const select = el("cardOwner");
        select.replaceChildren();
        const blank = document.createElement("option");
        blank.value = "";
        blank.textContent = "Unassigned";
        select.append(blank);
        for (const id of modalParticipants) {
          const option = document.createElement("option");
          option.value = id;
          option.textContent = userForParticipant(id).name;
          select.append(option);
        }
        select.value = modalParticipants.includes(modalOwner) ? modalOwner : "";
        modalOwner = select.value || null;
      }

      async function loadBoard() {
        if (dragActive) return;
        try {
          state = await api("/api/kanban/board");

          // Fokus-Schutz: Das Board-Namen-Feld beim Tippen nicht überschreiben
          const boardNameInput = el("boardName");
          if (document.activeElement !== boardNameInput) {
            boardNameInput.value = state.board.data.name || "Kanban Board";
          }

          renderAutoAdoptIndicator();
          renderAutoAdoptControl();

          renderBoardList();
          renderNetwork();
          renderSelfAvatar();

          // Neues Rendering via Diffing
          renderBoard();
        } catch (error) {
          showStatus(error.message, true);
        }
      }

      function renderBoard() {
        const board = el("board");

        // Alle Spalten (regulär + ghost) aus dem State holen und markieren
        const activeCols = columns(state.board).map((c) => ({ ...c, _isGhost: false }));
        const ghostCols = ghostColumns().map((c) => ({ ...c, _isGhost: true }));
        const allCols = [...activeCols, ...ghostCols];

        // Diffing für Spalten
        reconcileDOM(
          board,
          allCols,
          (col) => `${col.uuid}:${col._isGhost ? "ghost" : "local"}`,
          (col) => renderColumn(col, col._isGhost), // Deine bestehende Funktion erstellt das Grundgerüst
          (colEl, col) => updateColumnDOM(colEl, col), // Patcht nur Änderungen
        );

        // "Add Column" Button anfügen/ans Ende schieben
        let addBtn = board.querySelector(".add-column");
        if (!addBtn) {
          addBtn = document.createElement("button");
          addBtn.className = "add-column";
          addBtn.textContent = "Add another column";
          addBtn.onclick = () =>
            openSimple(
              "Add Column",
              [{ name: "name", label: "Name", value: "New column" }],
              async (form) => api("/api/kanban/columns/create", { name: form.get("name") }),
            );
        }
        board.appendChild(addBtn);
      }

      // --- NEUE HELFER FÜR DAS DIFFING ---

      function updateColumnDOM(colEl, col) {
        // Spaltentitel-Input schützen, falls der Cursor drin ist
        const nameInput = colEl.querySelector("input");
        if (nameInput && document.activeElement !== nameInput) {
          nameInput.value = col.data.name || "Column";
        }

        const cardList = colEl.querySelector(".card-list");
        if (!cardList) return;

        // Karten für diese Spalte ermitteln
        const activeCards = cards(col).map((c) => ({ ...c, _isGhost: false }));
        const gCards = col._isGhost
          ? []
          : ghostCards(col.uuid).map((c) => ({ ...c, _isGhost: true }));
        const allCards = [...activeCards, ...gCards];

        // Diffing für Karten
        reconcileDOM(
          cardList,
          allCards,
          (card) => `${card.uuid}:${card._isGhost ? "ghost" : "local"}`,
          (card) => renderCard(card, card._isGhost), // Deine bestehende Funktion
          (cardEl, card) => updateCardDOM(cardEl, card),
        );
      }

      function updateCardDOM(cardEl, card) {
        // Aktualisiert nur Text und Klassen, erhält Drag&Drop-Listener
        const titleEl = cardEl.querySelector(".card-title");
        if (titleEl) {
          titleEl.textContent = card.data.name || "Card";
        }

        const descEl = cardEl.querySelector(".card-desc");
        if (card.data.description && descEl) {
          descEl.textContent = card.data.description || "";
        } else if (card.data.description) {
          const desc = document.createElement("div");
          desc.className = "card-desc";
          desc.textContent = card.data.description;
          titleEl?.after(desc);
        } else if (descEl) {
          descEl.remove();
        }

        const participantItems = Array.isArray(card.data.participants)
          ? card.data.participants
          : [];
        const participantsEl = cardEl.querySelector(".participants");
        if (participantItems.length) {
          const rendered = renderParticipants(participantItems, card.data.owner);
          if (participantsEl) participantsEl.replaceWith(rendered);
          else {
            const adoptEl = cardEl.querySelector(".adopt");
            cardEl.insertBefore(rendered, adoptEl || null);
          }
        } else if (participantsEl) {
          participantsEl.remove();
        }

        // P2P Konflikt-Klassen aktualisieren (nutzt deine bestehende Helper-Funktion)
        applyTransitionClass(cardEl, card.uuid);
        cardEl.querySelectorAll(".adopt, .reaffirm, .reaffirmed").forEach((button) => button.remove());
        if (needsManualAdopt(card)) {
          cardEl.append(adoptButton(card.uuid), reaffirmButton(card.uuid));
        } else if (needsReaffirmedBadge(card)) {
          cardEl.append(reaffirmedBadge(card.uuid));
        }
      }

      function renderColumn(column, ghost = false) {
        const article = document.createElement("article");
        article.className = "column";
        if (ghost) article.classList.add("ghost");
        article.draggable = !ghost;
        article.dataset.uuid = column.uuid;
        applyTransitionClass(article, column.uuid);

        const head = document.createElement("div");
        head.className = "column-head";
        const name = document.createElement("input");
        name.value = column.data.name || "Column";
        name.disabled = ghost;
        name.onchange = () =>
          run(
            () =>
              api("/api/kanban/columns/rename", {
                column_uuid: column.uuid,
                name: name.value,
              }),
            "Column renamed",
          );
        const del = icon("x", () =>
          confirmAction("Delete column?", "This deletes the column and all cards inside it.", () =>
            run(
              () =>
                api("/api/kanban/columns/delete", {
                  column_uuid: column.uuid,
                }),
              "Column deleted",
            ),
          ),
        );
        if (ghost) del.style.display = "none";
        head.append(name, del);
        const tools = document.createElement("div");
        tools.className = "adopt-tools";
        if (needsManualAdopt(column)) {
          tools.append(adoptButton(column.uuid), reaffirmButton(column.uuid));
        } else if (needsReaffirmedBadge(column)) {
          tools.append(reaffirmedBadge(column.uuid));
        }
        head.append(tools);
        article.append(head);

        const list = document.createElement("div");
        list.className = "card-list";
        list.dataset.columnUuid = column.uuid;
        if (!ghost) {
          list.ondragover = onCardDragOver;
          list.ondrop = (event) => dropCard(event, column.uuid);
        }
        cards(column).forEach((card) => list.append(renderCard(card)));
        if (!ghost) {
          ghostCards(column.uuid).forEach((card) => list.append(renderCard(card, true)));
        }
        article.append(list);

        const add = document.createElement("button");
        add.className = "add-card";
        add.textContent = "Add a card";
        add.onclick = () => openCard(null, column.uuid);
        if (!ghost) article.append(add);

        if (!ghost) {
          article.ondragstart = (event) => {
            if (event.target.closest(".card")) return;
            draggedColumn = column.uuid;
            dragActive = true;
            article.classList.add("dragging");
          };
          article.ondragend = () => {
            article.classList.remove("dragging");
            draggedColumn = null;
            dragActive = false;
          };
          article.ondragover = (event) => event.preventDefault();
          article.ondrop = (event) => dropColumn(event, column.uuid);
        }
        return article;
      }

      function renderCard(card, ghost = false) {
        const node = document.createElement("div");
        node.className = "card";
        if (ghost) node.classList.add("ghost");
        applyTransitionClass(node, card.uuid);
        node.draggable = !ghost;
        node.dataset.uuid = card.uuid;
        node.replaceChildren();
        const title = document.createElement("div");
        title.className = "card-title";
        title.textContent = card.data.name || "Card";
        node.append(title);
        if (card.data.description) {
          const desc = document.createElement("div");
          desc.className = "card-desc";
          desc.textContent = card.data.description;
          node.append(desc);
        }
        const participantItems = Array.isArray(card.data.participants)
          ? card.data.participants
          : [];
        if (participantItems.length) node.append(renderParticipants(participantItems, card.data.owner));
        if (needsManualAdopt(card)) {
          node.append(adoptButton(card.uuid), reaffirmButton(card.uuid));
        } else if (needsReaffirmedBadge(card)) {
          node.append(reaffirmedBadge(card.uuid));
        }
        node.onclick = (event) => {
          if (ghost) return;
          if (event.target.closest("button")) return;
          openCard(card, card.parent_uuid);
        };
        if (!ghost) {
          node.ondragstart = (event) => {
            draggedCard = card.uuid;
            dragActive = true;
            node.classList.add("dragging");
            event.stopPropagation();
          };
          node.ondragend = () => {
            draggedCard = null;
            dragActive = false;
            node.classList.remove("dragging");
          };
        }
        return node;
      }

      function renderParticipants(participants, ownerId) {
        const wrap = document.createElement("div");
        wrap.className = "participants";
        wrap.title = "Participants";
        const ordered =
          ownerId && participants.includes(ownerId)
            ? [ownerId, ...participants.filter((id) => id !== ownerId)]
            : participants;
        ordered.forEach((participant) => {
          const user = userForParticipant(participant);
          const isOwner = participant === ownerId;
          const avatar = document.createElement("span");
          avatar.className = "participant-avatar";
          if (isOwner) avatar.classList.add("owner");
          avatar.title = isOwner ? `${user.name} (owner)` : user.name;
          if (user.picture) {
            avatar.style.backgroundImage = `url("${cssUrl(user.picture)}")`;
            avatar.textContent = "";
          } else {
            avatar.textContent = initials(user.name);
          }
          if (user.address === state.address) avatar.classList.add("me");
          wrap.append(avatar);
        });
        return wrap;
      }
      function reconcileDOM(parent, dataItems, keyFn, createFn, updateFn) {
        const dataKeys = dataItems.map(keyFn);

        // 1. Ausmisten: Elemente entfernen, die im neuen State nicht mehr existieren
        Array.from(parent.children).forEach((child) => {
          const key = child.getAttribute("data-id");
          if (!dataKeys.includes(key)) {
            child.remove();
          }
        });

        // 2. Abgleichen & Sortieren: Bestehende updaten oder neue einfügen
        dataItems.forEach((item, index) => {
          const key = keyFn(item);
          let child = parent.querySelector(`[data-id="${key}"]`);

          if (!child) {
            // Element existiert noch nicht -> Neu erstellen
            child = createFn(item);
            child.setAttribute("data-id", key);
            parent.insertBefore(child, parent.children[index] || null);
          } else {
            // Element existiert -> Position korrigieren falls nötig
            if (parent.children[index] !== child) {
              parent.insertBefore(child, parent.children[index] || null);
            }
            // Inhalt/Attribute patchen
            updateFn(child, item);
          }
        });
      }

      function adoptButton(uuid) {
        const button = icon("Adopt", () => openAdopt(uuid));
        button.classList.add("adopt");
        return button;
      }

      function reaffirmButton(uuid) {
        const button = icon("Reaffirm", () =>
          run(
            () => api("/api/kanban/reaffirm", { node_uuid: uuid }),
            "Kept your version",
          ),
        );
        button.classList.add("reaffirm");
        button.title = "Keep my version and dismiss this divergence";
        return button;
      }

      function reaffirmedBadge(uuid) {
        const button = icon("Reaffirmed", () =>
          run(
            () => api("/api/kanban/reaffirm", { node_uuid: uuid }),
            "Reaffirm cleared",
          ),
        );
        button.classList.add("reaffirmed");
        button.title = "You kept your version - click to reopen this divergence";
        return button;
      }

      function openAdopt(uuid) {
        const peers = Object.entries(state.peers || {})
          .map(([addr, root]) => ({
            addr,
            missing: !(root && findNode(root, uuid)),
          }))
          .filter((item) => {
            const info = transitionInfo(uuid);
            return info && info.peer_addr === item.addr;
          });
        if (!peers.length) return showStatus("No peer version available", true);
        openSimple(
          "Adopt From Peer",
          [{ name: "peer", label: "Peer address", value: peers[0].addr }],
          async (form) =>
            api("/api/kanban/adopt", {
              source_addr: form.get("peer"),
              node_uuid: uuid,
              adopt_absence: peers.find((item) => item.addr === form.get("peer"))?.missing || false,
            }),
        );
      }

      function openCard(card, columnUuid) {
        modalCard = card;
        modalColumn = columnUuid;
        el("cardModalTitle").textContent = card ? "Edit Card" : "Add Card";
        el("cardName").value = card ? card.data.name || "" : "";
        el("cardDescription").value = card ? card.data.description || "" : "";
        const self = (state.users || [])[0];
        modalParticipants =
          card && Array.isArray(card.data.participants)
            ? [...card.data.participants]
            : self?.id
              ? [self.id]
              : [];
        modalOwner = card ? card.data.owner || null : self?.id || null;
        renderUserPicker("participantPicker");
        renderOwnerSelect();
        el("cardOwner").onchange = () => {
          modalOwner = el("cardOwner").value || null;
        };
        el("deleteCardBtn").style.display = card ? "inline-block" : "none";
        el("cardModal").showModal();
      }

      el("cardForm").onsubmit = async (event) => {
        event.preventDefault();
        const payload = {
          name: el("cardName").value,
          description: el("cardDescription").value,
          participants: dedupe(modalParticipants),
          owner: modalOwner || null,
        };
        if (modalCard) {
          payload.card_uuid = modalCard.uuid;
          await run(() => api("/api/kanban/cards/update", payload), "Card saved");
        } else {
          payload.column_uuid = modalColumn;
          await run(() => api("/api/kanban/cards/create", payload), "Card added");
        }
        el("cardModal").close();
      };

      el("deleteCardBtn").onclick = async () => {
        if (!modalCard) return;
        await confirmAction("Delete card?", "This removes the card from this board.", async () => {
          await run(
            () => api("/api/kanban/cards/delete", { card_uuid: modalCard.uuid }),
            "Card deleted",
          );
          el("cardModal").close();
        });
      };
      el("cancelCardBtn").onclick = () => el("cardModal").close();

      function setModalFooterMode(mode) {
        const done = mode === "done";
        el("cancelSimpleBtn").style.display = done ? "none" : "";
        el("submitSimpleBtn").textContent = done ? "Done" : "Apply";
      }

      function openSimple(title, fields, onSubmit) {
        closeSidePanel();
        setModalFooterMode("cancel-apply");
        el("simpleTitle").textContent = title;
        el("simpleFields").replaceChildren();
        for (const field of fields) {
          const label = document.createElement("label");
          label.textContent = field.label;
          let control;
          if (field.type === "select") {
            control = document.createElement("select");
            control.name = field.name;
            for (const option of field.options || []) {
              const opt = document.createElement("option");
              opt.value = option.value;
              opt.textContent = option.label;
              if (option.value === field.value) opt.selected = true;
              control.append(opt);
            }
          } else {
            control = document.createElement("input");
            control.name = field.name;
            control.value = field.value || "";
          }
          label.append(control);
          el("simpleFields").append(label);
        }
        el("simpleForm").onsubmit = async (event) => {
          event.preventDefault();
          await run(() => onSubmit(new FormData(event.currentTarget)), "Done");
          el("simpleModal").close();
        };
        el("simpleModal").showModal();
      }
      el("cancelSimpleBtn").onclick = () => el("simpleModal").close();

      function confirmAction(title, message, action) {
        closeSidePanel();
        setModalFooterMode("cancel-apply");
        el("simpleTitle").textContent = title;
        const body = document.createElement("p");
        body.className = "confirm-text";
        body.textContent = message;
        el("simpleFields").replaceChildren(body);
        el("simpleForm").onsubmit = async (event) => {
          event.preventDefault();
          try {
            await action();
            el("simpleModal").close();
          } catch (error) {
            showStatus(error.message, true);
          }
        };
        el("simpleModal").showModal();
      }

      async function dropCard(event, columnUuid) {
        event.preventDefault();
        event.stopPropagation();
        if (!draggedCard) return;
        const order = [...event.currentTarget.querySelectorAll(".card")].map(
          (item) => item.dataset.uuid,
        );
        const cardUuid = draggedCard;
        draggedCard = null;
        try {
          await run(
            () =>
              api("/api/kanban/cards/move", {
                card_uuid: cardUuid,
                column_uuid: columnUuid,
                index: Math.max(0, order.indexOf(cardUuid)),
              }),
            "Card moved",
          );
        } finally {
          dragActive = false;
          await loadBoard();
        }
      }

      async function dropColumn(event, targetUuid) {
        event.preventDefault();
        if (!draggedColumn || draggedColumn === targetUuid) return;
        const order = columns(state.board).map((item) => item.uuid);
        const index = order.indexOf(targetUuid);
        const columnUuid = draggedColumn;
        draggedColumn = null;
        try {
          await run(
            () =>
              api("/api/kanban/columns/move", {
                column_uuid: columnUuid,
                index,
              }),
            "Column moved",
          );
        } finally {
          dragActive = false;
          await loadBoard();
        }
      }

      function onCardDragOver(event) {
        event.preventDefault();
        event.stopPropagation();
        const dragging = document.querySelector(".card.dragging");
        if (!dragging) return;
        const after = cardAfterPointer(event.currentTarget, event.clientY);
        if (after) event.currentTarget.insertBefore(dragging, after);
        else event.currentTarget.append(dragging);
      }

      function cardAfterPointer(list, y) {
        return [...list.querySelectorAll(".card:not(.dragging)")].reduce(
          (best, child) => {
            const box = child.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            return offset < 0 && offset > best.offset ? { offset, child } : best;
          },
          { offset: Number.NEGATIVE_INFINITY, child: null },
        ).child;
      }

      function columns(board) {
        return sortNodes(
          (board.children || []).filter((node) => node.data.type === "kanban_column"),
        );
      }
      function cards(column) {
        return sortNodes(
          (column.children || []).filter((node) => node.data.type === "kanban_card"),
        );
      }
      function ghostColumns() {
        const localIds = new Set(columns(state.board).map((column) => column.uuid));
        const ghosts = new Map();
        for (const root of boardPeerRoots()) {
          for (const column of columns(root || { children: [] })) {
            if (!localIds.has(column.uuid) && !autoAdoptAllowsNode(column)) {
              ghosts.set(column.uuid, column);
            }
          }
        }
        return sortNodes([...ghosts.values()]);
      }
      function ghostCards(columnUuid) {
        const localColumn = findNode(state.board, columnUuid);
        const localIds = new Set(cards(localColumn || { children: [] }).map((card) => card.uuid));
        const ghosts = new Map();
        for (const root of boardPeerRoots()) {
          const peerColumn = findNode(root, columnUuid);
          for (const card of cards(peerColumn || { children: [] })) {
            if (!localIds.has(card.uuid) && !autoAdoptAllowsNode(card)) {
              ghosts.set(card.uuid, card);
            }
          }
        }
        return sortNodes([...ghosts.values()]);
      }
      function sortNodes(nodes) {
        return [...nodes].sort(
          (a, b) =>
            Number(a.data.order || 0) - Number(b.data.order || 0) ||
            a.created_at.localeCompare(b.created_at),
        );
      }
      function transitionInfo(uuid) {
        return (state.transition_by_node || {})[uuid] || null;
      }
      function applyTransitionClass(element, uuid) {
        element.classList.remove("diff");
        [...element.classList]
          .filter((name) => name.startsWith("event-"))
          .forEach((name) => element.classList.remove(name));
        element.removeAttribute("title");
        delete element.dataset.transitionLabel;
        delete element.dataset.transitionSymbol;
        const info = transitionInfo(uuid);
        if (!info || info.type === "in_agreement") return;
        element.classList.add("diff", `event-${info.type}`);
        element.title = transitionLabel(info);
        element.dataset.transitionLabel = transitionLabel(info);
        element.dataset.transitionSymbol = transitionSymbol(info.type);
      }
      function transitionSymbol(type) {
        return (
          {
            peer_made_changes: "+",
            local_missing_node: "+",
            local_made_changes: "~",
            peer_missing_node: "-",
            divergence: "!",
          }[type] || "*"
        );
      }
      function transitionLabel(info) {
        const events = (info.events || [info]).filter((event) => event.type !== "in_agreement");
        if (events.length > 1) return groupedTransitionLabel(events);
        const peer = peerLabel(info.peer_addr);
        const labels = {
          in_agreement: "In agreement",
          peer_made_changes: `Changes from ${peer}`,
          local_made_changes: `My changes not in ${peer}`,
          local_missing_node: `Only in ${peer}`,
          peer_missing_node: `Missing in ${peer}`,
          divergence: `Diverged from ${peer}`,
        };
        return labels[info.type] || "Difference";
      }
      function groupedTransitionLabel(events) {
        const order = [
          "divergence",
          "peer_made_changes",
          "local_missing_node",
          "local_made_changes",
          "peer_missing_node",
        ];
        const labels = {
          divergence: "Diverged from",
          peer_made_changes: "Changes from",
          local_missing_node: "Only in",
          local_made_changes: "My changes not in",
          peer_missing_node: "Missing in",
        };
        return order
          .filter((type) => events.some((event) => event.type === type))
          .map((type) => {
            const peers = events
              .filter((event) => event.type === type)
              .map((event) => peerLabel(event.peer_addr));
            return `${labels[type]} ${dedupe(peers).join(", ")}`;
          })
          .join("; ");
      }
      function dedupe(items) {
        return [...new Set(items)];
      }
      function peerLabel(address) {
        const user = (state.users || []).find((item) => item.address === address);
        if (user?.name) return user.name;
        const identityName = peerIdentityValue(address, "name");
        if (identityName) return identityName;
        const text = String(address || "");
        const match = text.match(/:(\d+)(?:\/)?$/);
        return match ? match[1] : text.replace(/^https?:\/\//, "") || "peer";
      }
      function peerStatus(address) {
        return (
          state.network?.peer_status?.[address] ||
          state.network?.peers?.[address]?.status || {
            state: "online",
            failures: 0,
            last_error: null,
          }
        );
      }
      function boardPeerAddresses() {
        const boardUuid = state.board?.uuid;
        if (!boardUuid) return [];
        return Object.entries(state.network?.peers || {})
          .filter(([, info]) => (info.topic_uuids || []).includes(boardUuid))
          .map(([addr]) => addr);
      }
      function boardPeerRoots() {
        return boardPeerAddresses()
          .map((addr) => state.peers?.[addr])
          .filter(Boolean);
      }
      function userForParticipant(participant) {
        const users = state.users || [];
        return (
          users.find((user) => user.id === participant) ||
          users.find((user) => user.profile_uuid === participant) ||
          users.find((user) => user.address === participant) ||
          users.find((user) => user.name === participant) || {
            id: participant,
            profile_uuid: participant,
            address: "",
            name: "?",
            picture: "",
          }
        );
      }
      function initials(name) {
        return (
          String(name || "?")
            .split(/\s+/)
            .filter(Boolean)
            .slice(0, 2)
            .map((part) => part[0].toUpperCase())
            .join("") || "?"
        );
      }
      function cssUrl(value) {
        return String(value || "")
          .replaceAll("\\", "\\\\")
          .replaceAll('"', '\\"');
      }
      function peerIdentityValue(address, field) {
        const root = (state.peers || {})[address];
        const profile = findIdentityProfile(root, address) || findIdentityProfile(root, null);
        const node = findIdentityField(profile || root, field);
        return node?.data?.value || node?.data?.[field] || "";
      }
      function findIdentityProfile(node, address) {
        if (!node) return null;
        if (
          node.data?.type === "shared_user_profile" &&
          (!address || node.data?.address === address)
        ) {
          return node;
        }
        for (const child of node.children || []) {
          const found = findIdentityProfile(child, address);
          if (found) return found;
        }
        return null;
      }
      function findIdentityField(node, field) {
        if (!node) return null;
        if (node.data?.type === "shared_user_profile") {
          if (field === "name" && node.data?.display_name)
            return { data: { value: node.data.display_name } };
          return node.data?.[field] ? node : null;
        }
        for (const child of node.children || []) {
          const found = findIdentityField(child, field);
          if (found) return found;
        }
        return null;
      }
      function findNode(node, uuid) {
        if (!node) return null;
        if (node.uuid === uuid) return node;
        for (const child of node.children || []) {
          const found = findNode(child, uuid);
          if (found) return found;
        }
        return null;
      }
      function icon(text, action) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = text;
        button.setAttribute("aria-label", text);
        button.onclick = (event) => {
          event.stopPropagation();
          action();
        };
        return button;
      }
      async function run(action, ok) {
        try {
          await action();
          showStatus(ok || "Done");
          await loadBoard();
        } catch (error) {
          showStatus(error.message, true);
        }
      }
      function showStatus(message, error = false) {
        el("statusText").textContent = message;
        el("statusText").className = error ? "toast error" : "toast";
        statusResetAt = Date.now() + 3500;
      }

      el("autoAdoptToggleBtn").onclick = () => {
        const current = AUTO_ADOPT_MODES.indexOf(state.auto_adopt_mode);
        const next = AUTO_ADOPT_MODES[(current + 1) % AUTO_ADOPT_MODES.length] || "always";
        return run(
          () => api("/api/kanban/auto_adopt", { mode: next }),
          "Auto-adopt updated",
        );
      };
      function openSidePanel() {
        el("sidePanel").classList.add("open");
        el("sidePanelOverlay").classList.add("visible");
      }
      function closeSidePanel() {
        el("sidePanel").classList.remove("open");
        el("sidePanelOverlay").classList.remove("visible");
      }
      el("menuToggleBtn").onclick = () =>
        el("sidePanel").classList.contains("open") ? closeSidePanel() : openSidePanel();
      el("sidePanelCloseBtn").onclick = closeSidePanel;
      el("sidePanelOverlay").onclick = closeSidePanel;
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeSidePanel();
      });

      el("networkBtn").onclick = openNetworkPanel;
      el("boardName").onchange = () =>
        run(
          () =>
            api("/api/kanban/boards/rename", {
              board_uuid: state.board.uuid,
              name: el("boardName").value,
            }),
          "Board renamed",
        );
      el("selfAvatarBtn").onclick = () =>
        openSimple(
          "Profile",
          [
            {
              name: "name",
              label: "Name",
              value: state.user_profile?.data?.display_name || state.address,
            },
            {
              name: "picture",
              label: "Picture URL",
              value: state.user_profile?.data?.picture || "",
            },
          ],
          async (form) =>
            api("/api/kanban/profile", {
              name: form.get("name"),
              picture: form.get("picture"),
            }),
        );
      setInterval(() => loadBoard(), 1500);
      loadBoard();
    </script>
  </body>
