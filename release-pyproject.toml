[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "s-kanban"
version = "0.1.0a1"
description = "S-Kanban reference application for Sovereign Core"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSES/*"]
dependencies = ["sovereign-core>=0.1.0,<0.2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["s_kanban*"]

[tool.setuptools.package-data]
"s_kanban.assets" = ["*.css", "*.html", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
