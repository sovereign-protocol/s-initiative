<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>S-Initiative</title>
    <link rel="stylesheet" href="/shared.css" />
    <link rel="stylesheet" href="/apps/initiative/styles.css" />
  </head>
  <body>
    <div id="toast" class="toast"></div>
    <!-- The shell owns the bar and holds nothing of an application's (U7).
         The initiative title goes in the topic region, and the adopt tools
         beside it, because that is the thing they decide about. -->
    <header class="topbar"><div id="shell"></div></header>

    <template id="initiativeHeaderControls">
      <div id="boardAdoptTools" class="adopt-tools"></div>
    </template>


    <main>
      <!-- Two faces: the board is the next few days, the mandate is what
           was agreed. Named Mandate and not Initiative because the topic is
           already called the initiative, and one word for a part and for the
           whole tells a reader nothing about either. The switch is in the
           content area and not in the shell bar (U7) - the bar's navigation
           row is destinations among topics. -->
      <div class="face-summary-row">
        <nav id="faceSwitch" class="face-switch"></nav>
        <div id="milestoneStrip" class="milestone-strip"></div>
      </div>
      <section id="board" class="board">
        <div id="boardColumns" class="board-columns"></div>
      </section>
      <section id="mandate" class="mandate-face" hidden></section>
    </main>

    <dialog id="cardModal">
      <form method="dialog" id="cardForm">
        <h2 id="cardModalTitle">Card</h2>
        <div id="cardPerspectiveSwitcher" class="perspective-switcher"></div>
        <p id="cardPerspectiveMeta" class="perspective-meta"></p>
        <label>Name<input id="cardName" /></label>
        <label>Description<textarea id="cardDescription" rows="5"></textarea></label>
        <div class="card-owner-row">
          <label>Owner<select id="cardOwner" class="ui-select"></select></label>
          <div class="card-files">
            <span class="card-files-label">Files</span>
            <input id="cardFileInput" type="file" hidden />
            <button type="button" id="attachFileBtn">Attach file…</button>
          </div>
        </div>
        <div id="cardAttachmentList" class="attachment-list"></div>
        <label>Members</label>
        <div id="participantPicker" class="user-picker"></div>
        <div id="cardComments" class="card-comments">
          <h3 class="card-comments-title">Activity</h3>
          <div id="cardCommentList" class="comment-list"></div>
          <div class="comment-add">
            <textarea id="cardCommentInput" rows="2" placeholder="Add a comment…"></textarea>
            <button type="button" id="addCommentBtn" class="primary">Comment</button>
          </div>
        </div>
        <menu>
          <button id="deleteCardBtn" type="button" class="danger">Delete</button>
          <button type="button" id="cancelCardBtn">Cancel</button>
          <button type="submit" id="saveCardBtn" class="primary">Save</button>
        </menu>
      </form>
    </dialog>

    <dialog id="simpleModal">
      <form method="dialog" id="simpleForm">
        <h2 id="simpleTitle">Action</h2>
        <div id="simpleFields"></div>
        <menu>
          <button type="button" id="cancelSimpleBtn">Cancel</button>
          <button type="submit" id="submitSimpleBtn" class="primary">Apply</button>
        </menu>
      </form>
    </dialog>

    <dialog id="confirmModal">
      <h2 id="confirmModalTitle">Action</h2>
      <p id="confirmModalMessage" class="confirm-text"></p>
      <menu>
        <button type="button" id="confirmModalCancelBtn">Cancel</button>
        <button type="button" id="confirmModalConfirmBtn" class="danger">Confirm</button>
      </menu>
    </dialog>

    <script src="/shared-api.js"></script>
    <script src="/shared.js"></script>
    <script>
      let state = null;
      let draggedCard = null;
      let dragActive = false;
      let modalCard = null;
      let modalColumn = null;
      let modalParticipants = [];
      let modalOwner = null;
      let modalPerspectiveKey = null;
      let modalPerspectiveOptions = [];
      let modalLocalDraft = null;
      let modalReadOnlyPerspective = false;

      // Which face is showing, and anything the mandate face is
      // remembering about itself. In JS and never in the DOM: that face
      // re-renders wholesale on every payload, so a surface trusted to hold
      // its own open/closed state loses it every 1500ms, and DOM patching is
      // not the fix for that.
      //
      // The face is not remembered across a reload. Opening lands on the
      // board, every time - a remembered face means one link opens two
      // different pages for two people.
      const ephemeral = {
        face: "board",
        disclosures: {},
        drafts: {},
      };
      // What the mandate face last drew, so an unchanged payload does not
      // rebuild it. Deliberately not the node's `revision`: peer liveness is
      // merged into the snapshot after it is read, so a transport change may
      // not advance it and the face would freeze.
      let renderedMandateJson = null;

      // The stored values remain compatible with existing clients; the
      // visible contract is framed around team-view changes. Individual
      // views and contributions are author-owned and never enter this choice.
      const AUTO_ADOPT_MODES = ["never", "not_member", "not_owner", "always"];
      const AUTO_ADOPT_LABELS = {
        never: "Review every change",
        not_member: "Review changes involving me",
        not_owner: "Review changes I'm responsible for",
        always: "Adopt every change automatically",
      };
      const AUTO_ADOPT_FILL = { always: 4, not_owner: 2, not_member: 1, never: 0 };
      const AUTO_ADOPT_DESCRIPTIONS = {
        never:
          "Every team-view change waits for your review. Individual views and contributions are shared without adoption and remain owned by their author.",
        not_member:
          "Team-view changes involving you wait for review; other changes are adopted automatically. Individual views and contributions remain author-owned.",
        not_owner:
          "Team-view changes you are responsible for wait for review; other changes are adopted automatically. Individual views and contributions remain author-owned.",
        always:
          "Every team-view change is adopted automatically. Individual views and contributions remain author-owned.",
      };

      const el = (id) => document.getElementById(id);

      function needsReaction(node) {
        return Boolean(transitionInfo(node.uuid)?.reactable);
      }

      // A ghost is the seat a card has left: the position one side still
      // gives it after the other has moved or deleted it. The solid card is
      // always the current decision, wherever it now sits - the peer's if
      // they made the move and we have not taken it yet, ours if we made it.
      // Whoever is behind sees the ghost until they catch up, which is the
      // same rule read from either screen.
      function peerRootOf(node) {
        const info = transitionInfo(node.uuid);
        return info?.peer_addr ? state.peers?.[info.peer_addr] || null : null;
      }

      function peerCopyOf(node) {
        const root = peerRootOf(node);
        return root ? findNode(root, node.uuid) : null;
      }

      function movedByPeer(localNode) {
        // The peer moved or deleted this and we have not taken it: our copy
        // marks the seat it left, theirs holds the current one.
        const info = transitionInfo(localNode.uuid);
        if (!info || info.stage !== "awaiting_me") return false;
        const root = peerRootOf(localNode);
        // Without their tree there is no second position to know about, so
        // nothing has been displaced as far as this screen can tell.
        if (!root) return false;
        const peerNode = findNode(root, localNode.uuid);
        if (!peerNode || peerNode.deleted) return true;
        return peerNode.parent_uuid !== localNode.parent_uuid;
      }

      function movedByMe(peerNode) {
        // The mirror image: I moved or deleted it and the peer still shows
        // the old seat. Deliberately not drawn while my change is only
        // "in_flight" - that stage means nobody has been seen holding out
        // yet, and a ghost that flashes up after every move I make would say
        // nothing except that syncing takes a moment. "awaiting_peer" is the
        // fact that they have observed my revision and kept theirs, which is
        // exactly when their copy becomes a seat somebody is still sitting
        // in. So auto-adopting peers never produce a ghost here at all.
        //
        // A conflict is drawn the same way for want of a better answer: with
        // both sides having moved there is no agreed seat, so ours stays
        // solid and theirs shows as the position they are still arguing for.
        const info = transitionInfo(peerNode.uuid);
        if (!info || !["awaiting_peer", "conflict"].includes(info.stage)) {
          return false;
        }
        const localNode = findNode(state.initiative, peerNode.uuid);
        if (!localNode || localNode.deleted) return true;
        return localNode.parent_uuid !== peerNode.parent_uuid;
      }

      function peerOnlyNode(peerNode) {
        // Nothing was displaced - the peer simply holds something we have
        // never had. There is no seat to mark, so the ghost stands for the
        // node itself, as it always has.
        const info = transitionInfo(peerNode.uuid);
        if (!info || info.stage !== "awaiting_me") return false;
        return !findNode(state.initiative, peerNode.uuid);
      }

      function currentSeatOf(node) {
        // The copy drawn solid for this uuid, or null when every side that
        // had it has let it go - a deletion nobody has answered yet.
        const local = findNode(state.initiative, node.uuid);
        if (!local || local.deleted) return null;
        if (!movedByPeer(local)) return local;
        const peerNode = peerCopyOf(local);
        return peerNode && !peerNode.deleted ? peerNode : null;
      }

      function localViewOf(node) {
        // A card drawn at the seat the peer moved it to is their copy. The
        // dialog compares versions and writes to ours, so it must be opened
        // on the local node even when the tile came from their tree.
        const local = findNode(state.initiative, node.uuid);
        return local && !local.deleted ? local : node;
      }

      function isContainerOnlyDivergence(node) {
        // True when a container's own fields match the peer's copy exactly,
        // and the only reason it shows as diverged is that its content_hash
        // depends on its children (e.g. a card moved in or out) - that's
        // already surfaced on the child itself, so a separate "Adopt" here
        // would just be noise for the same underlying event.
        const peerNode = peerCopyOf(node);
        if (!peerNode) return false;
        return (
          JSON.stringify(node.data) === JSON.stringify(peerNode.data) &&
          JSON.stringify(node.weights || {}) === JSON.stringify(peerNode.weights || {}) &&
          (node.data.type === "initiative" || node.parent_uuid === peerNode.parent_uuid)
        );
      }

      function renderAutoAdoptSquare(container, mode = state.auto_adopt_mode) {
        container.replaceChildren();
        const filled = AUTO_ADOPT_FILL[mode] ?? 4;
        for (let i = 0; i < 4; i++) {
          const cell = document.createElement("span");
          cell.className = "auto-adopt-cell";
          if (i < filled) cell.classList.add("filled");
          container.append(cell);
        }
      }

      const api = SovereignApi.request;

      function renderNetwork() {
        // The shell draws the cluster; S-Initiative only says which peers
        // belong to this initiative and what each of them looks like.
        SovereignShell.refresh();
      }

      function renderSelfAvatar() {
        // Core owns the profile, so the shell draws and edits the avatar.
        SovereignShell.refreshAvatar();
      }

      function avatarElement(user, online) {
        const avatar = document.createElement("span");
        avatar.className = "header-avatar";
        avatar.classList.add(online ? "status-online" : "status-offline");
        if (user.picture) {
          avatar.style.backgroundImage = `url("${cssUrl(user.picture)}")`;
        } else {
          avatar.textContent = initials(user.name);
        }
        return avatar;
      }

      function peerPresence(addr) {
        // One presence answer per peer: relay peers get real liveness from
        // presence-file mtimes (server-attached channel_liveness) - their
        // http-shaped peer_status is always "online, never seen", which
        // made a stopped relay peer look permanently alive. Direct peers
        // keep the http status.
        const relayLive = state.network?.peers?.[addr]?.channel_liveness;
        if (relayLive) {
          if (relayLive.state === "alive") {
            const ago = Math.max(0, Math.round(relayLive.last_seen_seconds_ago || 0));
            return { online: true, metaText: `online - relay, ${ago}s ago` };
          }
          if (relayLive.state === "stale") {
            const ago = Math.round(relayLive.last_seen_seconds_ago || 0);
            return { online: false, metaText: `stale - last relay heartbeat ${ago}s ago` };
          }
          return { online: false, metaText: "no relay heartbeat yet" };
        }
        const info = peerStatus(addr);
        const online = info.state !== "offline";
        return {
          online,
          metaText: `${online ? "online" : "on hold"} - ${formatLastSeen(info.last_seen)}`,
        };
      }

      function formatLastSeen(timestamp) {
        if (!timestamp) return "never";
        const seconds = Math.max(0, Date.now() / 1000 - timestamp);
        if (seconds < 60) return "just now";
        if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
        if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
        return `${Math.floor(seconds / 86400)}d ago`;
      }

      const AGENDA_PRIORITY_LABELS = { "": "No priority", high: "High", medium: "Medium", low: "Low" };

      function highlightCard(uuid) {
        const target = document.querySelector(`[data-uuid="${uuid}"]`);
        if (!target) return;
        SovereignShell.closeCollab();
        target.scrollIntoView({ behavior: "smooth", block: "center" });
        target.classList.add("highlight-flash");
        setTimeout(() => target.classList.remove("highlight-flash"), 1500);
      }

      function initiativeUsers() {
        const initiativePeers = new Set(initiativePeerAddresses());
        return (state.users || []).filter(
          (user) => user.address === state.address || initiativePeers.has(user.address),
        );
      }

      function pickerCandidates() {
        // New assignments are restricted to current initiative members,
        // but someone already assigned before they (or we) left the
        // initiative must stay visible here too - otherwise there's no way to
        // ever remove that stale assignment again, since they'd never appear
        // in the list.
        const members = initiativeUsers();
        const memberIds = new Set(members.map((user) => user.id));
        const already = modalParticipants
          .filter((id) => !memberIds.has(id))
          .map((id) => userForParticipant(id));
        return [...members, ...already];
      }

      function renderUserPicker(containerId) {
        const container = el(containerId);
        container.replaceChildren();
        for (const user of pickerCandidates()) {
          const button = document.createElement("button");
          button.type = "button";
          button.disabled = modalReadOnlyPerspective;
          button.className = "user-choice";
          if (modalParticipants.includes(user.id)) button.classList.add("selected");
          const avatar = SovereignUI.avatar(user, {
            className: "participant-avatar",
            self: user.address === state.address,
          });
          const name = document.createElement("span");
          name.textContent = user.name;
          button.append(avatar, name);
          button.onclick = () => {
            const index = modalParticipants.indexOf(user.id);
            if (index >= 0) {
              modalParticipants.splice(index, 1);
              if (modalOwner === user.id) modalOwner = null;
            } else if (user.id) {
              modalParticipants.push(user.id);
            }
            renderUserPicker(containerId);
            renderOwnerSelect();
          };
          container.append(button);
        }
      }

      function renderOwnerSelect() {
        const select = el("cardOwner");
        SovereignUI.selectOptions(
          select,
          modalParticipants.map((id) => [id, userForParticipant(id).name]),
          {
            emptyLabel: "Unassigned",
            value: modalParticipants.includes(modalOwner) ? modalOwner : "",
            disabled: modalReadOnlyPerspective,
          },
        );
        modalOwner = select.value || null;
      }

      async function loadBoard() {
        if (dragActive || el("boardColumns")?.dataset.reordering === "true") return;
        try {
          state = await api("/api/initiative/board");

          // Core owns the name of the topic in every application's bar.
          // Reaching another initiative is the Cockpit's, not a list of
          // this client's initiatives hidden in this one's header.
          SovereignShell.setTopicName({
            label: "Initiative",
            title: state.initiative.data.name || "Initiative",
            onRename: (name) => run(
              () => api("/api/initiative/initiatives/rename", {
                initiative_uuid: state.initiative.uuid,
                name,
              }),
              "Initiative renamed",
            ),
          });

          renderBoardAdoptTools();

          renderNetwork();
          renderSelfAvatar();

          renderFaceSwitch();
          // One fetch, and only the face you are looking at is drawn. The
          // two render differently on purpose (DESIGN_INITIATIVE_UI.md 8):
          // the board patches because drag-and-drop needs stable element
          // identity across renders, the mandate face rebuilds because a
          // create/update pair per node type is a silent bug class this
          // codebase has already met. This is the one place they meet.
          if (ephemeral.face === "mandate") renderMandate();
          else renderBoard();
        } catch (error) {
          showToast(error.message, true);
        }
      }

      function showFace(face) {
        ephemeral.face = face;
        el("board").hidden = face !== "board";
        el("mandate").hidden = face !== "mandate";
        el("milestoneStrip").hidden = face !== "board";
        // The face was hidden while the payload moved on, so the skip check
        // below has nothing useful to compare against.
        renderedMandateJson = null;
        renderFaceSwitch();
        if (face === "mandate") renderMandate();
        else renderBoard();
      }

      // Two items, the current one marked. Named after the two objects the
      // domain already has, so naming a face after the thing it shows needs
      // no explanation (U8).
      const FACES = [
        ["board", "Board"],
        ["mandate", "Mandate"],
      ];

      function renderFaceSwitch() {
        const nav = el("faceSwitch");
        nav.replaceChildren();
        for (const [face, label] of FACES) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "face-switch-item";
          button.textContent = label;
          const current = ephemeral.face === face;
          button.setAttribute("aria-current", current ? "page" : "false");
          button.onclick = () => showFace(face);
          nav.append(button);
        }
      }

      // The mandate face rebuilds itself whole, and does not use
      // reconcileDOM. DESIGN_INITIATIVE_UI.md 8 gives the reason: the helper
      // needs a create/update pair per node type, this face will have seven,
      // and a pair falling out of step draws the old thing until something
      // forces a rebuild.
      function renderMandate() {
        const article = el("mandate");
        // Never rebuild it while it is being typed into, or the 1500ms poll
        // empties the box mid-word.
        if (
          article.contains(document.activeElement) &&
          (document.activeElement.isContentEditable ||
            document.activeElement.matches("input, textarea, select"))
        ) return;
        const initiative = state.initiative;
        if (!initiative) {
          article.replaceChildren();
          renderedMandateJson = null;
          return;
        }
        const encoded = mandateFingerprint(initiative);
        if (encoded === renderedMandateJson) return;
        renderedMandateJson = encoded;
        article.replaceChildren(
          mandateHead(initiative),
          relationshipsRegion(initiative),
          milestonesRegion(initiative),
          needsRegion(initiative),
          resourcesRegion(),
          approachRegion(initiative),
          assessedImpactRegion(initiative),
        );
      }

      function milestoneNodes(initiative) {
        return sortNodes(
          (initiative?.children || []).filter(
            (child) => !child.deleted && child.data.type === "initiative_milestone",
          ),
        );
      }

      function realityNodes(parent) {
        return (parent?.children || [])
          .filter((child) => !child.deleted && child.data.type === "initiative_reality")
          .sort((left, right) =>
            String(left.data.recorded_at || left.created_at || "").localeCompare(
              String(right.data.recorded_at || right.created_at || ""),
            ),
          );
      }

      function recordDate(value) {
        if (!value) return "";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;
        return date.toLocaleString(undefined, {
          day: "numeric", month: "short", year: "numeric",
          hour: "2-digit", minute: "2-digit",
        });
      }

      const AUTHOR_SCOPE_MARK =
        '<circle cx="12" cy="8" r="3.5"></circle>' +
        '<path d="M5 21v-2a7 7 0 0 1 14 0v2"></path>';

      function authorScopeMark(author, contribution = false) {
        const mark = document.createElement("span");
        mark.className = "author-scope-mark";
        const kind = contribution ? "Author-owned contribution" : "Individual view";
        mark.title = `${kind} by ${author || "unknown author"}. Only the author can change or remove it.`;
        mark.setAttribute("aria-label", mark.title);
        mark.setAttribute("role", "img");
        mark.tabIndex = 0;
        mark.innerHTML =
          `<svg viewBox="0 0 24 24" aria-hidden="true" class="icon-svg">` +
          `${AUTHOR_SCOPE_MARK}</svg>`;
        return mark;
      }

      function mandateRegion(title) {
        const section = document.createElement("section");
        section.className = "mandate-region";
        const heading = document.createElement("h3");
        heading.className = "mandate-region-title";
        heading.textContent = title;
        section.append(heading);
        return section;
      }

      // Region 6. These are authored observations: appended in time, never
      // edited or reordered, and never given a divergence lamp.
      function assessedImpactRegion(initiative) {
        const section = mandateRegion("Assessed Impact");
        const list = document.createElement("div");
        list.className = "record-list";
        const records = realityNodes(initiative);
        if (!records.length) {
          const empty = document.createElement("p");
          empty.className = "mandate-empty";
          empty.textContent = "No assessments recorded yet.";
          list.append(empty);
        }
        for (const reality of records) list.append(realityRow(reality));
        section.append(list, realityComposer(initiative.uuid));
        return section;
      }

      function realityComposer(parentUuid) {
        return SovereignUI.addComposer({
          noun: "assessment",
          placeholder: "What happened?",
          onSubmit: async (text) => {
            await api("/api/initiative/realities/create", {
              parent_uuid: parentUuid, text,
            });
            showToast("Assessment recorded");
            await loadBoard();
          },
          onError: (error) => showToast(error.message, true),
        });
      }

      function realityRow(reality) {
        const row = document.createElement("article");
        row.className = "record-row";
        const text = document.createElement("p");
        text.className = "record-text";
        text.textContent = reality.data.text || "";
        const meta = document.createElement("p");
        meta.className = "record-meta";
        const author = actorName(reality.data.author_actor_uuid) || "Unknown actor";
        meta.append(
          authorScopeMark(author),
          document.createTextNode(`${author} · ${
            recordDate(reality.data.recorded_at || reality.created_at)
          }`),
        );
        row.append(text, meta);
        if (reality.data.author_actor_uuid === state.user_profile?.uuid) {
          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "record-delete";
          remove.textContent = "Remove";
          remove.onclick = () => run(
            () => api("/api/initiative/realities/delete", {
              reality_uuid: reality.uuid,
            }),
            "Assessment removed",
          );
          row.append(remove);
        }
        return row;
      }

      // Region 4. Membership comes from holding the topic. Each line shows
      // the head of an immutable availability chain; only your line can append.
      function resourcesRegion() {
        const section = mandateRegion("Resources");
        const list = document.createElement("div");
        list.className = "resource-list";
        for (const resource of state.resources || []) {
          list.append(resourceRow(resource));
        }
        section.append(list);
        return section;
      }

      function resourceRow(resource) {
        const row = document.createElement("article");
        row.className = "resource-row";
        const user = resource.user || {};
        const mine = resource.actor_uuid === state.user_profile?.uuid;
        const presence = mine ? {online: true} : peerPresence(user.address);
        const head = document.createElement("div");
        head.className = "resource-head";
        head.append(SovereignUI.avatar(user, {self: mine}));
        const body = document.createElement("div");
        body.className = "resource-body";
        const name = document.createElement("strong");
        name.textContent = user.name || "Unknown actor";
        const identity = document.createElement("div");
        identity.className = "resource-identity";
        identity.append(name, authorScopeMark(user.name || "Unknown actor"));
        body.append(identity);
        if (resource.head) {
          const availability = document.createElement("p");
          availability.className = "resource-availability";
          availability.textContent = resource.head.data.availability || "";
          const meta = document.createElement("p");
          meta.className = "record-meta";
          meta.textContent = `${presence.online ? "Recorded" : "Last seen"} ${
            recordDate(resource.head.data.recorded_at || resource.head.created_at)
          }`;
          body.append(availability, meta);
        } else {
          const empty = document.createElement("p");
          empty.className = "record-meta";
          empty.textContent = "No availability recorded";
          body.append(empty);
        }
        head.append(body);
        row.append(head);
        if (mine && (resource.history || []).length) {
          const disclosure = SovereignUI.disclosure("Earlier commitments", {
            expanded: Boolean(ephemeral.disclosures[`resource-${resource.actor_uuid}`]),
            onToggle: (open) => {
              ephemeral.disclosures[`resource-${resource.actor_uuid}`] = open;
            },
          });
          for (const item of resource.history) {
            disclosure.content.append(investmentRecord(item));
          }
          row.append(disclosure.section);
        }
        if (mine) {
          row.append(SovereignUI.addComposer({
            noun: "availability",
            placeholder: "What can you commit?",
            onSubmit: async (availability) => {
              await api("/api/initiative/investments/create", {
                actor_uuid: resource.actor_uuid, availability,
              });
              showToast("Availability recorded");
              await loadBoard();
            },
            onError: (error) => showToast(error.message, true),
          }));
        }
        return row;
      }

      function investmentRecord(investment) {
        const item = document.createElement("p");
        item.className = "investment-record";
        item.textContent = `${investment.data.availability || ""} · ${
          recordDate(investment.data.recorded_at || investment.created_at)
        }`;
        return item;
      }

      // Region 1. Milestones and their single Intention are planned here;
      // reached_at is shown here as a claim rather than an editable date.
      function milestonesRegion(initiative) {
        const section = mandateRegion("Milestones");
        const list = document.createElement("div");
        list.className = "milestone-list";
        const milestones = milestoneNodes(initiative);
        if (!milestones.length) {
          const empty = document.createElement("p");
          empty.className = "mandate-empty";
          empty.textContent = "No milestones yet.";
          list.append(empty);
        }
        for (const milestone of milestones) list.append(milestoneBlock(milestone));
        SovereignUI.reorderableList({
          container: list,
          itemSelector: ".milestone-block",
          getId: (block) => block.dataset.uuid,
          onMove: ({id, index}) => api("/api/initiative/milestones/move", {
            milestone_uuid: id, index,
          }),
          onChanged: async () => {
            showToast("Milestone moved");
            await loadBoard();
          },
          onError: error => showToast(error.message, true),
        });
        section.append(list, SovereignUI.addComposer({
          noun: "milestone",
          placeholder: "Milestone title",
          onSubmit: async (title) => {
            await api("/api/initiative/milestones/create", {title});
            showToast("Milestone added");
            await loadBoard();
          },
          onError: (error) => showToast(error.message, true),
        }));
        return section;
      }

      function milestoneBlock(milestone) {
        const block = document.createElement("article");
        block.className = "milestone-block";
        block.dataset.uuid = milestone.uuid;
        const head = document.createElement("header");
        head.className = "milestone-head";
        head.append(SovereignUI.reorderHandle({label: "Reorder milestone"}));
        head.append(SovereignUI.editableText({
          tag: "h4",
          className: "milestone-title",
          value: milestone.data.title || "",
          placeholder: "Milestone title",
          onCommit: (title) => api("/api/initiative/milestones/update", {
            milestone_uuid: milestone.uuid, title,
          }),
          onChanged: async () => {
            showToast("Milestone saved");
            await loadBoard();
          },
          onError: (error) => showToast(error.message, true),
        }));
        const planned = document.createElement("input");
        planned.type = "date";
        planned.className = "milestone-date";
        planned.value = milestone.data.planned_at || "";
        planned.setAttribute("aria-label", "Planned date");
        planned.title = "Planned date";
        planned.onchange = () => run(
          () => api("/api/initiative/milestones/update", {
            milestone_uuid: milestone.uuid, planned_at: planned.value,
          }),
          "Milestone date saved",
        );
        head.append(planned, reachedDate(milestone), ...reactionTools(milestone));
        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "need-delete";
        remove.textContent = "Remove";
        remove.onclick = () => run(
          () => api("/api/initiative/milestones/delete", {
            milestone_uuid: milestone.uuid,
          }),
          "Milestone removed",
        );
        head.append(remove);
        block.append(head);
        const intention = document.createElement("div");
        intention.className = "milestone-intention";
        const label = document.createElement("h5");
        label.textContent = "Intention";
        intention.append(label, SovereignUI.editableText({
          tag: "p",
          className: "milestone-intention-text",
          value: milestone.data.intention || "",
          placeholder: "What should this milestone change and for whom?",
          onCommit: (value) => api("/api/initiative/milestones/update", {
            milestone_uuid: milestone.uuid, intention: value,
          }),
          onChanged: async () => {
            showToast("Intention saved");
            await loadBoard();
          },
          onError: (error) => showToast(error.message, true),
        }));
        const assessments = document.createElement("div");
        assessments.className = "milestone-assessments";
        for (const reality of realityNodes(milestone)) {
          assessments.append(realityRow(reality));
        }
        assessments.append(realityComposer(milestone.uuid));
        block.append(intention, assessments);
        applyTransitionClass(block, milestone.uuid, {});
        return block;
      }

      function sections(initiative) {
        return sortNodes(
          (initiative?.children || []).filter(
            (child) => !child.deleted && child.data.type === "initiative_section",
          ),
        );
      }

      function clauses(parent) {
        return sortNodes(
          (parent?.children || []).filter(
            (child) => !child.deleted && child.data.type === "initiative_clause",
          ),
        );
      }

      // Region 5, and it arrives collapsed. It is the longest region and the
      // least often changed, and S-Team learned in use that leading with the
      // long text buried the team behind its own text.
      //
      // The seeded sections are ordinary content from the moment they
      // exist - renamable, reorderable, deletable, and a third added by the
      // same composer. Nothing here marks them as special, because nothing
      // about them is.
      function approachRegion(initiative) {
        const disclosure = SovereignUI.disclosure("Approach", {
          className: "mandate-region",
          expanded: Boolean(ephemeral.disclosures.approach),
          onToggle: (open) => {
            ephemeral.disclosures.approach = open;
          },
        });
        const list = document.createElement("div");
        list.className = "section-list";
        for (const section of sections(initiative)) {
          list.append(sectionBlock(section));
        }
        SovereignUI.reorderableList({
          container: list,
          itemSelector: ".approach-section",
          getId: (block) => block.dataset.uuid,
          onMove: ({id, index}) => api("/api/initiative/sections/move", {
            section_uuid: id, index,
          }),
          onChanged: async () => {
            showToast("Section moved");
            await loadBoard();
          },
          onError: error => showToast(error.message, true),
        });
        disclosure.content.append(list, SovereignUI.addComposer({
          noun: "section",
          placeholder: "Section title",
          onSubmit: async (title) => {
            await api("/api/initiative/sections/create", {title});
            showToast("Section added");
            await loadBoard();
          },
          onError: (error) => showToast(error.message, true),
        }));
        return disclosure.section;
      }

      function sectionBlock(section) {
        const block = document.createElement("article");
        block.className = "approach-section";
        block.dataset.uuid = section.uuid;

        const head = document.createElement("header");
        head.className = "approach-section-head";
        head.append(SovereignUI.reorderHandle({label: "Reorder section"}));
        head.append(SovereignUI.editableText({
          tag: "h4",
          className: "approach-section-title",
          value: section.data.title || "",
          placeholder: "Section title",
          onCommit: (value) => api("/api/initiative/sections/rename", {
            section_uuid: section.uuid,
            title: value,
          }),
          onChanged: async () => {
            showToast("Section renamed");
            await loadBoard();
          },
          onError: (error) => showToast(error.message, true),
        }));
        const actions = document.createElement("div");
        actions.className = "approach-section-actions";
        actions.append(...reactionTools(section));
        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "need-delete";
        remove.textContent = "Remove";
        remove.onclick = () => run(
          () => api("/api/initiative/sections/delete", {
            section_uuid: section.uuid,
          }),
          "Section removed",
        );
        actions.append(remove);
        head.append(actions);

        const list = document.createElement("div");
        list.className = "clause-list";
        for (const clause of clauses(section)) list.append(clauseRow(clause));
        // Within its own section and never across one: moving a line into a
        // different section is deleting it there and writing it here, and a
        // drag that quietly rewrote which section a line belongs to would be
        // the interface deciding something the headings say.
        SovereignUI.reorderableList({
          container: list,
          itemSelector: ".clause-row",
          getId: (row) => row.dataset.uuid,
          onMove: ({id, index}) => api("/api/initiative/clauses/move", {
            clause_uuid: id, index,
          }),
          onChanged: async () => {
            showToast("Clause moved");
            await loadBoard();
          },
          onError: error => showToast(error.message, true),
        });

        block.append(head, list, SovereignUI.addComposer({
          noun: "clause",
          placeholder: "Add a line",
          onSubmit: async (text) => {
            await api("/api/initiative/clauses/create", {
              parent_uuid: section.uuid, text,
            });
            showToast("Clause added");
            await loadBoard();
          },
          onError: (error) => showToast(error.message, true),
        }));
        applyTransitionClass(block, section.uuid, {});
        return block;
      }

      function clauseRow(clause) {
        const row = document.createElement("div");
        row.className = "clause-row";
        row.dataset.uuid = clause.uuid;
        row.append(SovereignUI.reorderHandle({label: "Reorder clause"}));
        row.append(SovereignUI.editableText({
          tag: "p",
          className: "clause-text",
          value: clause.data.text || "",
          placeholder: "Say what is meant",
          onCommit: (value) => api("/api/initiative/clauses/update", {
            clause_uuid: clause.uuid,
            text: value,
          }),
          onChanged: async () => {
            showToast("Clause saved");
            await loadBoard();
          },
          onError: (error) => showToast(error.message, true),
        }));
        const actions = document.createElement("div");
        actions.className = "clause-actions";
        actions.append(...reactionTools(clause));
        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "need-delete";
        remove.textContent = "Remove";
        remove.onclick = () => run(
          () => api("/api/initiative/clauses/delete", {clause_uuid: clause.uuid}),
          "Clause removed",
        );
        actions.append(remove);
        row.append(actions);
        applyTransitionClass(row, clause.uuid, {});
        return row;
      }

      // Everything the face draws from, and nothing else. It has to be the
      // whole node and not `initiative.data`: the regions below the head are
      // built from its *children*, so keying the skip on the topic's own
      // fields would leave a need somebody just added invisible until an
      // unrelated edit happened to move the objective. Peer state counts too
      // - the lamp comes from transition_by_node and the beneficiary's live
      // name from users, and neither of those touches this tree at all.
      function mandateFingerprint(initiative) {
        return JSON.stringify([
          initiative,
          state.transition_by_node || {},
          state.users || [],
          state.resources || [],
          state.relationships || [],
          state.relationship_candidates || [],
          state.relationship_kinds || [],
          state.network || {},
        ]);
      }

      function needs(initiative) {
        return sortNodes(
          (initiative?.children || []).filter(
            (child) => !child.deleted && child.data.type === "initiative_need",
          ),
        );
      }

      // Region 2. Content, so it is edited in place, reordered, and carries a
      // divergence lamp - which is the half that tells it apart from a record
      // further down the page.
      function needsRegion(initiative) {
        const section = document.createElement("section");
        section.className = "mandate-region";
        const heading = document.createElement("h3");
        heading.className = "mandate-region-title";
        heading.textContent = "Needs";
        const list = document.createElement("div");
        list.className = "need-list";
        const items = needs(initiative);
        if (!items.length) {
          const empty = document.createElement("p");
          empty.className = "mandate-empty";
          empty.textContent = "No needs recorded yet.";
          list.append(empty);
        }
        for (const need of items) list.append(needRow(need));
        SovereignUI.reorderableList({
          container: list,
          itemSelector: ".need-row",
          getId: (row) => row.dataset.uuid,
          onMove: ({id, index}) => api("/api/initiative/needs/move", {
            need_uuid: id, index,
          }),
          onChanged: async () => {
            showToast("Need moved");
            await loadBoard();
          },
          onError: error => showToast(error.message, true),
        });
        section.append(heading, list, needComposer());
        return section;
      }

      function needRow(need) {
        const row = document.createElement("div");
        row.className = "need-row";
        row.dataset.uuid = need.uuid;
        row.append(SovereignUI.reorderHandle({label: "Reorder need"}));

        const body = document.createElement("div");
        body.className = "need-body";
        body.append(SovereignUI.editableText({
          tag: "p",
          className: "need-text",
          value: need.data.text || "",
          placeholder: "What is being addressed?",
          onCommit: (value) => api("/api/initiative/needs/update", {
            need_uuid: need.uuid,
            text: value,
          }),
          onChanged: async () => {
            showToast("Need saved");
            await loadBoard();
          },
          onError: (error) => showToast(error.message, true),
        }), beneficiaryLine(need));

        const actions = document.createElement("div");
        actions.className = "need-actions";
        actions.append(...reactionTools(need));
        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "need-delete";
        remove.textContent = "Remove";
        remove.onclick = () => run(
          () => api("/api/initiative/needs/delete", {need_uuid: need.uuid}),
          "Need removed",
        );
        actions.append(remove);

        row.append(body, actions);
        applyTransitionClass(row, need.uuid, {});
        return row;
      }

      // The label is the primary fact, because the beneficiary of a need is
      // very often not an actor in this system at all. Where the uuid does
      // resolve to somebody this client holds, the live name is drawn
      // *beside* the label and not instead of it - the two disagreeing is
      // information, so hiding one of them would throw it away.
      function beneficiaryLine(need) {
        const line = document.createElement("p");
        line.className = "need-beneficiary";
        const label = SovereignUI.editableText({
          tag: "span",
          className: "need-beneficiary-label",
          value: need.data.beneficiary_label || "",
          placeholder: "Whose need is it?",
          onCommit: (value) => api("/api/initiative/needs/update", {
            need_uuid: need.uuid,
            beneficiary_label: value,
          }),
          onChanged: async () => {
            showToast("Beneficiary saved");
            await loadBoard();
          },
          onError: (error) => showToast(error.message, true),
        });
        line.append(label);
        const live = actorName(need.data.beneficiary_actor_uuid);
        if (live && live !== (need.data.beneficiary_label || "")) {
          const known = document.createElement("span");
          known.className = "need-beneficiary-actor";
          known.textContent = `known here as ${live}`;
          line.append(known);
        }
        return line;
      }

      function actorName(actorUuid) {
        if (!actorUuid) return "";
        const user = (state.users || []).find((item) => item.id === actorUuid);
        return user?.name || "";
      }

      function needComposer() {
        return SovereignUI.addComposer({
          noun: "need",
          placeholder: "What is being addressed?",
          onSubmit: async (text) => {
            await api("/api/initiative/needs/create", {text});
            showToast("Need added");
            await loadBoard();
          },
          onError: (error) => showToast(error.message, true),
        });
      }

      // The head is not a disclosure. Intention and dates are always open:
      // they are the answer to "what is this", and belong first on the face.
      function mandateHead(initiative) {
        const head = document.createElement("header");
        head.className = "mandate-head";
        const label = document.createElement("h2");
        label.className = "mandate-intention-label";
        label.textContent = "Intention";
        const intention = SovereignUI.editableText({
          tag: "p",
          className: "mandate-intention",
          value: initiative.data.objective || "",
          placeholder: "What is this initiative meant to change and for whom?",
          onCommit: (value) => api("/api/initiative/initiatives/set_objective", {
            initiative_uuid: initiative.uuid,
            objective: value,
          }),
          onChanged: async () => {
            showToast("Intention saved");
            await loadBoard();
          },
          onError: (error) => showToast(error.message, true),
        });
        head.append(label, intention, mandateDates(initiative));
        return head;
      }

      // A team or flow named here is part of the Initiative's Mandate. It is
      // shared domain content, unlike the local navigation shortcuts below
      // the page title, and therefore carries the normal transition language.
      function relationshipsRegion(initiative) {
        const section = document.createElement("section");
        section.className = "mandate-region";
        const heading = document.createElement("h3");
        heading.className = "mandate-region-title";
        heading.textContent = "Relationships";
        const list = document.createElement("div");
        list.className = "initiative-relationship-list";
        const relationships = state.relationships || [];
        if (!relationships.length) {
          const empty = document.createElement("p");
          empty.className = "mandate-empty";
          empty.textContent = "No team or flow named yet.";
          list.append(empty);
        }
        for (const relationship of relationships) {
          list.append(relationshipRow(relationship));
        }

        const add = document.createElement("button");
        add.type = "button";
        add.className = "ui-button";
        add.textContent = "+ Add relationship";
        const hasTeam = relationships.some(
          (item) => item.application_id === "team",
        );
        const candidates = (state.relationship_candidates || []).filter(
          (item) => item.application_id !== "team" || !hasTeam,
        );
        const kinds = (state.relationship_kinds || []).filter(
          (kind) => kind.application_id !== "team" || !hasTeam,
        );
        SovereignUI.actionMenu({
          button: add,
          items: () => {
            const items = [];
            if (candidates.length) {
              items.push({heading: "Held topics"});
              for (const candidate of candidates) {
                items.push({
                  label: `${candidate.label}: ${candidate.title}`,
                  onSelect: () => run(
                    () => api("/api/initiative/relationships/create", {
                      initiative_uuid: initiative.uuid,
                      topic_uuid: candidate.topic_uuid,
                      application_id: candidate.application_id,
                    }),
                    "Relationship added",
                  ),
                });
              }
            }
            if (kinds.length) {
              if (items.length) items.push({separator: true});
              items.push({heading: "New topic"});
              for (const kind of kinds) {
                items.push({
                  label: `New ${kind.noun.toLowerCase()}`,
                  onSelect: () => SovereignShell.openNewTopicDialog({
                    noun: kind.noun,
                    templates: (kind.templates || []).map(
                      (option) => [option.value, option.name],
                    ),
                    templateRequired: kind.template_required,
                    snapshotType: kind.application_id,
                    onCreate: ({name, template, snapshot}) => run(
                      () => api("/api/initiative/relationships/make", {
                        initiative_uuid: initiative.uuid,
                        application_id: kind.application_id,
                        title: name,
                        template,
                        snapshot,
                      }),
                      "Relationship added",
                    ),
                  }),
                });
              }
            }
            return items;
          },
        });
        section.append(heading, list);
        if (candidates.length || kinds.length) section.append(add);
        return section;
      }

      function relationshipRow(relationship) {
        const row = document.createElement("div");
        row.className = "initiative-relationship-row";
        const kind = document.createElement("span");
        kind.className = "initiative-relationship-kind";
        kind.textContent = relationship.label || "Topic";
        const href = relationship.held
          ? SovereignShell.topicHref(
            relationship.application_id, relationship.topic_uuid,
          )
          : "";
        const title = document.createElement(href ? "a" : "span");
        title.className = "initiative-relationship-title";
        title.textContent = relationship.title || "Untitled";
        if (href) title.href = href;
        else title.title = "This related topic is not held on this client.";
        const actions = document.createElement("span");
        actions.className = "initiative-relationship-actions";
        actions.append(...reactionTools({uuid: relationship.uuid}));
        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "ui-button";
        remove.innerHTML =
          `<svg viewBox="0 0 24 24" aria-hidden="true" class="icon-svg">${ICON_REMOVE}</svg>`;
        remove.title = "Remove relationship; keep the related topic";
        remove.setAttribute("aria-label", remove.title);
        remove.onclick = () => run(
          () => api("/api/initiative/relationships/remove", {
            relationship_uuid: relationship.uuid,
          }),
          "Relationship removed",
        );
        actions.append(remove);
        row.append(kind, title, actions);
        applyTransitionClass(row, relationship.uuid, {});
        return row;
      }

      function mandateDates(initiative) {
        const row = document.createElement("p");
        row.className = "mandate-dates";
        const data = initiative.data || {};
        const arrow = document.createElement("span");
        arrow.className = "mandate-date-arrow";
        arrow.textContent = "→";
        row.append(
          plannedDate(initiative, "planned_start", "Planned start"),
          arrow,
          plannedDate(initiative, "planned_end", "Planned end"),
        );
        // A claim is said here and never edited here. Claiming happens on
        // the day it is true, from the board, and clearing one is undoing a
        // claim rather than tidying a field - so the face must not draw it
        // as another box to correct.
        const claimed = [["actual_start", "Started"], ["actual_end", "Ended"]]
          .filter(([field]) => data[field])
          .map(([field, label]) => `${label} ${formatDay(data[field])}`);
        if (claimed.length) {
          const said = document.createElement("span");
          said.className = "mandate-claims";
          said.textContent = claimed.join(" · ");
          row.append(said);
        }
        return row;
      }

      // Core's SovereignUI has no date primitive and one caller is not
      // enough to guess the second one's needs, so this stays local until
      // there is a second (PLAN_INITIATIVE_FACE.md 3).
      function plannedDate(initiative, field, label) {
        const wrap = document.createElement("label");
        wrap.className = "mandate-date";
        const caption = document.createElement("span");
        caption.className = "mandate-date-label";
        caption.textContent = label;
        const input = document.createElement("input");
        input.type = "date";
        input.className = "mandate-date-input";
        input.value = initiative.data?.[field] || "";
        input.onchange = () => run(
          () => api("/api/initiative/initiatives/set_dates", {
            initiative_uuid: initiative.uuid,
            [field]: input.value,
          }),
          input.value ? "Date planned" : "Date cleared",
        );
        wrap.append(caption, input);
        return wrap;
      }

      function formatDay(iso) {
        if (!iso) return "";
        const day = new Date(`${iso}T00:00:00`);
        if (Number.isNaN(day.getTime())) return iso;
        return day.toLocaleDateString(undefined, {
          day: "numeric", month: "short", year: "numeric",
        });
      }

      function renderMilestoneStrip(initiative) {
        const container = el("milestoneStrip");
        if (
          container.contains(document.activeElement) &&
          document.activeElement.matches("input, textarea, select")
        ) return;
        const content = milestoneStripContent(initiative);
        container.replaceChildren(content);
        container.hidden = ephemeral.face !== "board" || !content.childElementCount;
      }

      function milestoneStripContent(initiative) {
        const content = document.createElement("div");
        content.className = "milestone-strip-content";
        const milestones = milestoneNodes(initiative);
        const next = milestones.find((item) => !item.data.reached_at) || null;

        const initiativeSegments = initiativeSummarySegments(initiative);
        const milestoneSegments = milestoneSummarySegments(next);
        appendSummarySegments(content, initiativeSegments);
        if (initiativeSegments.length && milestoneSegments.length) {
          const divider = document.createElement("span");
          divider.className = "summary-divider";
          divider.textContent = "|";
          content.append(divider);
        }
        appendSummarySegments(content, milestoneSegments);
        return content;
      }

      function initiativeSummarySegments(initiative) {
        const segments = [];
        const intention = initiative.data.objective || "";
        // An actual replaces a planned date in the same position, so without
        // a mark beside it the line shows two different facts identically -
        // "we start on the 12th" and "we started on the 12th" are not the
        // same statement, and the strip was making them look the same.
        if (initiative.data.actual_start || initiative.data.planned_start) {
          segments.push(summarySegment(
            "Start",
            formatDay(initiative.data.actual_start || initiative.data.planned_start),
            dateMark(Boolean(initiative.data.actual_start)),
          ));
        }
        if (intention) {
          segments.push(summaryValueSegment(intention, intentionMark()));
        }
        if (initiative.data.actual_end || initiative.data.planned_end) {
          segments.push(summarySegment(
            "End",
            formatDay(initiative.data.actual_end || initiative.data.planned_end),
            dateMark(Boolean(initiative.data.actual_end)),
          ));
        }
        return segments;
      }

      // U8: an act glyph is the conventional one and never invented, drawn on
      // the 24x24 grid with no fill and a currentColor stroke. A tick for a
      // day somebody claimed; a flag for one still being aimed at.
      const DATE_MARKS = {
        reached: '<path d="M5 13l4 4L19 7"/>',
        planned: '<path d="M6 21V4"/><path d="M6 5h12l-3 4 3 4H6"/>',
      };
      const INTENTION_MARK =
        '<circle cx="12" cy="12" r="8"></circle>' +
        '<circle cx="12" cy="12" r="4"></circle>' +
        '<path d="M12 2v3M22 12h-3M12 22v-3M2 12h3"></path>';

      function intentionMark() {
        const mark = document.createElement("span");
        mark.className = "summary-topic-mark";
        mark.setAttribute("role", "img");
        mark.setAttribute("aria-label", "Intention");
        mark.title = "Intention";
        mark.innerHTML =
          `<svg viewBox="0 0 24 24" aria-hidden="true" class="icon-svg">` +
          `${INTENTION_MARK}</svg>`;
        return mark;
      }

      function dateMark(reached) {
        const kind = reached ? "reached" : "planned";
        const mark = document.createElement("span");
        mark.className = `date-mark is-${kind}`;
        mark.setAttribute("role", "img");
        mark.setAttribute("aria-label", reached ? "reached" : "planned");
        mark.innerHTML =
          `<svg viewBox="0 0 24 24" aria-hidden="true" class="icon-svg">` +
          `${DATE_MARKS[kind]}</svg>`;
        return mark;
      }

      // After the divider, only the next milestone remains: its own name,
      // target-marked Intention, and an editable flag-marked planned date.
      function milestoneSummarySegments(next) {
        const segments = [];
        if (!next) return segments;
        segments.push(summarySegment(
          next.data.title || "Milestone",
          next.data.intention || "",
          null,
          next.data.intention ? intentionMark() : null,
        ));
        segments.push(summaryValueSegment(
          plannedMilestoneDate(next), dateMark(false),
        ));
        return segments;
      }

      function plannedMilestoneDate(milestone) {
        const input = document.createElement("input");
        input.type = "date";
        input.className = "summary-planned-input";
        input.value = milestone.data.planned_at || "";
        input.setAttribute(
          "aria-label", `Planned date: ${milestone.data.title || "milestone"}`,
        );
        input.title = input.getAttribute("aria-label");
        input.onchange = () => run(
          () => api("/api/initiative/milestones/update", {
            milestone_uuid: milestone.uuid,
            planned_at: input.value,
          }),
          input.value ? "Milestone date saved" : "Milestone date cleared",
        );
        return input;
      }

      // A date and never a one-click "done" button. The milestone may have
      // been reached before somebody records it, so the actual day remains an
      // explicit field in the detailed milestone while the summary stays the
      // compact next-milestone plan.
      function reachedDate(milestone) {
        const input = document.createElement("input");
        input.type = "date";
        input.className = "milestone-date milestone-reached-date";
        input.value = milestone.data.reached_at || "";
        input.setAttribute(
          "aria-label", `Date reached: ${milestone.data.title || "milestone"}`,
        );
        input.title = input.getAttribute("aria-label");
        input.onchange = () => run(
          () => api("/api/initiative/milestones/reach", {
            milestone_uuid: milestone.uuid,
            value: input.value,
          }),
          input.value ? "Milestone reached" : "Claim taken back",
        );
        return input;
      }

      // A label mark qualifies the label (flag Start); a value mark qualifies
      // the value (target Intention). The two positions make the icon's scope
      // explicit without adding another word to the summary.
      function summarySegment(label, value, mark = null, valueMark = null) {
        const segment = document.createElement("span");
        segment.className = "summary-segment";
        const name = document.createElement("strong");
        name.className = "summary-label";
        if (mark) name.append(mark);
        if (label instanceof Node) name.append(label);
        else name.append(document.createTextNode(label));
        const hasValue = value instanceof Node || String(value ?? "") !== "";
        if (hasValue) name.append(document.createTextNode(":"));
        segment.append(name);
        // A segment carries either a fact or the one control on this line.
        if (!hasValue) return segment;
        if (valueMark) segment.append(" ", valueMark);
        if (value instanceof Node) segment.append(" ", value);
        else segment.append(document.createTextNode(` ${value}`));
        return segment;
      }

      function summaryValueSegment(value, mark = null) {
        const segment = document.createElement("span");
        segment.className = "summary-segment summary-value-segment";
        if (mark) segment.append(mark);
        if (mark) segment.append(" ");
        segment.append(value instanceof Node ? value : document.createTextNode(String(value ?? "")));
        return segment;
      }

      function appendSummarySegments(container, segments) {
        for (const segment of segments) {
          if (container.lastElementChild?.classList.contains("summary-segment")) {
            const separator = document.createElement("span");
            separator.className = "summary-separator";
            separator.textContent = "⇒";
            container.append(separator);
          }
          container.append(segment);
        }
      }

      function renderBoard() {
        renderMilestoneStrip(state.initiative);
        const board = el("boardColumns");

        // Alle Spalten (regulär + ghost) aus dem State holen und markieren.
        // A column the peer has deleted stops being live here at once and is
        // left as a ghost, and ghosts sort in among the live columns rather
        // than after them - a ghost stands for a seat, so it belongs where
        // that seat was.
        const activeCols = columns(state.initiative)
          .filter((column) => !movedByPeer(column))
          .map((c) => ({ ...c, _isGhost: false }));
        const ghostCols = ghostColumns().map((c) => ({ ...c, _isGhost: true }));
        const allCols = sortNodes([...activeCols, ...ghostCols]);

        // Diffing für Spalten
        reconcileDOM(
          board,
          allCols,
          (col) => `${col.uuid}:${col._isGhost ? "ghost" : "local"}`,
          (col) => renderColumn(col, col._isGhost), // Deine bestehende Funktion erstellt das Grundgerüst
          (colEl, col) => updateColumnDOM(colEl, col), // Patcht nur Änderungen
        );

        // "Add Column" Button anfügen/ans Ende schieben
        let addBtn = board.querySelector(".add-column");
        if (!addBtn) {
          addBtn = document.createElement("button");
          addBtn.className = "add-column ui-button";
          addBtn.textContent = "+ Add column";
          addBtn.onclick = () =>
            openSimple(
              "Add Column",
              [{ name: "name", label: "Name", value: "New column" }],
              async (form) => api("/api/initiative/columns/create", { name: form.get("name") }),
            );
        }
        board.appendChild(addBtn);
        SovereignUI.reorderableList({
          container: board,
          itemSelector: ".column:not(.ghost)",
          axis: "horizontal",
          getId: (column) => column.dataset.uuid,
          onMove: ({id, index}) => api("/api/initiative/columns/move", {
            column_uuid: id, index,
          }),
          onChanged: async () => {
            showToast("Column moved");
            await loadBoard();
          },
          onError: error => showToast(error.message, true),
        });
      }

      // --- NEUE HELFER FÜR DAS DIFFING ---

      function updateColumnDOM(colEl, col) {
        // Spaltentitel-Input schützen, falls der Cursor drin ist
        const nameInput = colEl.querySelector(".column-name");
        if (nameInput && document.activeElement !== nameInput) {
          SovereignUI.editableText({
            element: nameInput,
            value: col.data.name || "Column",
          });
        }

        // P2P Konflikt-Klassen/Adopt-Tools aktualisieren - sonst bleibt ein
        // Adopt-Button verschwunden (oder fehlt neu aufgetauchter Divergenz),
        // solange die Spalte nur gepatcht statt neu gerendert wird.
        applyTransitionClass(colEl, col.uuid, {
          suppress: !col._isGhost && isContainerOnlyDivergence(col),
        });
        const tools = colEl.querySelector(".adopt-tools");
        if (tools) {
          tools.replaceChildren();
          if (col._isGhost || !isContainerOnlyDivergence(col)) {
            tools.append(...reactionTools(col));
          }
        }

        const cardList = colEl.querySelector(".card-list");
        if (!cardList) return;

        // Karten für diese Spalte ermitteln - identisch zur Vollansicht,
        // sonst zeigt eine gepatchte Spalte eine andere Wahrheit als eine
        // frisch gerenderte.
        const activeCards = (col._isGhost ? cards(col) : solidCards(col))
          .map((c) => ({ ...c, _isGhost: false }));
        const gCards = col._isGhost
          ? []
          : ghostCards(col.uuid).map((c) => ({ ...c, _isGhost: true }));
        // Sorted together, exactly as the full render does: a ghost carries
        // the position it was given, and appending it after the real cards
        // showed one that belonged first sitting last.
        const allCards = sortNodes([...activeCards, ...gCards]);

        // Diffing für Karten
        reconcileDOM(
          cardList,
          allCards,
          (card) => `${card.uuid}:${card._isGhost ? "ghost" : "local"}`,
          (card) => renderCard(card, card._isGhost), // Deine bestehende Funktion
          (cardEl, card) => updateCardDOM(cardEl, card),
        );
      }

      function updateCardDOM(cardEl, card) {
        // onclick captures `card` by closure, so it must be rebound on every
        // patch - otherwise it keeps pointing at whatever card data was
        // current the last time this DOM element was freshly created,
        // reopening the modal with stale participants/owner.
        cardEl.onclick = (event) => {
          if (card._isGhost) return;
          if (isInteractiveCardTarget(event)) return;
          const view = localViewOf(card);
          openCard(view, view.parent_uuid);
        };

        // Aktualisiert nur Text und Klassen, erhält Drag&Drop-Listener
        const titleEl = cardEl.querySelector(".card-title");
        if (titleEl) {
          titleEl.textContent = card.data.name || "Card";
        }

        const descEl = cardEl.querySelector(".card-desc");
        if (card.data.description && descEl) {
          descEl.textContent = card.data.description || "";
        } else if (card.data.description) {
          const desc = document.createElement("div");
          desc.className = "card-desc";
          desc.textContent = card.data.description;
          titleEl?.after(desc);
        } else if (descEl) {
          descEl.remove();
        }

        const participantItems = Array.isArray(card.data.participants)
          ? card.data.participants
          : [];
        const participantsEl = cardEl.querySelector(".participants");
        if (participantItems.length) {
          const rendered = renderParticipants(participantItems, card.data.owner);
          if (participantsEl) participantsEl.replaceWith(rendered);
          else {
            const reactionEl = cardEl.querySelector(".ui-react-button");
            cardEl.insertBefore(rendered, reactionEl || null);
          }
        } else if (participantsEl) {
          participantsEl.remove();
        }

        // P2P Konflikt-Klassen aktualisieren (nutzt deine bestehende Helper-Funktion)
        applyTransitionClass(cardEl, card.uuid);
        cardEl.querySelectorAll(".ui-react-button, .adopt, .keep-mine-menu").forEach((button) => button.remove());
        cardEl.append(...cardReactionTools(card, card._isGhost));
      }

      function renderColumn(column, ghost = false) {
        const article = document.createElement("article");
        article.className = "column";
        if (ghost) article.classList.add("ghost");
        article.dataset.uuid = column.uuid;
        article.dataset.reorderId = column.uuid;
        applyTransitionClass(article, column.uuid, {
          suppress: !ghost && isContainerOnlyDivergence(column),
        });

        const head = document.createElement("div");
        head.className = "column-head";
        if (!ghost) {
          head.append(SovereignUI.reorderHandle({label: "Reorder column"}));
        }
        const name = document.createElement("h3");
        name.className = "column-name";
        SovereignUI.editableText({
          element: name,
          value: column.data.name || "Column",
          placeholder: "Column name",
          editable: !ghost,
          onCommit: (value) => api("/api/initiative/columns/rename", {
            column_uuid: column.uuid,
            name: value,
          }),
          onChanged: async () => {
            showToast("Column renamed");
            await loadBoard();
          },
          onError: error => showToast(error.message, true),
        });
        const del = iconButton(ICON_DELETE, "Delete column", () =>
          confirmAction("Delete column?", "This deletes the column and all cards inside it.", () =>
            run(
              () =>
                api("/api/initiative/columns/delete", {
                  column_uuid: column.uuid,
                }),
              "Column deleted",
            ),
          ),
        );
        del.classList.add("delete-icon-btn");
        if (ghost) del.style.display = "none";
        head.append(name, del);
        const tools = document.createElement("div");
        tools.className = "adopt-tools";
        if (ghost || !isContainerOnlyDivergence(column)) {
          tools.append(...reactionTools(column));
        }
        head.append(tools);
        article.append(head);

        const list = document.createElement("div");
        list.className = "card-list";
        list.dataset.columnUuid = column.uuid;
        if (!ghost) {
          list.ondragover = onCardDragOver;
          list.ondrop = (event) => dropCard(event, column.uuid);
        }
        // Ghosts are ordered among the real cards, not appended after them.
        // A ghost carries the position the seat had, so tacking it onto the
        // end showed a card that belonged first sitting last - and then made
        // it jump on adoption, as though adopting had moved it.
        const ghosts = ghost ? [] : ghostCards(column.uuid);
        const ghostUuids = new Set(ghosts.map((card) => card.uuid));
        const solid = ghost ? cards(column) : solidCards(column);
        sortNodes([...solid, ...ghosts]).forEach((card) =>
          list.append(renderCard(card, ghostUuids.has(card.uuid))),
        );
        article.append(list);

        const add = document.createElement("button");
        add.className = "add-card ui-button";
        add.textContent = "+ Add card";
        add.onclick = () => openCard(null, column.uuid);
        if (!ghost) article.append(add);

        return article;
      }

      function renderCard(card, ghost = false) {
        const node = document.createElement("div");
        node.className = "card";
        if (ghost) node.classList.add("ghost");
        node.draggable = false;
        node.dataset.uuid = card.uuid;
        node.replaceChildren();
        const title = document.createElement("div");
        title.className = "card-title";
        title.textContent = card.data.name || "Card";
        node.append(title);
        if (card.data.description) {
          const desc = document.createElement("div");
          desc.className = "card-desc";
          desc.textContent = card.data.description;
          node.append(desc);
        }
        const participantItems = Array.isArray(card.data.participants)
          ? card.data.participants
          : [];
        if (participantItems.length) node.append(renderParticipants(participantItems, card.data.owner));
        node.append(...cardReactionTools(card, ghost));
        node.onclick = (event) => {
          if (ghost) return;
          if (node.dataset.suppressClick === "true") {
            delete node.dataset.suppressClick;
            return;
          }
          if (isInteractiveCardTarget(event)) return;
          const view = localViewOf(card);
          openCard(view, view.parent_uuid);
        };
        if (!ghost) {
          node.onmousedown = (event) => {
            if (event.button !== 0 || isInteractiveCardTarget(event)) return;
            // Prevent the browser's text-selection gesture from competing
            // with card dragging. A normal click still opens the card.
            event.preventDefault();
            document.body.classList.add("card-drag-pending");
            const startX = event.clientX;
            const startY = event.clientY;
            const startRect = node.getBoundingClientRect();
            const grabOffsetX = startX - startRect.left;
            const grabOffsetY = startY - startRect.top;
            let moved = false;
            let preview = null;
            const removeDragChrome = () => {
              document.body.classList.remove(
                "card-drag-pending", "card-drag-active",
              );
              preview?.remove();
              preview = null;
            };
            const move = (moveEvent) => {
              if (!moved && Math.hypot(
                moveEvent.clientX - startX,
                moveEvent.clientY - startY,
              ) < 4) return;
              moveEvent.preventDefault();
              if (!moved) {
                moved = true;
                draggedCard = card.uuid;
                dragActive = true;
                node.classList.add("dragging");
                document.body.classList.add("card-drag-active");
                preview = node.cloneNode(true);
                preview.classList.remove("dragging");
                SovereignUI.decorateTransition(preview, null);
                preview.classList.add("card-drag-preview");
                preview.setAttribute("aria-hidden", "true");
                preview.style.width = `${startRect.width}px`;
                document.body.append(preview);
              }
              preview.style.left = `${moveEvent.clientX - grabOffsetX}px`;
              preview.style.top = `${moveEvent.clientY - grabOffsetY}px`;
              const list = document.elementFromPoint(
                moveEvent.clientX, moveEvent.clientY,
              )?.closest(".card-list");
              if (!list) return;
              const after = cardAfterPointer(list, moveEvent.clientY);
              if (after) list.insertBefore(node, after);
              else list.append(node);
            };
            const up = async () => {
              document.removeEventListener("mousemove", move);
              document.removeEventListener("mouseup", up);
              removeDragChrome();
              if (!moved) return;
              node.dataset.suppressClick = "true";
              const list = node.closest(".card-list");
              if (!list) {
                draggedCard = null;
                dragActive = false;
                node.classList.remove("dragging");
                return;
              }
              await commitCardDrop(list, list.dataset.columnUuid);
            };
            document.addEventListener("mousemove", move);
            document.addEventListener("mouseup", up);
          };
        }
        applyTransitionClass(node, card.uuid);
        return node;
      }

      function isInteractiveCardTarget(event) {
        const target = event.target instanceof Element ? event.target : event.target?.parentElement;
        return Boolean(target?.closest("button, select, input, textarea, a, label"));
      }

      function renderParticipants(participants, ownerId) {
        const wrap = document.createElement("div");
        wrap.className = "participants";
        wrap.title = "Participants";
        const ordered =
          ownerId && participants.includes(ownerId)
            ? [ownerId, ...participants.filter((id) => id !== ownerId)]
            : participants;
        ordered.forEach((participant) => {
