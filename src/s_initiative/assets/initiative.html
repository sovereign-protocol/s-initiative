<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kanban Board</title>
    <link rel="stylesheet" href="/shared.css" />
    <link rel="stylesheet" href="/apps/initiative/styles.css" />
  </head>
  <body>
    <div id="toast" class="toast"></div>
    <!-- The shell owns the bar. Kanban's own controls are handed to it:
         the board title goes in the topic region, the auto-adopt indicator
         and adopt tools in the application-actions slot. -->
    <header class="topbar"><div id="shell"></div></header>

    <template id="kanbanHeaderControls">
      <div id="boardAdoptTools" class="adopt-tools"></div>
      <div id="autoAdoptHeaderControl" class="auto-adopt-header-control">
        <span id="autoAdoptIndicator" class="auto-adopt-square" title="Auto-adopt"></span>
        <span id="autoAdoptHeaderLabel" class="auto-adopt-header-label"></span>
      </div>
    </template>


    <main>
      <section id="board" class="board"></section>
    </main>

    <div id="reactionMenu" class="reaction-menu" role="menu" hidden></div>


    <dialog id="cardModal">
      <form method="dialog" id="cardForm">
        <h2 id="cardModalTitle">Card</h2>
        <div id="cardPerspectiveSwitcher" class="perspective-switcher"></div>
        <p id="cardPerspectiveMeta" class="perspective-meta"></p>
        <label>Name<input id="cardName" /></label>
        <label>Description<textarea id="cardDescription" rows="5"></textarea></label>
        <div class="card-owner-row">
          <label>Owner<select id="cardOwner"></select></label>
          <div class="card-files">
            <span class="card-files-label">Files</span>
            <input id="cardFileInput" type="file" hidden />
            <button type="button" id="attachFileBtn">Attach file…</button>
          </div>
        </div>
        <div id="cardAttachmentList" class="attachment-list"></div>
        <label>Members</label>
        <div id="participantPicker" class="user-picker"></div>
        <div id="cardComments" class="card-comments">
          <h3 class="card-comments-title">Activity</h3>
          <div id="cardCommentList" class="comment-list"></div>
          <div class="comment-add">
            <textarea id="cardCommentInput" rows="2" placeholder="Add a comment…"></textarea>
            <button type="button" id="addCommentBtn" class="primary">Comment</button>
          </div>
        </div>
        <menu>
          <button id="deleteCardBtn" type="button" class="danger">Delete</button>
          <button type="button" id="cancelCardBtn">Cancel</button>
          <button type="submit" id="saveCardBtn" class="primary">Save</button>
        </menu>
      </form>
    </dialog>

    <dialog id="simpleModal">
      <form method="dialog" id="simpleForm">
        <h2 id="simpleTitle">Action</h2>
        <div id="simpleFields"></div>
        <menu>
          <button type="button" id="cancelSimpleBtn">Cancel</button>
          <button type="submit" id="submitSimpleBtn" class="primary">Apply</button>
        </menu>
      </form>
    </dialog>

    <dialog id="confirmModal">
      <h2 id="confirmModalTitle">Action</h2>
      <p id="confirmModalMessage" class="confirm-text"></p>
      <menu>
        <button type="button" id="confirmModalCancelBtn">Cancel</button>
        <button type="button" id="confirmModalConfirmBtn" class="danger">Confirm</button>
      </menu>
    </dialog>

    <script src="/shared-api.js"></script>
    <script src="/shared.js"></script>
    <script>
      let state = null;
      let draggedCard = null;
      let draggedColumn = null;
      let dragActive = false;
      let modalCard = null;
      let modalColumn = null;
      let modalParticipants = [];
      let modalOwner = null;
      let modalPerspectiveKey = null;
      let modalPerspectiveOptions = [];
      let modalLocalDraft = null;
      let modalReadOnlyPerspective = false;

      const AUTO_ADOPT_MODES = ["always", "not_owner", "not_member", "never"];
      const AUTO_ADOPT_LABELS = {
        always: "Always",
        not_owner: "Except cards I own",
        not_member: "Except cards I'm on",
        never: "Never",
      };
      const AUTO_ADOPT_FILL = { always: 4, not_owner: 2, not_member: 1, never: 0 };
      const AUTO_ADOPT_DESCRIPTIONS = {
        always: "Peer changes are automatically adopted into every card.",
        not_owner: "Peer changes are automatically adopted, except on cards you own.",
        not_member: "Peer changes are automatically adopted, except on cards you're a member of.",
        never: "Peer changes are never auto-adopted - you review and adopt each one yourself.",
      };

      const el = (id) => document.getElementById(id);

      function autoAdoptAllowsNode(node) {
        const mode = state.auto_adopt_mode;
        if (mode === "always") return true;
        if (mode === "never") return false;
        if (!node || node.data.type !== "kanban_card") return true;
        const myId = (state.users || [])[0]?.id;
        if (mode === "not_owner") return node.data.owner !== myId;
        if (mode === "not_member") return !(node.data.participants || []).includes(myId);
        return true;
      }

      function hasPendingDivergence(node) {
        const info = transitionInfo(node.uuid);
        return !!info && !["settled", "in_flight"].includes(info.stage);
      }

      function needsManualAdopt(node) {
        if (!hasPendingDivergence(node)) return false;
        const info = transitionInfo(node.uuid);
        const autoResolvableType = info.type === "peer_made_changes" || info.type === "local_missing_node";
        return !autoResolvableType || !autoAdoptAllowsNode(node);
      }

      function needsReaction(node) {
        return needsManualAdopt(node);
      }

      function peerCopyOf(node) {
        const info = transitionInfo(node.uuid);
        if (!info || !info.peer_addr) return null;
        const peerRoot = state.peers?.[info.peer_addr];
        return peerRoot ? findNode(peerRoot, node.uuid) : null;
      }

      function isContainerOnlyDivergence(node) {
        // True when a container's own fields match the peer's copy exactly,
        // and the only reason it shows as diverged is that its content_hash
        // depends on its children (e.g. a card moved in or out) - that's
        // already surfaced on the child itself, so a separate "Adopt" here
        // would just be noise for the same underlying event.
        const peerNode = peerCopyOf(node);
        if (!peerNode) return false;
        return (
          JSON.stringify(node.data) === JSON.stringify(peerNode.data) &&
          JSON.stringify(node.weights || {}) === JSON.stringify(peerNode.weights || {}) &&
          (node.data.type === "kanban_board" || node.parent_uuid === peerNode.parent_uuid)
        );
      }

      function renderAutoAdoptSquare(container, mode = state.auto_adopt_mode) {
        container.replaceChildren();
        const filled = AUTO_ADOPT_FILL[mode] ?? 4;
        for (let i = 0; i < 4; i++) {
          const cell = document.createElement("span");
          cell.className = "auto-adopt-cell";
          if (i < filled) cell.classList.add("filled");
          container.append(cell);
        }
      }

      const api = SovereignApi.request;

      function renderNetwork() {
        // The shell draws the cluster; Kanban only says which peers belong
        // to this board and what each of them looks like.
        SovereignShell.refresh();
      }

      function renderSelfAvatar() {
        // Core owns the profile, so the shell draws and edits the avatar.
        SovereignShell.refreshAvatar();
      }

      function renderAutoAdoptIndicator() {
        const peers = boardPeerAddresses();
        const control = el("autoAdoptHeaderControl");
        control.style.display = peers.length ? "flex" : "none";
        if (!peers.length) return;
        const label = AUTO_ADOPT_LABELS[state.auto_adopt_mode] || "Always";
        const indicator = el("autoAdoptIndicator");
        renderAutoAdoptSquare(indicator);
        indicator.title = `Auto-adopt: ${label} - click to change`;
        el("autoAdoptHeaderLabel").textContent = `Auto-adopt: ${label}`;
        control.title = `Auto-adopt: ${label} - click to change`;
      }

      function avatarElement(user, online) {
        const avatar = document.createElement("span");
        avatar.className = "header-avatar";
        avatar.classList.add(online ? "status-online" : "status-offline");
        if (user.picture) {
          avatar.style.backgroundImage = `url("${cssUrl(user.picture)}")`;
        } else {
          avatar.textContent = initials(user.name);
        }
        return avatar;
      }

      function peerPresence(addr) {
        // One presence answer per peer: relay peers get real liveness from
        // presence-file mtimes (server-attached channel_liveness) - their
        // http-shaped peer_status is always "online, never seen", which
        // made a stopped relay peer look permanently alive. Direct peers
        // keep the http status.
        const relayLive = state.network?.peers?.[addr]?.channel_liveness;
        if (relayLive) {
          if (relayLive.state === "alive") {
            const ago = Math.max(0, Math.round(relayLive.last_seen_seconds_ago || 0));
            return { online: true, metaText: `online - relay, ${ago}s ago` };
          }
          if (relayLive.state === "stale") {
            const ago = Math.round(relayLive.last_seen_seconds_ago || 0);
            return { online: false, metaText: `stale - last relay heartbeat ${ago}s ago` };
          }
          return { online: false, metaText: "no relay heartbeat yet" };
        }
        const info = peerStatus(addr);
        const online = info.state !== "offline";
        return {
          online,
          metaText: `${online ? "online" : "on hold"} - ${formatLastSeen(info.last_seen)}`,
        };
      }

      function formatLastSeen(timestamp) {
        if (!timestamp) return "never";
        const seconds = Math.max(0, Date.now() / 1000 - timestamp);
        if (seconds < 60) return "just now";
        if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
        if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
        return `${Math.floor(seconds / 86400)}d ago`;
      }

      function selectBoard(boardUuid) {
        if (!boardUuid || boardUuid === state.board.uuid) return;
        run(
          () => api("/api/initiative/boards/select", { board_uuid: boardUuid }),
          "Board selected",
        );
      }

      const AGENDA_PRIORITY_LABELS = { "": "No priority", high: "High", medium: "Medium", low: "Low" };

      function highlightCard(uuid) {
        const target = document.querySelector(`[data-uuid="${uuid}"]`);
        if (!target) return;
        SovereignShell.closeCollab();
        target.scrollIntoView({ behavior: "smooth", block: "center" });
        target.classList.add("highlight-flash");
        setTimeout(() => target.classList.remove("highlight-flash"), 1500);
      }

      function boardUsers() {
        const boardPeers = new Set(boardPeerAddresses());
        return (state.users || []).filter(
          (user) => user.address === state.address || boardPeers.has(user.address),
        );
      }

      function pickerCandidates() {
        // New assignments are restricted to current board members, but
        // someone already assigned before they (or we) left the board must
        // stay visible here too - otherwise there's no way to ever remove
        // that stale assignment again, since they'd never appear in the list.
        const board = boardUsers();
        const boardIds = new Set(board.map((user) => user.id));
        const already = modalParticipants
          .filter((id) => !boardIds.has(id))
          .map((id) => userForParticipant(id));
        return [...board, ...already];
      }

      function renderUserPicker(containerId) {
        const container = el(containerId);
        container.replaceChildren();
        for (const user of pickerCandidates()) {
          const button = document.createElement("button");
          button.type = "button";
          button.disabled = modalReadOnlyPerspective;
          button.className = "user-choice";
          if (modalParticipants.includes(user.id)) button.classList.add("selected");
          const avatar = SovereignUI.avatar(user, {
            className: "participant-avatar",
            self: user.address === state.address,
          });
          const name = document.createElement("span");
          name.textContent = user.name;
          button.append(avatar, name);
          button.onclick = () => {
            const index = modalParticipants.indexOf(user.id);
            if (index >= 0) {
              modalParticipants.splice(index, 1);
              if (modalOwner === user.id) modalOwner = null;
            } else if (user.id) {
              modalParticipants.push(user.id);
            }
            renderUserPicker(containerId);
            renderOwnerSelect();
          };
          container.append(button);
        }
      }

      function renderOwnerSelect() {
        const select = el("cardOwner");
        select.replaceChildren();
        const blank = document.createElement("option");
        blank.value = "";
        blank.textContent = "Unassigned";
        select.append(blank);
        for (const id of modalParticipants) {
          const option = document.createElement("option");
          option.value = id;
          option.textContent = userForParticipant(id).name;
          select.append(option);
        }
        select.value = modalParticipants.includes(modalOwner) ? modalOwner : "";
        modalOwner = select.value || null;
        select.disabled = modalReadOnlyPerspective;
      }

      async function loadBoard() {
        if (dragActive) return;
        try {
          state = await api("/api/initiative/board");

          // Core owns the same title-plus-switcher control for every topic app.
          SovereignShell.setTopicSelector({
            label: "Board",
            topics: (state.boards || []).map((board) => ({
              uuid: board.uuid,
              title: board.data.name || "Kanban Board",
            })),
            selectedUuid: state.board.uuid,
            onSelect: selectBoard,
            onRename: (name) => run(
              () => api("/api/initiative/boards/rename", {
                board_uuid: state.board.uuid,
                name,
              }),
              "Board renamed",
            ),
          });

          renderAutoAdoptIndicator();
          renderBoardAdoptTools();

          renderNetwork();
          renderSelfAvatar();

          // Neues Rendering via Diffing
          renderBoard();
        } catch (error) {
          showToast(error.message, true);
        }
      }

      function renderBoard() {
        const board = el("board");

        // Alle Spalten (regulär + ghost) aus dem State holen und markieren
        const activeCols = columns(state.board).map((c) => ({ ...c, _isGhost: false }));
        const ghostCols = ghostColumns().map((c) => ({ ...c, _isGhost: true }));
        const allCols = [...activeCols, ...ghostCols];

        // Diffing für Spalten
        reconcileDOM(
          board,
          allCols,
          (col) => `${col.uuid}:${col._isGhost ? "ghost" : "local"}`,
          (col) => renderColumn(col, col._isGhost), // Deine bestehende Funktion erstellt das Grundgerüst
          (colEl, col) => updateColumnDOM(colEl, col), // Patcht nur Änderungen
        );

        // "Add Column" Button anfügen/ans Ende schieben
        let addBtn = board.querySelector(".add-column");
        if (!addBtn) {
          addBtn = document.createElement("button");
          addBtn.className = "add-column ui-button";
          addBtn.textContent = "+ Add column";
          addBtn.onclick = () =>
            openSimple(
              "Add Column",
              [{ name: "name", label: "Name", value: "New column" }],
              async (form) => api("/api/initiative/columns/create", { name: form.get("name") }),
            );
        }
        board.appendChild(addBtn);
      }

      // --- NEUE HELFER FÜR DAS DIFFING ---

      function updateColumnDOM(colEl, col) {
        // Spaltentitel-Input schützen, falls der Cursor drin ist
        const nameInput = colEl.querySelector("input");
        if (nameInput && document.activeElement !== nameInput) {
          nameInput.value = col.data.name || "Column";
        }

        // P2P Konflikt-Klassen/Adopt-Tools aktualisieren - sonst bleibt ein
        // Adopt-Button verschwunden (oder fehlt neu aufgetauchter Divergenz),
        // solange die Spalte nur gepatcht statt neu gerendert wird.
        applyTransitionClass(colEl, col.uuid, {
          suppress: !col._isGhost && isContainerOnlyDivergence(col),
        });
        const tools = colEl.querySelector(".adopt-tools");
        if (tools) {
          tools.replaceChildren();
          if (needsReaction(col) && (col._isGhost || !isContainerOnlyDivergence(col))) {
            tools.append(reactionButton(col));
          }
        }

        const cardList = colEl.querySelector(".card-list");
        if (!cardList) return;

        // Karten für diese Spalte ermitteln
        const activeCards = cards(col).map((c) => ({ ...c, _isGhost: false }));
        const gCards = col._isGhost
          ? []
          : ghostCards(col.uuid).map((c) => ({ ...c, _isGhost: true }));
        const allCards = [...activeCards, ...gCards];

        // Diffing für Karten
        reconcileDOM(
          cardList,
          allCards,
          (card) => `${card.uuid}:${card._isGhost ? "ghost" : "local"}`,
          (card) => renderCard(card, card._isGhost), // Deine bestehende Funktion
          (cardEl, card) => updateCardDOM(cardEl, card),
        );
      }

      function updateCardDOM(cardEl, card) {
        // onclick captures `card` by closure, so it must be rebound on every
        // patch - otherwise it keeps pointing at whatever card data was
        // current the last time this DOM element was freshly created,
        // reopening the modal with stale participants/owner.
        cardEl.onclick = (event) => {
          if (card._isGhost) return;
          if (isInteractiveCardTarget(event)) return;
          openCard(card, card.parent_uuid);
        };

        // Aktualisiert nur Text und Klassen, erhält Drag&Drop-Listener
        const titleEl = cardEl.querySelector(".card-title");
        if (titleEl) {
          titleEl.textContent = card.data.name || "Card";
        }

        const descEl = cardEl.querySelector(".card-desc");
        if (card.data.description && descEl) {
          descEl.textContent = card.data.description || "";
        } else if (card.data.description) {
          const desc = document.createElement("div");
          desc.className = "card-desc";
          desc.textContent = card.data.description;
          titleEl?.after(desc);
        } else if (descEl) {
          descEl.remove();
        }

        const participantItems = Array.isArray(card.data.participants)
          ? card.data.participants
          : [];
        const participantsEl = cardEl.querySelector(".participants");
        if (participantItems.length) {
          const rendered = renderParticipants(participantItems, card.data.owner);
          if (participantsEl) participantsEl.replaceWith(rendered);
          else {
            const reactionEl = cardEl.querySelector(".react-button");
            cardEl.insertBefore(rendered, reactionEl || null);
          }
        } else if (participantsEl) {
          participantsEl.remove();
        }

        // P2P Konflikt-Klassen aktualisieren (nutzt deine bestehende Helper-Funktion)
        applyTransitionClass(cardEl, card.uuid);
        cardEl.querySelectorAll(".react-button, .adopt, .keep-mine-menu").forEach((button) => button.remove());
        cardEl.append(...cardReactionTools(card, card._isGhost));
      }

      function renderColumn(column, ghost = false) {
        const article = document.createElement("article");
        article.className = "column";
        if (ghost) article.classList.add("ghost");
        article.draggable = !ghost;
        if (!ghost) {
          article.onmousedown = (event) => {
            article.draggable = !event.target.closest(".card");
          };
          article.onmouseup = () => {
            article.draggable = true;
          };
        }
        article.dataset.uuid = column.uuid;
        applyTransitionClass(article, column.uuid, {
          suppress: !ghost && isContainerOnlyDivergence(column),
        });

        const head = document.createElement("div");
        head.className = "column-head";
        const name = document.createElement("input");
        name.value = column.data.name || "Column";
        name.disabled = ghost;
        name.onchange = () =>
          run(
            () =>
              api("/api/initiative/columns/rename", {
                column_uuid: column.uuid,
                name: name.value,
              }),
            "Column renamed",
          );
        const del = iconButton(ICON_DELETE, "Delete column", () =>
          confirmAction("Delete column?", "This deletes the column and all cards inside it.", () =>
            run(
              () =>
                api("/api/initiative/columns/delete", {
                  column_uuid: column.uuid,
                }),
              "Column deleted",
            ),
          ),
        );
        del.classList.add("delete-icon-btn");
        if (ghost) del.style.display = "none";
        head.append(name, del);
        const tools = document.createElement("div");
        tools.className = "adopt-tools";
        if (needsReaction(column) && (ghost || !isContainerOnlyDivergence(column))) {
          tools.append(reactionButton(column));
        }
        head.append(tools);
        article.append(head);

        const list = document.createElement("div");
        list.className = "card-list";
        list.dataset.columnUuid = column.uuid;
        if (!ghost) {
          list.ondragover = onCardDragOver;
          list.ondrop = (event) => dropCard(event, column.uuid);
        }
        cards(column).forEach((card) => list.append(renderCard(card)));
        if (!ghost) {
          ghostCards(column.uuid).forEach((card) => list.append(renderCard(card, true)));
        }
        article.append(list);

        const add = document.createElement("button");
        add.className = "add-card ui-button";
        add.textContent = "+ Add card";
        add.onclick = () => openCard(null, column.uuid);
        if (!ghost) article.append(add);

        if (!ghost) {
          article.ondragstart = (event) => {
            if (event.target.closest(".card")) return;
            draggedColumn = column.uuid;
            dragActive = true;
            article.classList.add("dragging");
            if (event.dataTransfer) {
              event.dataTransfer.effectAllowed = "move";
              event.dataTransfer.setData("text/plain", column.uuid);
            }
          };
          article.ondragend = () => {
            article.classList.remove("dragging");
            draggedColumn = null;
            dragActive = false;
          };
          article.ondragover = (event) => event.preventDefault();
          article.ondrop = (event) => dropColumn(event, column.uuid);
        }
        return article;
      }

      function renderCard(card, ghost = false) {
        const node = document.createElement("div");
        node.className = "card";
        if (ghost) node.classList.add("ghost");
        applyTransitionClass(node, card.uuid);
        node.draggable = false;
        node.dataset.uuid = card.uuid;
        node.replaceChildren();
        const title = document.createElement("div");
        title.className = "card-title";
        title.textContent = card.data.name || "Card";
        node.append(title);
        if (card.data.description) {
          const desc = document.createElement("div");
          desc.className = "card-desc";
          desc.textContent = card.data.description;
          node.append(desc);
        }
        const participantItems = Array.isArray(card.data.participants)
          ? card.data.participants
          : [];
        if (participantItems.length) node.append(renderParticipants(participantItems, card.data.owner));
        node.append(...cardReactionTools(card, ghost));
        node.onclick = (event) => {
          if (ghost) return;
          if (node.dataset.suppressClick === "true") {
            delete node.dataset.suppressClick;
            return;
          }
          if (isInteractiveCardTarget(event)) return;
          openCard(card, card.parent_uuid);
        };
        if (!ghost) {
          node.onmousedown = (event) => {
            if (event.button !== 0 || isInteractiveCardTarget(event)) return;
            // Prevent the browser's text-selection gesture from competing
            // with card dragging. A normal click still opens the card.
            event.preventDefault();
            document.body.classList.add("card-drag-pending");
            const startX = event.clientX;
            const startY = event.clientY;
            const startRect = node.getBoundingClientRect();
            const grabOffsetX = startX - startRect.left;
            const grabOffsetY = startY - startRect.top;
            let moved = false;
            let preview = null;
            const removeDragChrome = () => {
              document.body.classList.remove(
                "card-drag-pending", "card-drag-active",
              );
              preview?.remove();
              preview = null;
            };
            const move = (moveEvent) => {
              if (!moved && Math.hypot(
                moveEvent.clientX - startX,
                moveEvent.clientY - startY,
              ) < 4) return;
              moveEvent.preventDefault();
              if (!moved) {
                moved = true;
                draggedCard = card.uuid;
                dragActive = true;
                node.classList.add("dragging");
                document.body.classList.add("card-drag-active");
                preview = node.cloneNode(true);
                preview.classList.remove("dragging", "diff");
                [...preview.classList]
                  .filter((name) => name.startsWith("stage-"))
                  .forEach((name) => preview.classList.remove(name));
                preview.classList.add("card-drag-preview");
                preview.setAttribute("aria-hidden", "true");
                preview.style.width = `${startRect.width}px`;
                document.body.append(preview);
              }
              preview.style.left = `${moveEvent.clientX - grabOffsetX}px`;
              preview.style.top = `${moveEvent.clientY - grabOffsetY}px`;
              const list = document.elementFromPoint(
                moveEvent.clientX, moveEvent.clientY,
              )?.closest(".card-list");
              if (!list) return;
              const after = cardAfterPointer(list, moveEvent.clientY);
              if (after) list.insertBefore(node, after);
              else list.append(node);
            };
            const up = async () => {
              document.removeEventListener("mousemove", move);
              document.removeEventListener("mouseup", up);
              removeDragChrome();
              if (!moved) return;
              node.dataset.suppressClick = "true";
              const list = node.closest(".card-list");
              if (!list) {
                draggedCard = null;
                dragActive = false;
                node.classList.remove("dragging");
                return;
              }
              await commitCardDrop(list, list.dataset.columnUuid);
            };
            document.addEventListener("mousemove", move);
            document.addEventListener("mouseup", up);
          };
        }
        return node;
      }

      function isInteractiveCardTarget(event) {
        const target = event.target instanceof Element ? event.target : event.target?.parentElement;
        return Boolean(target?.closest("button, select, input, textarea, a, label"));
      }

      function renderParticipants(participants, ownerId) {
        const wrap = document.createElement("div");
        wrap.className = "participants";
        wrap.title = "Participants";
        const ordered =
          ownerId && participants.includes(ownerId)
            ? [ownerId, ...participants.filter((id) => id !== ownerId)]
            : participants;
        ordered.forEach((participant) => {
          const user = userForParticipant(participant);
          const isOwner = participant === ownerId;
          const avatar = SovereignUI.avatar(user, {
            className: "participant-avatar",
            owner: isOwner,
            self: user.address === state.address,
            title: isOwner ? `${user.name} (owner)` : user.name,
          });
          wrap.append(avatar);
        });
        return wrap;
      }
      function reconcileDOM(parent, dataItems, keyFn, createFn, updateFn) {
        const dataKeys = dataItems.map(keyFn);

        // 1. Ausmisten: Elemente entfernen, die im neuen State nicht mehr existieren
        Array.from(parent.children).forEach((child) => {
          const key = child.getAttribute("data-id");
          if (!dataKeys.includes(key)) {
            child.remove();
          }
        });

        // 2. Abgleichen & Sortieren: Bestehende updaten oder neue einfügen
        dataItems.forEach((item, index) => {
          const key = keyFn(item);
          let child = parent.querySelector(`[data-id="${key}"]`);

          if (!child) {
            // Element existiert noch nicht -> Neu erstellen
            child = createFn(item);
            child.setAttribute("data-id", key);
            parent.insertBefore(child, parent.children[index] || null);
          } else {
            // Element existiert -> Position korrigieren falls nötig
            if (parent.children[index] !== child) {
              parent.insertBefore(child, parent.children[index] || null);
            }
            // Inhalt/Attribute patchen
            updateFn(child, item);
          }
        });
      }

      function renderBoardAdoptTools() {
        const tools = el("boardAdoptTools");
        tools.replaceChildren();
        const board = state.board;
        if (!board) return;
        // The board root inherits every descendant hash difference. Only
        // offer a board-level decision when the board's own fields differ.
        if (isContainerOnlyDivergence(board)) return;
        if (needsReaction(board)) {
          tools.append(reactionButton(board));
        }
      }

      function reactionButton(node) {
        const button = document.createElement("button");
        button.type = "button";
        button.setAttribute("aria-label", "React to differences");
        button.className = "react-button";
        button.textContent = "React";
        const info = transitionInfo(node.uuid);
        if (info) button.title = transitionLabel(info);
        button.onclick = (event) => {
          event.stopPropagation();
          openReactionMenu(button, node.uuid);
        };
        return button;
      }

      function cardReactionTools(card, ghost = false) {
        // A moved card can be rendered once at our position and once as a
        // ghost at the peer position. Keep a single reaction entry point on
        // the real local card; a brand-new peer-only card has only a ghost.
        if (ghost && findNode(state.board, card.uuid)) return [];
        return needsReaction(card) ? [reactionButton(card)] : [];
      }

      function reactionChoices(uuid) {
        const info = transitionInfo(uuid);
        const contributingEvents = info?.events || (info ? [info] : []);
        const eventByAddr = new Map(contributingEvents.map((event) => [event.peer_addr, event]));
        const contributingAddrs = new Set(eventByAddr.keys());
        const peers = Object.entries(state.peers || {})
          .map(([addr, root]) => ({
            addr,
            missing: !(root && findNode(root, uuid)),
            event: eventByAddr.get(addr),
          }))
          .filter((item) => contributingAddrs.has(item.addr));
        return peers.map((item) => {
          const action = item.event?.reaction || "adopt";
          const actor = transitionActorLabel(item.event);
          const changes = eventChangeSummary(item.event, 6) || "complete peer version";
          if (action === "rollback") {
            // Named from the author's own end. "Roll back to my previous
            // version held by <peer>" described where the old revision
            // happens to be visible, which is bookkeeping, not the choice
            // being offered.
            const undo = localChangeSummary(item.event, 6);
            return {
              label: undo ? `Take back my change: ${undo}` : "Take back my change",
              action,
              peer: item,
            };
          }
          return {
            label: `Adopt ${changes} (from ${actor})`,
            action,
            peer: item,
          };
        });
      }

      function closeReactionMenu() {
        const menu = el("reactionMenu");
        menu.hidden = true;
        menu.replaceChildren();
      }

      function openReactionMenu(anchor, uuid) {
        const reactions = reactionChoices(uuid);
        if (!reactions.length) return showToast("No reaction available", true);
        const menu = el("reactionMenu");
        menu.replaceChildren();
        for (const reaction of reactions) {
          const option = document.createElement("button");
          option.type = "button";
          option.className = "reaction-menu-option";
          option.textContent = reaction.label;
          option.onclick = async (event) => {
            event.stopPropagation();
            closeReactionMenu();
            await applyReaction(uuid, reaction);
          };
          menu.append(option);
        }
        menu.hidden = false;
        const rect = anchor.getBoundingClientRect();
        const margin = 8;
        const left = Math.max(margin, Math.min(
          rect.left, window.innerWidth - menu.offsetWidth - margin,
        ));
        let top = rect.bottom + 4;
        if (top + menu.offsetHeight > window.innerHeight - margin) {
          top = Math.max(margin, rect.top - menu.offsetHeight - 4);
        }
        menu.style.left = `${left}px`;
        menu.style.top = `${top}px`;
      }

      document.addEventListener("click", (event) => {
        if (!event.target.closest("#reactionMenu")) closeReactionMenu();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeReactionMenu();
      });
      window.addEventListener("resize", closeReactionMenu);
      window.addEventListener("scroll", closeReactionMenu, true);

      async function applyReaction(uuid, reaction) {
        const endpoint = reaction.action === "rollback"
          ? "/api/initiative/rollback"
          : "/api/initiative/adopt";
        await run(() => api(endpoint, {
          node_uuid: uuid,
          source_addr: reaction.peer.addr,
          adopt_absence: reaction.action === "adopt" && reaction.peer.missing,
          rollback_absence: reaction.action === "rollback" && reaction.peer.missing,
        }), reaction.action === "rollback" ? "Rolled back" : "Adopted");
      }

      function openCard(card, columnUuid) {
        modalCard = card;
        modalColumn = columnUuid;
        // Do not capture the values left in the dialog by the previously
        // opened card as this card's draft during the initial render.
        modalPerspectiveKey = null;
        modalPerspectiveOptions = card ? cardPerspectiveOptions(card) : [];
        // The dialog is a single reused element, so anything typed but not
        // submitted survives its close. Name and description are rewritten
        // from the draft below; these two have no draft to rewrite them.
        el("cardCommentInput").value = "";
        el("cardFileInput").value = "";
        modalLocalDraft = {
          name: card?.data.name || "",
          description: card?.data.description || "",
          participants: Array.isArray(card?.data.participants) ? [...card.data.participants] : [],
          owner: card?.data.owner || null,
        };
        renderCardPerspective("local");
        el("cardOwner").onchange = () => {
          modalOwner = el("cardOwner").value || null;
        };
        el("cardModal").showModal();
      }

      function cardPerspectiveOptions(card) {
        const options = [{
          key: "local",
          label: "Mine",
          node: card,
          columnLabel: columnNameFor(state.board, card.parent_uuid),
          absent: false,
        }];
        const events = (transitionInfo(card.uuid)?.events || [transitionInfo(card.uuid)])
          .filter((event) => event && event.type !== "in_agreement");
        const seen = new Set();
        for (const event of events) {
          const revision = event.peer_revision || `${event.peer_addr}:missing`;
          if (seen.has(revision)) continue;
          seen.add(revision);
          const root = state.peers?.[event.peer_addr];
          const peerNode = root ? findNode(root, card.uuid) : null;
          options.push({
            key: `peer:${options.length}`,
            label: transitionActorLabel(event),
            node: peerNode,
            columnLabel: peerNode ? columnNameFor(root, peerNode.parent_uuid) : "",
            absent: !peerNode || peerNode.deleted,
          });
        }
        return options;
      }

      function columnNameFor(root, columnUuid) {
        const column = root && columnUuid ? findNode(root, columnUuid) : null;
        return column?.data?.name || "Unknown column";
      }

      function captureLocalCardDraft() {
        if (modalPerspectiveKey !== "local") return;
        modalLocalDraft = {
          name: el("cardName").value,
          description: el("cardDescription").value,
          participants: [...modalParticipants],
          owner: modalOwner,
        };
      }

      function renderCardPerspective(key) {
        captureLocalCardDraft();
        modalPerspectiveKey = key;
        const perspective = modalPerspectiveOptions.find((item) => item.key === key);
        const isLocal = !modalCard || !perspective || perspective.key === "local";
        modalReadOnlyPerspective = !isLocal;
        let data;
        if (isLocal) {
          data = modalLocalDraft || { name: "", description: "", participants: [], owner: null };
        } else if (perspective.absent) {
          data = { name: "", description: "", participants: [], owner: null };
        } else {
          data = perspective.node.data;
        }
        el("cardModalTitle").textContent = !modalCard
          ? "Add Card"
          : isLocal ? "Edit Card — My Perspective" : `Card — ${perspective.label}'s Perspective`;
        el("cardName").value = data.name || "";
        el("cardDescription").value = data.description || "";
        el("cardName").disabled = modalReadOnlyPerspective || perspective?.absent;
        el("cardDescription").disabled = modalReadOnlyPerspective || perspective?.absent;
        modalParticipants = Array.isArray(data.participants) ? [...data.participants] : [];
        modalOwner = data.owner || null;
        renderUserPicker("participantPicker");
        renderOwnerSelect();
        const meta = el("cardPerspectiveMeta");
        meta.textContent = perspective?.absent
          ? `This card is absent from ${perspective.label}'s perspective.`
          : `Column: ${perspective?.columnLabel || columnNameFor(state.board, modalColumn)}`;
        el("saveCardBtn").style.display = isLocal ? "" : "none";
        el("deleteCardBtn").style.display = modalCard && isLocal ? "inline-block" : "none";
        renderCardPerspectiveSwitcher();
        renderCardComments();
        renderCardAttachments();
      }

      function formatCommentTime(iso) {
        if (!iso) return "";
        const then = new Date(iso);
        if (Number.isNaN(then.getTime())) return "";
        const seconds = Math.floor((Date.now() - then.getTime()) / 1000);
        if (seconds < 60) return "just now";
        if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
        if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
        return then.toLocaleString();
      }

      function renderCardComments() {
        const section = el("cardComments");
        // Comments live on the real card, so show them only for an existing
        // card in the local ("Mine") perspective - not while adding a card or
        // viewing a peer's version.
        if (!modalCard || modalPerspectiveKey !== "local") {
          section.style.display = "none";
          return;
        }
        section.style.display = "block";
        const list = el("cardCommentList");
        list.replaceChildren();
        const myId = state.user_profile?.uuid;
        const comments = (state.comments_by_card || {})[modalCard.uuid] || [];
        if (!comments.length) {
          const empty = document.createElement("p");
          empty.className = "comment-empty";
          empty.textContent = "No comments yet.";
          list.append(empty);
        }
        for (const comment of comments) {
          const item = document.createElement("div");
          item.className = "comment";
          const head = document.createElement("div");
          head.className = "comment-head";
          const author = document.createElement("span");
          author.className = "comment-author";
          author.textContent = comment.author_label || "Unknown";
          const when = document.createElement("span");
          when.className = "comment-time";
          when.textContent = formatCommentTime(comment.created_at);
          head.append(author, when);
          if (comment.author && comment.author === myId) {
            const remove = document.createElement("button");
            remove.type = "button";
            remove.className = "comment-delete";
            remove.textContent = "Delete";
            remove.onclick = () => deleteComment(comment.uuid);
            head.append(remove);
          }
          const body = document.createElement("div");
          body.className = "comment-text";
          body.textContent = comment.text;
          item.append(head, body);
          list.append(item);
        }
      }

      async function addComment() {
        if (!modalCard) return;
        const input = el("cardCommentInput");
        const text = input.value.trim();
        if (!text) return;
        try {
          await api("/api/initiative/cards/comments/create", {
            card_uuid: modalCard.uuid,
            text,
          });
          input.value = "";
          await loadBoard();
          renderCardComments();
        } catch (error) {
          showToast(error.message, true);
        }
      }

      async function deleteComment(commentUuid) {
        try {
          await api("/api/initiative/cards/comments/delete", { comment_uuid: commentUuid });
          await loadBoard();
          renderCardComments();
        } catch (error) {
          showToast(error.message, true);
        }
      }

      function formatFileSize(bytes) {
        const size = Number(bytes) || 0;
        if (size < 1024) return size + " B";
        if (size < 1024 * 1024) return (size / 1024).toFixed(1) + " KB";
        return (size / (1024 * 1024)).toFixed(1) + " MB";
      }

      function renderCardAttachments() {
        const section = el("cardAttachmentList");
        const attachRow = el("attachFileBtn");
        // Files hang off a saved card, so - like comments - they appear only
        // for an existing card in the local perspective.
        const editable = modalCard && modalPerspectiveKey === "local";
        attachRow.disabled = !editable;
        section.replaceChildren();
        if (!editable) {
          section.style.display = "none";
          return;
        }
        section.style.display = "block";
        const myId = state.user_profile?.uuid;
        const files = (state.attachments_by_card || {})[modalCard.uuid] || [];
        if (!files.length) {
          const empty = document.createElement("p");
          empty.className = "attachment-empty";
          empty.textContent = "No files attached.";
          section.append(empty);
          return;
        }
        for (const file of files) {
          const row = document.createElement("div");
          row.className = "attachment";
          const link = document.createElement("a");
          link.className = "attachment-name";
          link.href = file.url;
          // Core serves a non-image blob as an octet-stream attachment, but
          // name the download here so it keeps the name it was uploaded with.
          link.download = file.name;
          link.textContent = file.name;
          link.title = `${file.name} (${file.mime})`;
          const meta = document.createElement("span");
          meta.className = "attachment-meta";
          meta.textContent = formatFileSize(file.size)
            + (file.author_label ? " · " + file.author_label : "");
          row.append(link, meta);
          if (file.author && file.author === myId) {
            const remove = document.createElement("button");
            remove.type = "button";
            remove.className = "attachment-delete";
            remove.textContent = "Remove";
            remove.onclick = () => deleteAttachment(file.uuid);
            row.append(remove);
          }
          section.append(row);
        }
      }

      async function attachSelectedFile(file) {
        if (!modalCard || !file) return;
        try {
          // Bytes go to Core's blob endpoint; only the reference goes to
          // Kanban, so the application never handles the payload itself.
          const response = await fetch("/api/blob", {
            method: "POST",
            headers: {
              "Content-Type": file.type || "application/octet-stream",
            },
            body: file,
          });
          const stored = await response.json();
          if (!response.ok) {
            throw new Error(stored.reason || "Could not upload the file.");
          }
          await api("/api/initiative/cards/attachments/create", {
            card_uuid: modalCard.uuid,
            attachment: {
              id: crypto.randomUUID(),
              role: "attachment",
              blob_id: stored.blob_id,
              name: file.name,
              size: stored.size,
              mime: stored.mime,
            },
          });
          await loadBoard();
          renderCardAttachments();
          showToast("File attached");
        } catch (error) {
          showToast(error.message, true);
        }
      }

      async function deleteAttachment(attachmentUuid) {
        try {
          await api("/api/initiative/cards/attachments/delete", {
            attachment_uuid: attachmentUuid,
          });
          await loadBoard();
          renderCardAttachments();
        } catch (error) {
          showToast(error.message, true);
        }
      }

      function renderCardPerspectiveSwitcher() {
        const switcher = el("cardPerspectiveSwitcher");
        switcher.replaceChildren();
        switcher.style.display = modalPerspectiveOptions.length > 1 ? "flex" : "none";
        for (const perspective of modalPerspectiveOptions) {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = perspective.label;
          button.className = "perspective-option";
          if (perspective.key === modalPerspectiveKey) button.classList.add("active");
          button.onclick = () => renderCardPerspective(perspective.key);
          switcher.append(button);
        }
      }

      el("cardForm").onsubmit = async (event) => {
        event.preventDefault();
        if (modalReadOnlyPerspective) return;
        const payload = {
          name: el("cardName").value,
          description: el("cardDescription").value,
          participants: dedupe(modalParticipants),
          owner: modalOwner || null,
        };
        if (modalCard) {
          payload.card_uuid = modalCard.uuid;
          // Lost-update guard (review U-3): the server rejects the save if
          // the card changed since this modal opened, rather than silently
          // overwriting a peer's merged edit. On conflict keep the modal
          // open so nothing typed is lost - the next poll shows the merged
          // card underneath, and re-opening edits against it.
          payload.expected_content_hash = modalCard.content_hash;
          try {
            await api("/api/initiative/cards/update", payload);
          } catch (error) {
            showToast(error.message, true);
            await loadBoard();
            return;
          }
          showToast("Card saved");
          await loadBoard();
        } else {
          payload.column_uuid = modalColumn;
          await run(() => api("/api/initiative/cards/create", payload), "Card added");
        }
        el("cardModal").close();
      };

      el("deleteCardBtn").onclick = async () => {
        if (!modalCard) return;
        await confirmAction("Delete card?", "This removes the card from this board.", async () => {
          await run(
            () => api("/api/initiative/cards/delete", { card_uuid: modalCard.uuid }),
            "Card deleted",
          );
          el("cardModal").close();
        });
      };
      el("cancelCardBtn").onclick = () => el("cardModal").close();
      el("addCommentBtn").onclick = addComment;
      el("attachFileBtn").onclick = () => el("cardFileInput").click();
      el("cardFileInput").onchange = async (event) => {
        const [file] = event.target.files || [];
        // Clear first so re-picking the same file still fires a change.
        event.target.value = "";
        await attachSelectedFile(file);
      };

      function setModalFooterMode(mode) {
        const done = mode === "done";
        el("cancelSimpleBtn").style.display = done ? "none" : "";
        el("submitSimpleBtn").textContent = done ? "Done" : "Apply";
      }

      function openSimple(title, fields, onSubmit) {
        SovereignShell.closeCollab();
        setModalFooterMode("cancel-apply");
        el("simpleTitle").textContent = title;
        el("simpleFields").replaceChildren();
        for (const field of fields) {
          const label = document.createElement("label");
          label.textContent = field.label;
          let control;
          if (field.type === "select") {
            control = document.createElement("select");
            control.name = field.name;
            for (const option of field.options || []) {
              const opt = document.createElement("option");
              opt.value = option.value;
              opt.textContent = option.label;
              if (option.value === field.value) opt.selected = true;
              control.append(opt);
            }
          } else if (field.type === "display") {
            control = document.createElement("div");
            control.className = "change-summary";
            control.dataset.display = field.name;
            control.textContent = field.value || "";
          } else {
            control = document.createElement("input");
            control.name = field.name;
            control.value = field.value || "";
          }
          label.append(control);
          el("simpleFields").append(label);
        }
        el("simpleForm").onsubmit = async (event) => {
          event.preventDefault();
          await run(() => onSubmit(new FormData(event.currentTarget)), "Done");

      }
      el("cancelSimpleBtn").onclick = () => el("simpleModal").close();

      async function dropCard(event, columnUuid) {
        if (!draggedCard) return;
        event.preventDefault();
        event.stopPropagation();
        await commitCardDrop(event.currentTarget, columnUuid);
      }

      async function commitCardDrop(list, columnUuid) {
        if (!draggedCard) return;
        const dragging = document.querySelector(".card.dragging");
        const order = [...list.querySelectorAll(".card")].map(
          (item) => item.dataset.uuid,
        );
        const cardUuid = draggedCard;
        draggedCard = null;
        try {
          await run(
            () =>
              api("/api/initiative/cards/move", {
                card_uuid: cardUuid,
                column_uuid: columnUuid,
                index: Math.max(0, order.indexOf(cardUuid)),
              }),
            "Card moved",
          );
        } finally {
          dragging?.classList.remove("dragging");
          dragActive = false;
          await loadBoard();
        }
      }

      async function dropColumn(event, targetUuid) {
        event.preventDefault();
        if (!draggedColumn || draggedColumn === targetUuid) return;
        const order = columns(state.board).map((item) => item.uuid);
        const index = order.indexOf(targetUuid);
        const columnUuid = draggedColumn;
        draggedColumn = null;
        try {
          await run(
            () =>
              api("/api/initiative/columns/move", {
                column_uuid: columnUuid,
                index,
              }),
            "Column moved",
          );
        } finally {
          dragActive = false;
          await loadBoard();
        }
      }

      function onCardDragOver(event) {
        if (!draggedCard) return;
        event.preventDefault();
        event.stopPropagation();
        const dragging = document.querySelector(".card.dragging");
        if (!dragging) return;
        const after = cardAfterPointer(event.currentTarget, event.clientY);
        if (after) event.currentTarget.insertBefore(dragging, after);
        else event.currentTarget.append(dragging);
      }

      function cardAfterPointer(list, y) {
        return [...list.querySelectorAll(".card:not(.dragging)")].reduce(
          (best, child) => {
            const box = child.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            return offset < 0 && offset > best.offset ? { offset, child } : best;
          },
          { offset: Number.NEGATIVE_INFINITY, child: null },
        ).child;
      }

      function columns(board) {
        return sortNodes(
          (board.children || []).filter((node) => node.data.type === "kanban_column" && !node.deleted),
        );
      }
      function cards(column) {
        return sortNodes(
          (column.children || []).filter((node) => node.data.type === "kanban_card" && !node.deleted),
        );
      }
      function ghostColumns() {
        const localIds = new Set(columns(state.board).map((column) => column.uuid));
        const ghosts = new Map();
        for (const root of boardPeerRoots()) {
          for (const column of columns(root || { children: [] })) {
            if (!localIds.has(column.uuid) && !autoAdoptAllowsNode(column)) {
              ghosts.set(column.uuid, column);
            }
          }
        }
        return sortNodes([...ghosts.values()]);
      }
      function ghostCards(columnUuid) {
        const localColumn = findNode(state.board, columnUuid);
        const localIds = new Set(cards(localColumn || { children: [] }).map((card) => card.uuid));
        const ghosts = new Map();
        for (const root of boardPeerRoots()) {
          const peerColumn = findNode(root, columnUuid);
          for (const card of cards(peerColumn || { children: [] })) {
            if (!localIds.has(card.uuid) && !autoAdoptAllowsNode(card)) {
              ghosts.set(card.uuid, card);
            }
          }
        }
        return sortNodes([...ghosts.values()]);
      }
      function sortNodes(nodes) {
        return [...nodes].sort(
          (a, b) =>
            Number(a.data.order || 0) - Number(b.data.order || 0) ||
            a.created_at.localeCompare(b.created_at),
        );
      }
      function transitionInfo(uuid) {
        return (state.transition_by_node || {})[uuid] || null;
      }
      function applyTransitionClass(element, uuid, options = {}) {
        element.classList.remove("diff");
        [...element.classList]
          .filter((name) => name.startsWith("stage-"))
          .forEach((name) => element.classList.remove(name));
        element.removeAttribute("title");
        delete element.dataset.transitionLabel;
        const info = transitionInfo(uuid);
        if (!info || info.stage === "settled" || options.suppress) return;
        // One border colour per stage, and nothing else. The badge said what
        // relation the difference was, which is the one thing a person does
        // not need at a glance - and it said "+" for a deletion, because it
        // was keyed on the relation rather than on what actually changed.
        element.classList.add("diff", `stage-${info.stage}`);
        element.title = transitionLabel(info);
        element.dataset.transitionLabel = transitionLabel(info);
      }
      function peerLabel(address) {
        const user = (state.users || []).find((item) => item.address === address);
        if (user?.name && user.name !== "?") return user.name;
        const identityName = peerIdentityValue(address, "name");
        if (identityName) return identityName;
        const text = String(address || "");
        const match = text.match(/:(\d+)(?:\/)?$/);
        return match ? match[1] : text.replace(/^https?:\/\//, "") || "peer";
      }
      function peerStatus(address) {
        return (
          state.network?.peer_status?.[address] ||
          state.network?.peers?.[address]?.status || {
            state: "online",
            failures: 0,
            last_error: null,
          }
        );
      }
      function peerChannel(address) {
        // The only transport-shaped thing this app is allowed to show -
        // which channel (direct/relay) last delivered for this peer, or
        // null if unknown. Purely informational, never affects behavior.
        return state.network?.peers?.[address]?.channel || null;
      }
      function boardPeerAddresses() {
        const boardUuid = state.board?.uuid;
        if (!boardUuid) return [];
        return Object.entries(state.network?.peers || {})
          .filter(([, info]) => (info.topic_uuids || []).includes(boardUuid))
          .map(([addr]) => addr);
      }
      function boardPeerRoots() {
        const boardUuid = state.board?.uuid;
        return boardPeerAddresses()
          .map((addr) => findNode(state.peers?.[addr], boardUuid))
          .filter(Boolean);
      }
      function userForParticipant(participant) {
        const users = state.users || [];
        return (
          users.find((user) => user.id === participant) ||
          users.find((user) => user.profile_uuid === participant) ||
          users.find((user) => user.identity_key === participant) ||
          users.find((user) => user.address === participant) ||
          users.find((user) => user.name === participant) || {
            id: participant,
            profile_uuid: participant,
            identity_key: participant,
            address: "",
            name: "?",
            picture: "",
          }
        );
      }
      function initials(name) {
        return (
          String(name || "?")
            .split(/\s+/)
            .filter(Boolean)
            .slice(0, 2)
            .map((part) => part[0].toUpperCase())
            .join("") || "?"
        );
      }
      function cssUrl(value) {
        return String(value || "")
          .replaceAll("\\", "\\\\")
          .replaceAll('"', '\\"');
      }
      function peerIdentityValue(address, field) {
        const root = (state.peers || {})[address];
        const profile = findIdentityProfile(root);
        const node = findIdentityField(profile || root, field);
        return node?.data?.value || node?.data?.[field] || "";
      }
      function findIdentityProfile(node) {
        if (!node) return null;
        if (node.data?.type === "shared_user_profile") return node;
        for (const child of node.children || []) {
          const found = findIdentityProfile(child);
          if (found) return found;
        }
        return null;
      }
      function findIdentityField(node, field) {
        if (!node) return null;
        if (node.data?.type === "shared_user_profile") {
          if (field === "name" && node.data?.display_name)
            return { data: { value: node.data.display_name } };
          return node.data?.[field] ? node : null;
        }
        for (const child of node.children || []) {
          const found = findIdentityField(child, field);
          if (found) return found;
        }
        return null;
      }
      function findNode(node, uuid) {
        if (!node) return null;
        if (node.uuid === uuid) return node;
        for (const child of node.children || []) {
          const found = findNode(child, uuid);
          if (found) return found;
        }
        return null;
      }
      async function run(action, ok) {
        try {
          await action();
          showToast(ok || "Done");
          await loadBoard();
          return true;
        } catch (error) {
          showToast(error.message, true);
          return false;
        }
      }

      // The header indicator still opens the setting, which now lives in the
      // shell's collaboration pane rather than this page's own panel.
      // Hand the application's own header controls to the shell before it
      // renders, so they land in its regions rather than beside it.
      const kanbanControls = el("kanbanHeaderControls").content;
      const adoptTools = kanbanControls.querySelector("#boardAdoptTools");
      const autoAdoptIndicator = kanbanControls.querySelector("#autoAdoptHeaderControl");

      SovereignShell.mount({
        container: el("shell"),
        applicationId: "initiative",
        topicUuid: () => state?.board?.uuid || "",
        state: () => state || {},
        // The pane is the shell's; Kanban supplies where its routes live and
        // the two extra modes judged against card ownership, which Core
        // stores without interpreting.
        agendaRoutes: {
          topicKey: 'board_uuid',
          create: '/api/initiative/agenda/create',
          delete: '/api/initiative/agenda/delete',
          setPriority: '/api/initiative/agenda/set_priority',
          move: '/api/initiative/agenda/move',
        },
        autoAdoptRoute: {path: '/api/initiative/auto_adopt', topicKey: 'board_uuid'},
        autoAdoptLabels: AUTO_ADOPT_LABELS,
        autoAdoptDescriptions: AUTO_ADOPT_DESCRIPTIONS,
        renderAutoAdoptIndicator: (container, mode) => {
          container.classList.add("auto-adopt-square");
          renderAutoAdoptSquare(container, mode);
        },
        describeNode: (uuid) => {
          const node = findNode(state?.board, uuid);
          return node ? (node.data.name || node.data.text || '') : '';
        },
        revealNode: (uuid) => highlightCard(uuid),
        onChanged: () => loadBoard(),
      });
      SovereignShell.setAppActions(adoptTools, autoAdoptIndicator);

      el("autoAdoptHeaderControl").onclick = () => SovereignShell.openConnectionPanel();
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") SovereignShell.closeCollab();
      });

      async function selectBoardFromUrl() {
        const params = new URLSearchParams(window.location.search);
        const boardUuid = params.get("board");
        if (!boardUuid) return;
        try {
          await api("/api/initiative/boards/select", { board_uuid: boardUuid });
        } catch (error) {
          showToast(error.message, true);
        }
        params.delete("board");
        const query = params.toString();
        window.history.replaceState({}, "", window.location.pathname + (query ? `?${query}` : ""));
      }

      setInterval(() => loadBoard(), 1500);
      selectBoardFromUrl().then(loadBoard);
    </script>
  </body>
</html>
