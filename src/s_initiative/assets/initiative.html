<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>S-Initiative</title>
    <link rel="stylesheet" href="/shared.css" />
    <link rel="stylesheet" href="/apps/initiative/styles.css" />
  </head>
  <body>
    <div id="toast" class="toast"></div>
    <!-- The shell owns the bar and holds nothing of an application's (U7).
         The initiative title goes in the topic region, and the adopt tools
         beside it, because that is the thing they decide about. -->
    <header class="topbar"><div id="shell"></div></header>

    <template id="initiativeHeaderControls">
      <div id="boardAdoptTools" class="adopt-tools"></div>
    </template>


    <main>
      <!-- Two faces: the board is the next few days, the mandate is what
           was agreed. Named Mandate and not Initiative because the topic is
           already called the initiative, and one word for a part and for the
           whole tells a reader nothing about either. The switch is in the
           content area and not in the shell bar (U7) - the bar's navigation
           row is destinations among topics. -->
      <nav id="faceSwitch" class="face-switch"></nav>
      <section id="board" class="board"></section>
      <section id="mandate" class="mandate-face" hidden></section>
    </main>

    <dialog id="cardModal">
      <form method="dialog" id="cardForm">
        <h2 id="cardModalTitle">Card</h2>
        <div id="cardPerspectiveSwitcher" class="perspective-switcher"></div>
        <p id="cardPerspectiveMeta" class="perspective-meta"></p>
        <label>Name<input id="cardName" /></label>
        <label>Description<textarea id="cardDescription" rows="5"></textarea></label>
        <div class="card-owner-row">
          <label>Owner<select id="cardOwner" class="ui-select"></select></label>
          <div class="card-files">
            <span class="card-files-label">Files</span>
            <input id="cardFileInput" type="file" hidden />
            <button type="button" id="attachFileBtn">Attach file…</button>
          </div>
        </div>
        <div id="cardAttachmentList" class="attachment-list"></div>
        <label>Members</label>
        <div id="participantPicker" class="user-picker"></div>
        <div id="cardComments" class="card-comments">
          <h3 class="card-comments-title">Activity</h3>
          <div id="cardCommentList" class="comment-list"></div>
          <div class="comment-add">
            <textarea id="cardCommentInput" rows="2" placeholder="Add a comment…"></textarea>
            <button type="button" id="addCommentBtn" class="primary">Comment</button>
          </div>
        </div>
        <menu>
          <button id="deleteCardBtn" type="button" class="danger">Delete</button>
          <button type="button" id="cancelCardBtn">Cancel</button>
          <button type="submit" id="saveCardBtn" class="primary">Save</button>
        </menu>
      </form>
    </dialog>

    <dialog id="simpleModal">
      <form method="dialog" id="simpleForm">
        <h2 id="simpleTitle">Action</h2>
        <div id="simpleFields"></div>
        <menu>
          <button type="button" id="cancelSimpleBtn">Cancel</button>
          <button type="submit" id="submitSimpleBtn" class="primary">Apply</button>
        </menu>
      </form>
    </dialog>

    <dialog id="confirmModal">
      <h2 id="confirmModalTitle">Action</h2>
      <p id="confirmModalMessage" class="confirm-text"></p>
      <menu>
        <button type="button" id="confirmModalCancelBtn">Cancel</button>
        <button type="button" id="confirmModalConfirmBtn" class="danger">Confirm</button>
      </menu>
    </dialog>

    <script src="/shared-api.js"></script>
    <script src="/shared.js"></script>
    <script>
      let state = null;
      let draggedCard = null;
      let dragActive = false;
      let modalCard = null;
      let modalColumn = null;
      let modalParticipants = [];
      let modalOwner = null;
      let modalPerspectiveKey = null;
      let modalPerspectiveOptions = [];
      let modalLocalDraft = null;
      let modalReadOnlyPerspective = false;

      // Which face is showing, and anything the mandate face is
      // remembering about itself. In JS and never in the DOM: that face
      // re-renders wholesale on every payload, so a surface trusted to hold
      // its own open/closed state loses it every 1500ms, and DOM patching is
      // not the fix for that.
      //
      // The face is not remembered across a reload. Opening lands on the
      // board, every time - a remembered face means one link opens two
      // different pages for two people.
      const ephemeral = {
        face: "board",
        disclosures: {},
        drafts: {},
      };
      // What the mandate face last drew, so an unchanged payload does not
      // rebuild it. Deliberately not the node's `revision`: peer liveness is
      // merged into the snapshot after it is read, so a transport change may
      // not advance it and the face would freeze.
      let renderedMandateJson = null;

      const AUTO_ADOPT_MODES = ["always", "not_owner", "not_member", "never"];
      // Only the two modes Core does not know about. The wording for
      // "always" and "never" is Core's and is inherited, so the same setting
      // cannot read one way here and another in the Cockpit - which is what
      // three copies of this table produced (DESIGN_VOCABULARY.md).
      const AUTO_ADOPT_LABELS = {
        not_owner: "Except cards I own",
        not_member: "Except cards I'm on",
      };
      const AUTO_ADOPT_FILL = { always: 4, not_owner: 2, not_member: 1, never: 0 };
      const AUTO_ADOPT_DESCRIPTIONS = {
        not_owner: "Changes from other people are adopted automatically, except on cards you own.",
        not_member:
          "Changes from other people are adopted automatically, except on cards you're a member of.",
      };

      const el = (id) => document.getElementById(id);

      function autoAdoptAllowsNode(node) {
        const mode = state.auto_adopt_mode;
        if (mode === "always") return true;
        if (mode === "never") return false;
        if (!node || node.data.type !== "kanban_card") return true;
        const myId = (state.users || [])[0]?.id;
        if (mode === "not_owner") return node.data.owner !== myId;
        if (mode === "not_member") return !(node.data.participants || []).includes(myId);
        return true;
      }

      function hasPendingDivergence(node) {
        const info = transitionInfo(node.uuid);
        return !!info && !["settled", "in_flight"].includes(info.stage);
      }

      function needsManualAdopt(node) {
        if (!hasPendingDivergence(node)) return false;
        const info = transitionInfo(node.uuid);
        const autoResolvableType = info.type === "peer_made_changes" || info.type === "local_missing_node";
        return !autoResolvableType || !autoAdoptAllowsNode(node);
      }

      function needsReaction(node) {
        return needsManualAdopt(node);
      }

      // A ghost is the seat a card has left: the position one side still
      // gives it after the other has moved or deleted it. The solid card is
      // always the current decision, wherever it now sits - the peer's if
      // they made the move and we have not taken it yet, ours if we made it.
      // Whoever is behind sees the ghost until they catch up, which is the
      // same rule read from either screen.
      function peerRootOf(node) {
        const info = transitionInfo(node.uuid);
        return info?.peer_addr ? state.peers?.[info.peer_addr] || null : null;
      }

      function peerCopyOf(node) {
        const root = peerRootOf(node);
        return root ? findNode(root, node.uuid) : null;
      }

      function movedByPeer(localNode) {
        // The peer moved or deleted this and we have not taken it: our copy
        // marks the seat it left, theirs holds the current one.
        const info = transitionInfo(localNode.uuid);
        if (!info || info.stage !== "awaiting_me") return false;
        const root = peerRootOf(localNode);
        // Without their tree there is no second position to know about, so
        // nothing has been displaced as far as this screen can tell.
        if (!root) return false;
        const peerNode = findNode(root, localNode.uuid);
        if (!peerNode || peerNode.deleted) return true;
        return peerNode.parent_uuid !== localNode.parent_uuid;
      }

      function movedByMe(peerNode) {
        // The mirror image: I moved or deleted it and the peer still shows
        // the old seat. Deliberately not drawn while my change is only
        // "in_flight" - that stage means nobody has been seen holding out
        // yet, and a ghost that flashes up after every move I make would say
        // nothing except that syncing takes a moment. "awaiting_peer" is the
        // fact that they have observed my revision and kept theirs, which is
        // exactly when their copy becomes a seat somebody is still sitting
        // in. So auto-adopting peers never produce a ghost here at all.
        //
        // A conflict is drawn the same way for want of a better answer: with
        // both sides having moved there is no agreed seat, so ours stays
        // solid and theirs shows as the position they are still arguing for.
        const info = transitionInfo(peerNode.uuid);
        if (!info || !["awaiting_peer", "conflict"].includes(info.stage)) {
          return false;
        }
        const localNode = findNode(state.initiative, peerNode.uuid);
        if (!localNode || localNode.deleted) return true;
        return localNode.parent_uuid !== peerNode.parent_uuid;
      }

      function peerOnlyNode(peerNode) {
        // Nothing was displaced - the peer simply holds something we have
        // never had. There is no seat to mark, so the ghost stands for the
        // node itself, as it always has.
        const info = transitionInfo(peerNode.uuid);
        if (!info || info.stage !== "awaiting_me") return false;
        return !findNode(state.initiative, peerNode.uuid);
      }

      function currentSeatOf(node) {
        // The copy drawn solid for this uuid, or null when every side that
        // had it has let it go - a deletion nobody has answered yet.
        const local = findNode(state.initiative, node.uuid);
        if (!local || local.deleted) return null;
        if (!movedByPeer(local)) return local;
        const peerNode = peerCopyOf(local);
        return peerNode && !peerNode.deleted ? peerNode : null;
      }

      function localViewOf(node) {
        // A card drawn at the seat the peer moved it to is their copy. The
        // dialog compares versions and writes to ours, so it must be opened
        // on the local node even when the tile came from their tree.
        const local = findNode(state.initiative, node.uuid);
        return local && !local.deleted ? local : node;
      }

      function isContainerOnlyDivergence(node) {
        // True when a container's own fields match the peer's copy exactly,
        // and the only reason it shows as diverged is that its content_hash
        // depends on its children (e.g. a card moved in or out) - that's
        // already surfaced on the child itself, so a separate "Adopt" here
        // would just be noise for the same underlying event.
        const peerNode = peerCopyOf(node);
        if (!peerNode) return false;
        return (
          JSON.stringify(node.data) === JSON.stringify(peerNode.data) &&
          JSON.stringify(node.weights || {}) === JSON.stringify(peerNode.weights || {}) &&
          (node.data.type === "initiative" || node.parent_uuid === peerNode.parent_uuid)
        );
      }

      function renderAutoAdoptSquare(container, mode = state.auto_adopt_mode) {
        container.replaceChildren();
        const filled = AUTO_ADOPT_FILL[mode] ?? 4;
        for (let i = 0; i < 4; i++) {
          const cell = document.createElement("span");
          cell.className = "auto-adopt-cell";
          if (i < filled) cell.classList.add("filled");
          container.append(cell);
        }
      }

      const api = SovereignApi.request;

      function renderNetwork() {
        // The shell draws the cluster; S-Initiative only says which peers
        // belong to this initiative and what each of them looks like.
        SovereignShell.refresh();
      }

      function renderSelfAvatar() {
        // Core owns the profile, so the shell draws and edits the avatar.
        SovereignShell.refreshAvatar();
      }

      function avatarElement(user, online) {
        const avatar = document.createElement("span");
        avatar.className = "header-avatar";
        avatar.classList.add(online ? "status-online" : "status-offline");
        if (user.picture) {
          avatar.style.backgroundImage = `url("${cssUrl(user.picture)}")`;
        } else {
          avatar.textContent = initials(user.name);
        }
        return avatar;
      }

      function peerPresence(addr) {
        // One presence answer per peer: relay peers get real liveness from
        // presence-file mtimes (server-attached channel_liveness) - their
        // http-shaped peer_status is always "online, never seen", which
        // made a stopped relay peer look permanently alive. Direct peers
        // keep the http status.
        const relayLive = state.network?.peers?.[addr]?.channel_liveness;
        if (relayLive) {
          if (relayLive.state === "alive") {
            const ago = Math.max(0, Math.round(relayLive.last_seen_seconds_ago || 0));
            return { online: true, metaText: `online - relay, ${ago}s ago` };
          }
          if (relayLive.state === "stale") {
            const ago = Math.round(relayLive.last_seen_seconds_ago || 0);
            return { online: false, metaText: `stale - last relay heartbeat ${ago}s ago` };
          }
          return { online: false, metaText: "no relay heartbeat yet" };
        }
        const info = peerStatus(addr);
        const online = info.state !== "offline";
        return {
          online,
          metaText: `${online ? "online" : "on hold"} - ${formatLastSeen(info.last_seen)}`,
        };
      }

      function formatLastSeen(timestamp) {
        if (!timestamp) return "never";
        const seconds = Math.max(0, Date.now() / 1000 - timestamp);
        if (seconds < 60) return "just now";
        if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
        if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
        return `${Math.floor(seconds / 86400)}d ago`;
      }

      const AGENDA_PRIORITY_LABELS = { "": "No priority", high: "High", medium: "Medium", low: "Low" };

      function highlightCard(uuid) {
        const target = document.querySelector(`[data-uuid="${uuid}"]`);
        if (!target) return;
        SovereignShell.closeCollab();
        target.scrollIntoView({ behavior: "smooth", block: "center" });
        target.classList.add("highlight-flash");
        setTimeout(() => target.classList.remove("highlight-flash"), 1500);
      }

      function initiativeUsers() {
        const initiativePeers = new Set(initiativePeerAddresses());
        return (state.users || []).filter(
          (user) => user.address === state.address || initiativePeers.has(user.address),
        );
      }

      function pickerCandidates() {
        // New assignments are restricted to current initiative members,
        // but someone already assigned before they (or we) left the
        // initiative must stay visible here too - otherwise there's no way to
        // ever remove that stale assignment again, since they'd never appear
        // in the list.
        const members = initiativeUsers();
        const memberIds = new Set(members.map((user) => user.id));
        const already = modalParticipants
          .filter((id) => !memberIds.has(id))
          .map((id) => userForParticipant(id));
        return [...members, ...already];
      }

      function renderUserPicker(containerId) {
        const container = el(containerId);
        container.replaceChildren();
        for (const user of pickerCandidates()) {
          const button = document.createElement("button");
          button.type = "button";
          button.disabled = modalReadOnlyPerspective;
          button.className = "user-choice";
          if (modalParticipants.includes(user.id)) button.classList.add("selected");
          const avatar = SovereignUI.avatar(user, {
            className: "participant-avatar",
            self: user.address === state.address,
          });
          const name = document.createElement("span");
          name.textContent = user.name;
          button.append(avatar, name);
          button.onclick = () => {
            const index = modalParticipants.indexOf(user.id);
            if (index >= 0) {
              modalParticipants.splice(index, 1);
              if (modalOwner === user.id) modalOwner = null;
            } else if (user.id) {
              modalParticipants.push(user.id);
            }
            renderUserPicker(containerId);
            renderOwnerSelect();
          };
          container.append(button);
        }
      }

      function renderOwnerSelect() {
        const select = el("cardOwner");
        SovereignUI.selectOptions(
          select,
          modalParticipants.map((id) => [id, userForParticipant(id).name]),
          {
            emptyLabel: "Unassigned",
            value: modalParticipants.includes(modalOwner) ? modalOwner : "",
            disabled: modalReadOnlyPerspective,
          },
        );
        modalOwner = select.value || null;
      }

      async function loadBoard() {
        if (dragActive || el("board")?.dataset.reordering === "true") return;
        try {
          state = await api("/api/initiative/board");

          // Core owns the name of the topic in every application's bar.
          // Reaching another initiative is the Cockpit's, not a list of
          // this client's initiatives hidden in this one's header.
          SovereignShell.setTopicName({
            label: "Initiative",
            title: state.initiative.data.name || "Initiative",
            onRename: (name) => run(
              () => api("/api/initiative/initiatives/rename", {
                initiative_uuid: state.initiative.uuid,
                name,
              }),
              "Initiative renamed",
            ),
          });

          renderBoardAdoptTools();

          renderNetwork();
          renderSelfAvatar();

          renderLinks();

          renderFaceSwitch();
          // One fetch, and only the face you are looking at is drawn. The
          // two render differently on purpose (DESIGN_INITIATIVE_UI.md 8):
          // the board patches because drag-and-drop needs stable element
          // identity across renders, the mandate face rebuilds because a
          // create/update pair per node type is a silent bug class this
          // codebase has already met. This is the one place they meet.
          if (ephemeral.face === "mandate") renderMandate();
          else renderBoard();
        } catch (error) {
          showToast(error.message, true);
        }
      }

      function showFace(face) {
        ephemeral.face = face;
        el("board").hidden = face !== "board";
        el("mandate").hidden = face !== "initiative";
        // The face was hidden while the payload moved on, so the skip check
        // below has nothing useful to compare against.
        renderedMandateJson = null;
        renderFaceSwitch();
        if (face === "mandate") renderMandate();
        else renderBoard();
      }

      // Two items, the current one marked. Named after the two objects the
      // domain already has, so naming a face after the thing it shows needs
      // no explanation (U8).
      const FACES = [
        ["board", "Board"],
        ["mandate", "Mandate"],
      ];

      function renderFaceSwitch() {
        const nav = el("faceSwitch");
        nav.replaceChildren();
        for (const [face, label] of FACES) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "face-switch-item";
          button.textContent = label;
          const current = ephemeral.face === face;
          button.setAttribute("aria-current", current ? "page" : "false");
          button.onclick = () => showFace(face);
          nav.append(button);
        }
      }

      // The mandate face rebuilds itself whole, and does not use
      // reconcileDOM. DESIGN_INITIATIVE_UI.md 8 gives the reason: the helper
      // needs a create/update pair per node type, this face will have seven,
      // and a pair falling out of step draws the old thing until something
      // forces a rebuild.
      function renderMandate() {
        const article = el("mandate");
        // Never rebuild it while it is being typed into, or the 1500ms poll
        // empties the box mid-word.
        if (
          article.contains(document.activeElement) &&
          (document.activeElement.isContentEditable ||
            document.activeElement.matches("input, textarea, select"))
        ) return;
        const initiative = state.initiative;
        if (!initiative) {
          article.replaceChildren();
          renderedMandateJson = null;
          return;
        }
        const encoded = JSON.stringify(initiative.data ?? null);
        if (encoded === renderedMandateJson) return;
        renderedMandateJson = encoded;
        article.replaceChildren(mandateHead(initiative));
      }

      // The head is not a disclosure. One paragraph and four dates, always
      // open: it is the answer to "what is this", and a caret in front of it
      // would suggest there is a version of this page on which the objective
      // is not the first thing said.
      function mandateHead(initiative) {
        const head = document.createElement("header");
        head.className = "mandate-head";
        const objective = SovereignUI.editableText({
          tag: "p",
          className: "mandate-objective",
          value: initiative.data.objective || "",
          placeholder: "What is this initiative meant to change?",
          onCommit: (value) => api("/api/initiative/initiatives/set_objective", {
            initiative_uuid: initiative.uuid,
            objective: value,
          }),
          onChanged: async () => {
            showToast("Objective saved");
            await loadBoard();
          },
          onError: (error) => showToast(error.message, true),
        });
        head.append(objective, mandateDates(initiative));
        return head;
      }

      function mandateDates(initiative) {
        const row = document.createElement("p");
        row.className = "mandate-dates";
        const data = initiative.data || {};
        const arrow = document.createElement("span");
        arrow.className = "mandate-date-arrow";
        arrow.textContent = "→";
        row.append(
          plannedDate(initiative, "planned_start", "Planned start"),
          arrow,
          plannedDate(initiative, "planned_end", "Planned end"),
        );
        // A claim is said here and never edited here. Claiming happens on
        // the day it is true, from the board, and clearing one is undoing a
        // claim rather than tidying a field - so the face must not draw it
        // as another box to correct.
        const claimed = [["actual_start", "Started"], ["actual_end", "Ended"]]
          .filter(([field]) => data[field])
          .map(([field, label]) => `${label} ${formatDay(data[field])}`);
        if (claimed.length) {
          const said = document.createElement("span");
          said.className = "mandate-claims";
          said.textContent = claimed.join(" · ");
          row.append(said);
        }
        return row;
      }

      // Core's SovereignUI has no date primitive and one caller is not
      // enough to guess the second one's needs, so this stays local until
      // there is a second (PLAN_INITIATIVE_FACE.md 3).
      function plannedDate(initiative, field, label) {
        const wrap = document.createElement("label");
        wrap.className = "mandate-date";
        const caption = document.createElement("span");
        caption.className = "mandate-date-label";
        caption.textContent = label;
        const input = document.createElement("input");
        input.type = "date";
        input.className = "mandate-date-input";
        input.value = initiative.data?.[field] || "";
        input.onchange = () => run(
          () => api("/api/initiative/initiatives/set_dates", {
            initiative_uuid: initiative.uuid,
            [field]: input.value,
          }),
          input.value ? "Date planned" : "Date cleared",
        );
        wrap.append(caption, input);
        return wrap;
      }

      function formatDay(iso) {
        if (!iso) return "";
        const day = new Date(`${iso}T00:00:00`);
        if (Number.isNaN(day.getTime())) return iso;
        return day.toLocaleDateString(undefined, {
          day: "numeric", month: "short", year: "numeric",
        });
      }

      function renderBoard() {
        const board = el("board");

        // Alle Spalten (regulär + ghost) aus dem State holen und markieren.
        // A column the peer has deleted stops being live here at once and is
        // left as a ghost, and ghosts sort in among the live columns rather
        // than after them - a ghost stands for a seat, so it belongs where
        // that seat was.
        const activeCols = columns(state.initiative)
          .filter((column) => !movedByPeer(column))
          .map((c) => ({ ...c, _isGhost: false }));
        const ghostCols = ghostColumns().map((c) => ({ ...c, _isGhost: true }));
        const allCols = sortNodes([...activeCols, ...ghostCols]);

        // Diffing für Spalten
        reconcileDOM(
          board,
          allCols,
          (col) => `${col.uuid}:${col._isGhost ? "ghost" : "local"}`,
          (col) => renderColumn(col, col._isGhost), // Deine bestehende Funktion erstellt das Grundgerüst
          (colEl, col) => updateColumnDOM(colEl, col), // Patcht nur Änderungen
        );

        // "Add Column" Button anfügen/ans Ende schieben
        let addBtn = board.querySelector(".add-column");
        if (!addBtn) {
          addBtn = document.createElement("button");
          addBtn.className = "add-column ui-button";
          addBtn.textContent = "+ Add column";
          addBtn.onclick = () =>
            openSimple(
              "Add Column",
              [{ name: "name", label: "Name", value: "New column" }],
              async (form) => api("/api/initiative/columns/create", { name: form.get("name") }),
            );
        }
        board.appendChild(addBtn);
        SovereignUI.reorderableList({
          container: board,
          itemSelector: ".column:not(.ghost)",
          axis: "horizontal",
          getId: (column) => column.dataset.uuid,
          onMove: ({id, index}) => api("/api/initiative/columns/move", {
            column_uuid: id, index,
          }),
          onChanged: async () => {
            showToast("Column moved");
            await loadBoard();
          },
          onError: error => showToast(error.message, true),
        });
      }

      // What this initiative belongs to and runs, beside its name in the
      // shell's bar. Core draws the chips and carries out taking one up and
      // removing one; this says what there is and what making one calls.
      function renderLinks() {
        SovereignShell.setTopicLinks({
          links: state.links || [],
          make: (state.link_kinds || []).map((kind) => ({
            label: `New ${kind.noun.toLowerCase()}`,
            onSelect: () => SovereignShell.openNewTopicDialog({
              noun: kind.noun,
              templates: (kind.templates || []).map(
                (option) => [option.value, option.name],
              ),
              templateRequired: kind.template_required,
              snapshotType: kind.application_id,
              onCreate: ({name, template, snapshot}) => run(
                () => api("/api/initiative/links/make", {
                  initiative_uuid: state.initiative.uuid,
                  application_id: kind.application_id,
                  title: name,
                  template,
                  snapshot,
                }),
                `${name} is named here`,
              ),
            }),
          })),
          link: (state.linkable_topics || []).map((topic) => ({
            label: `${topic.title} · ${topic.label}`,
            onSelect: () => run(
              () => api("/api/initiative/links/create", {
                initiative_uuid: state.initiative.uuid,
                topic_uuid: topic.topic_uuid,
                application_id: topic.application_id,
                title: topic.title,
              }),
              `${topic.title} is named here`,
            ),
          })),
          onFollow: (link) => run(
            () => api("/api/initiative/links/follow", {link_uuid: link.uuid}),
            `Joined ${link.title}`,
          ),
          onRemove: (link) => run(
            () => api("/api/initiative/links/remove", {link_uuid: link.uuid}),
            "Reference removed",
          ),
        });
      }

      // --- NEUE HELFER FÜR DAS DIFFING ---

      function updateColumnDOM(colEl, col) {
        // Spaltentitel-Input schützen, falls der Cursor drin ist
        const nameInput = colEl.querySelector(".column-name");
        if (nameInput && document.activeElement !== nameInput) {
          SovereignUI.editableText({
            element: nameInput,
            value: col.data.name || "Column",
          });
        }

        // P2P Konflikt-Klassen/Adopt-Tools aktualisieren - sonst bleibt ein
        // Adopt-Button verschwunden (oder fehlt neu aufgetauchter Divergenz),
        // solange die Spalte nur gepatcht statt neu gerendert wird.
        applyTransitionClass(colEl, col.uuid, {
          suppress: !col._isGhost && isContainerOnlyDivergence(col),
        });
        const tools = colEl.querySelector(".adopt-tools");
        if (tools) {
          tools.replaceChildren();
          if (col._isGhost || !isContainerOnlyDivergence(col)) {
            tools.append(...reactionTools(col));
          }
        }

        const cardList = colEl.querySelector(".card-list");
        if (!cardList) return;

        // Karten für diese Spalte ermitteln - identisch zur Vollansicht,
        // sonst zeigt eine gepatchte Spalte eine andere Wahrheit als eine
        // frisch gerenderte.
        const activeCards = (col._isGhost ? cards(col) : solidCards(col))
          .map((c) => ({ ...c, _isGhost: false }));
        const gCards = col._isGhost
          ? []
          : ghostCards(col.uuid).map((c) => ({ ...c, _isGhost: true }));
        // Sorted together, exactly as the full render does: a ghost carries
        // the position it was given, and appending it after the real cards
        // showed one that belonged first sitting last.
        const allCards = sortNodes([...activeCards, ...gCards]);

        // Diffing für Karten
        reconcileDOM(
          cardList,
          allCards,
          (card) => `${card.uuid}:${card._isGhost ? "ghost" : "local"}`,
          (card) => renderCard(card, card._isGhost), // Deine bestehende Funktion
          (cardEl, card) => updateCardDOM(cardEl, card),
        );
      }

      function updateCardDOM(cardEl, card) {
        // onclick captures `card` by closure, so it must be rebound on every
        // patch - otherwise it keeps pointing at whatever card data was
        // current the last time this DOM element was freshly created,
        // reopening the modal with stale participants/owner.
        cardEl.onclick = (event) => {
          if (card._isGhost) return;
          if (isInteractiveCardTarget(event)) return;
          const view = localViewOf(card);
          openCard(view, view.parent_uuid);
        };

        // Aktualisiert nur Text und Klassen, erhält Drag&Drop-Listener
        const titleEl = cardEl.querySelector(".card-title");
        if (titleEl) {
          titleEl.textContent = card.data.name || "Card";
        }

        const descEl = cardEl.querySelector(".card-desc");
        if (card.data.description && descEl) {
          descEl.textContent = card.data.description || "";
        } else if (card.data.description) {
          const desc = document.createElement("div");
          desc.className = "card-desc";
          desc.textContent = card.data.description;
          titleEl?.after(desc);
        } else if (descEl) {
          descEl.remove();
        }

        const participantItems = Array.isArray(card.data.participants)
          ? card.data.participants
          : [];
        const participantsEl = cardEl.querySelector(".participants");
        if (participantItems.length) {
          const rendered = renderParticipants(participantItems, card.data.owner);
          if (participantsEl) participantsEl.replaceWith(rendered);
          else {
            const reactionEl = cardEl.querySelector(".react-button");
            cardEl.insertBefore(rendered, reactionEl || null);
          }
        } else if (participantsEl) {
          participantsEl.remove();
        }

        // P2P Konflikt-Klassen aktualisieren (nutzt deine bestehende Helper-Funktion)
        applyTransitionClass(cardEl, card.uuid);
        cardEl.querySelectorAll(".react-button, .adopt, .keep-mine-menu").forEach((button) => button.remove());
        cardEl.append(...cardReactionTools(card, card._isGhost));
      }

      function renderColumn(column, ghost = false) {
        const article = document.createElement("article");
        article.className = "column";
        if (ghost) article.classList.add("ghost");
        article.dataset.uuid = column.uuid;
        article.dataset.reorderId = column.uuid;
        applyTransitionClass(article, column.uuid, {
          suppress: !ghost && isContainerOnlyDivergence(column),
        });

        const head = document.createElement("div");
        head.className = "column-head";
        if (!ghost) {
          head.append(SovereignUI.reorderHandle({label: "Reorder column"}));
        }
        const name = document.createElement("h3");
        name.className = "column-name";
        SovereignUI.editableText({
          element: name,
          value: column.data.name || "Column",
          placeholder: "Column name",
          editable: !ghost,
          onCommit: (value) => api("/api/initiative/columns/rename", {
            column_uuid: column.uuid,
            name: value,
          }),
          onChanged: async () => {
            showToast("Column renamed");
            await loadBoard();
          },
          onError: error => showToast(error.message, true),
        });
        const del = iconButton(ICON_DELETE, "Delete column", () =>
          confirmAction("Delete column?", "This deletes the column and all cards inside it.", () =>
            run(
              () =>
                api("/api/initiative/columns/delete", {
                  column_uuid: column.uuid,
                }),
              "Column deleted",
            ),
          ),
        );
        del.classList.add("delete-icon-btn");
        if (ghost) del.style.display = "none";
        head.append(name, del);
        const tools = document.createElement("div");
        tools.className = "adopt-tools";
        if (ghost || !isContainerOnlyDivergence(column)) {
          tools.append(...reactionTools(column));
        }
        head.append(tools);
        article.append(head);

        const list = document.createElement("div");
        list.className = "card-list";
        list.dataset.columnUuid = column.uuid;
        if (!ghost) {
          list.ondragover = onCardDragOver;
          list.ondrop = (event) => dropCard(event, column.uuid);
        }
        // Ghosts are ordered among the real cards, not appended after them.
        // A ghost carries the position the seat had, so tacking it onto the
        // end showed a card that belonged first sitting last - and then made
        // it jump on adoption, as though adopting had moved it.
        const ghosts = ghost ? [] : ghostCards(column.uuid);
        const ghostUuids = new Set(ghosts.map((card) => card.uuid));
        const solid = ghost ? cards(column) : solidCards(column);
        sortNodes([...solid, ...ghosts]).forEach((card) =>
          list.append(renderCard(card, ghostUuids.has(card.uuid))),
        );
        article.append(list);

        const add = document.createElement("button");
        add.className = "add-card ui-button";
        add.textContent = "+ Add card";
        add.onclick = () => openCard(null, column.uuid);
        if (!ghost) article.append(add);

        return article;
      }

      function renderCard(card, ghost = false) {
        const node = document.createElement("div");
        node.className = "card";
        if (ghost) node.classList.add("ghost");
        applyTransitionClass(node, card.uuid);
        node.draggable = false;
        node.dataset.uuid = card.uuid;
        node.replaceChildren();
        const title = document.createElement("div");
        title.className = "card-title";
        title.textContent = card.data.name || "Card";
        node.append(title);
        if (card.data.description) {
          const desc = document.createElement("div");
          desc.className = "card-desc";
          desc.textContent = card.data.description;
          node.append(desc);
        }
        const participantItems = Array.isArray(card.data.participants)
          ? card.data.participants
          : [];
        if (participantItems.length) node.append(renderParticipants(participantItems, card.data.owner));
        node.append(...cardReactionTools(card, ghost));
        node.onclick = (event) => {
          if (ghost) return;
          if (node.dataset.suppressClick === "true") {
            delete node.dataset.suppressClick;
            return;
          }
          if (isInteractiveCardTarget(event)) return;
          const view = localViewOf(card);
          openCard(view, view.parent_uuid);
        };
        if (!ghost) {
          node.onmousedown = (event) => {
            if (event.button !== 0 || isInteractiveCardTarget(event)) return;
            // Prevent the browser's text-selection gesture from competing
            // with card dragging. A normal click still opens the card.
            event.preventDefault();
            document.body.classList.add("card-drag-pending");
            const startX = event.clientX;
            const startY = event.clientY;
            const startRect = node.getBoundingClientRect();
            const grabOffsetX = startX - startRect.left;
            const grabOffsetY = startY - startRect.top;
            let moved = false;
            let preview = null;
            const removeDragChrome = () => {
              document.body.classList.remove(
                "card-drag-pending", "card-drag-active",
              );
              preview?.remove();
              preview = null;
            };
            const move = (moveEvent) => {
              if (!moved && Math.hypot(
                moveEvent.clientX - startX,
                moveEvent.clientY - startY,
              ) < 4) return;
              moveEvent.preventDefault();
              if (!moved) {
                moved = true;
                draggedCard = card.uuid;
                dragActive = true;
                node.classList.add("dragging");
                document.body.classList.add("card-drag-active");
                preview = node.cloneNode(true);
                preview.classList.remove("dragging", "diff");
                [...preview.classList]
                  .filter((name) => name.startsWith("stage-"))
                  .forEach((name) => preview.classList.remove(name));
                preview.classList.add("card-drag-preview");
                preview.setAttribute("aria-hidden", "true");
                preview.style.width = `${startRect.width}px`;
                document.body.append(preview);
              }
              preview.style.left = `${moveEvent.clientX - grabOffsetX}px`;
              preview.style.top = `${moveEvent.clientY - grabOffsetY}px`;
              const list = document.elementFromPoint(
                moveEvent.clientX, moveEvent.clientY,
              )?.closest(".card-list");
              if (!list) return;
              const after = cardAfterPointer(list, moveEvent.clientY);
              if (after) list.insertBefore(node, after);
              else list.append(node);
            };
            const up = async () => {
              document.removeEventListener("mousemove", move);
              document.removeEventListener("mouseup", up);
              removeDragChrome();
              if (!moved) return;
              node.dataset.suppressClick = "true";
              const list = node.closest(".card-list");
              if (!list) {
                draggedCard = null;
                dragActive = false;
                node.classList.remove("dragging");
                return;
              }
              await commitCardDrop(list, list.dataset.columnUuid);
            };
            document.addEventListener("mousemove", move);
            document.addEventListener("mouseup", up);
          };
        }
        return node;
      }

      function isInteractiveCardTarget(event) {
        const target = event.target instanceof Element ? event.target : event.target?.parentElement;
        return Boolean(target?.closest("button, select, input, textarea, a, label"));
      }

      function renderParticipants(participants, ownerId) {
        const wrap = document.createElement("div");
        wrap.className = "participants";
        wrap.title = "Participants";
        const ordered =
          ownerId && participants.includes(ownerId)
            ? [ownerId, ...participants.filter((id) => id !== ownerId)]
            : participants;
        ordered.forEach((participant) => {
          const user = userForParticipant(participant);
          const isOwner = participant === ownerId;
          const avatar = SovereignUI.avatar(user, {
            className: "participant-avatar",
            owner: isOwner,
            self: user.address === state.address,
            title: isOwner ? `${user.name} (owner)` : user.name,
          });
          wrap.append(avatar);
        });
        return wrap;
      }
      function reconcileDOM(parent, dataItems, keyFn, createFn, updateFn) {
        const dataKeys = dataItems.map(keyFn);

        // 1. Ausmisten: Elemente entfernen, die im neuen State nicht mehr existieren
        Array.from(parent.children).forEach((child) => {
          const key = child.getAttribute("data-id");
          if (!dataKeys.includes(key)) {
            child.remove();
          }
        });

        // 2. Abgleichen & Sortieren: Bestehende updaten oder neue einfügen
        dataItems.forEach((item, index) => {
          const key = keyFn(item);
          let child = parent.querySelector(`[data-id="${key}"]`);

          if (!child) {
            // Element existiert noch nicht -> Neu erstellen
            child = createFn(item);
            child.setAttribute("data-id", key);
            parent.insertBefore(child, parent.children[index] || null);
          } else {
            // Element existiert -> Position korrigieren falls nötig
            if (parent.children[index] !== child) {
              parent.insertBefore(child, parent.children[index] || null);
            }
            // Inhalt/Attribute patchen
            updateFn(child, item);
          }
        });
      }

      function renderBoardAdoptTools() {
        const tools = el("boardAdoptTools");
        tools.replaceChildren();
        const initiative = state.initiative;
        if (!initiative) return;
        // The initiative root inherits every descendant hash difference. Only
        // offer a root-level decision when the initiative's own fields differ.
        if (isContainerOnlyDivergence(initiative)) return;
        tools.append(...reactionTools(initiative));
      }

      // The control itself is Core's - one available act reads as a button
      // naming it, several become a menu - so a divergence looks the same
      // here, in the Cockpit and in the collaboration pane. S-Initiative
      // decides only which nodes are offered one.
      function reactionTools(node) {
        if (!needsReaction(node)) return [];
        const control = SovereignUI.reactionControl({
          info: transitionInfo(node.uuid),
          className: "react-button",
          onReact: (choice) => applyReaction(node.uuid, choice),
        });
        return control ? [control] : [];
      }

      function cardReactionTools(card, ghost = false) {
        // A moved card is drawn twice: solid at the seat it holds now, ghost
        // at the one it left. One reaction entry point per node, and it goes
        // on the solid card - that is the version being decided about.
        //
        // A ghost keeps the button only when there is no solid card left to
        // put it on: a deletion neither side has answered, or a card only
        // the peer has. Otherwise a card I deleted, which survives locally
        // as a tombstone and is drawn only as their ghost, would lose the
        // one control there was and leave no way to take the deletion back.
        if (ghost && currentSeatOf(card)) return [];
        return reactionTools(card);
      }

      async function applyReaction(uuid, choice) {
        const endpoint = choice.action === "rollback"
          ? "/api/initiative/rollback"
          : "/api/initiative/adopt";
        await run(() => api(endpoint, {
          node_uuid: uuid,
          source_addr: choice.peerAddr,
          adopt_absence: choice.action === "adopt" && choice.absent,
          rollback_absence: choice.action === "rollback" && choice.absent,
        }), choice.action === "rollback" ? "Rolled back" : "Adopted");
      }

      function openCard(card, columnUuid) {
        modalCard = card;
        modalColumn = columnUuid;
        // Do not capture the values left in the dialog by the previously
        // opened card as this card's draft during the initial render.
        modalPerspectiveKey = null;
        modalPerspectiveOptions = card ? cardPerspectiveOptions(card) : [];
        // The dialog is a single reused element, so anything typed but not
        // submitted survives its close. Name and description are rewritten
        // from the draft below; these two have no draft to rewrite them.
        el("cardCommentInput").value = "";
        el("cardFileInput").value = "";
        modalLocalDraft = {
          name: card?.data.name || "",
          description: card?.data.description || "",
          participants: Array.isArray(card?.data.participants) ? [...card.data.participants] : [],
          owner: card?.data.owner || null,
        };
        renderCardPerspective("local");
        el("cardOwner").onchange = () => {
          modalOwner = el("cardOwner").value || null;
        };
        el("cardModal").showModal();
      }

      function cardPerspectiveOptions(card) {
        const options = [{
          key: "local",
          label: "Mine",
          node: card,
          columnLabel: columnNameFor(state.initiative, card.parent_uuid),
          absent: false,
        }];
        const events = (transitionInfo(card.uuid)?.events || [transitionInfo(card.uuid)])
          .filter((event) => event && event.type !== "in_agreement");
        const seen = new Set();
        for (const event of events) {
          const revision = event.peer_revision || `${event.peer_addr}:missing`;
          if (seen.has(revision)) continue;
          seen.add(revision);
          const root = state.peers?.[event.peer_addr];
          const peerNode = root ? findNode(root, card.uuid) : null;
          options.push({
            key: `peer:${options.length}`,
            label: transitionActorLabel(event),
            node: peerNode,
            columnLabel: peerNode ? columnNameFor(root, peerNode.parent_uuid) : "",
            absent: !peerNode || peerNode.deleted,
          });
        }
        return options;
      }

      function columnNameFor(root, columnUuid) {
        const column = root && columnUuid ? findNode(root, columnUuid) : null;
        return column?.data?.name || "Unknown column";
      }

      function captureLocalCardDraft() {
        if (modalPerspectiveKey !== "local") return;
        modalLocalDraft = {
          name: el("cardName").value,
          description: el("cardDescription").value,
          participants: [...modalParticipants],
          owner: modalOwner,
        };
      }

      function renderCardPerspective(key) {
        captureLocalCardDraft();
        modalPerspectiveKey = key;
        const perspective = modalPerspectiveOptions.find((item) => item.key === key);
        const isLocal = !modalCard || !perspective || perspective.key === "local";
        modalReadOnlyPerspective = !isLocal;
        let data;
        if (isLocal) {
          data = modalLocalDraft || { name: "", description: "", participants: [], owner: null };
        } else if (perspective.absent) {
          data = { name: "", description: "", participants: [], owner: null };
        } else {
          data = perspective.node.data;
        }
        el("cardModalTitle").textContent = !modalCard
          ? "Add Card"
          : isLocal ? "Edit Card — My Perspective" : `Card — ${perspective.label}'s Perspective`;
        el("cardName").value = data.name || "";
        el("cardDescription").value = data.description || "";
        el("cardName").disabled = modalReadOnlyPerspective || perspective?.absent;
        el("cardDescription").disabled = modalReadOnlyPerspective || perspective?.absent;
        modalParticipants = Array.isArray(data.participants) ? [...data.participants] : [];
        modalOwner = data.owner || null;
        renderUserPicker("participantPicker");
        renderOwnerSelect();
        const meta = el("cardPerspectiveMeta");
        meta.textContent = perspective?.absent
          ? `This card is absent from ${perspective.label}'s perspective.`
          : `Column: ${perspective?.columnLabel || columnNameFor(state.initiative, modalColumn)}`;
        el("saveCardBtn").style.display = isLocal ? "" : "none";
        el("deleteCardBtn").style.display = modalCard && isLocal ? "inline-block" : "none";
        renderCardPerspectiveSwitcher();
        renderCardComments();
        renderCardAttachments();
      }

      function formatCommentTime(iso) {
        if (!iso) return "";
        const then = new Date(iso);
        if (Number.isNaN(then.getTime())) return "";
        const seconds = Math.floor((Date.now() - then.getTime()) / 1000);
        if (seconds < 60) return "just now";
        if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
        if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
        return then.toLocaleString();
      }

      function renderCardComments() {
        const section = el("cardComments");
        // Comments live on the real card, so show them only for an existing
        // card in the local ("Mine") perspective - not while adding a card or
        // viewing a peer's version.
        if (!modalCard || modalPerspectiveKey !== "local") {
          section.style.display = "none";
          return;
        }
        section.style.display = "block";
        const list = el("cardCommentList");
        list.replaceChildren();
        const myId = state.user_profile?.uuid;
        const comments = (state.comments_by_card || {})[modalCard.uuid] || [];
        if (!comments.length) {
          const empty = document.createElement("p");
          empty.className = "comment-empty";
          empty.textContent = "No comments yet.";
          list.append(empty);
        }
        for (const comment of comments) {
          const item = document.createElement("div");
          item.className = "comment";
          const head = document.createElement("div");
          head.className = "comment-head";
          const author = document.createElement("span");
          author.className = "comment-author";
          author.textContent = comment.author_label || "Unknown";
          const when = document.createElement("span");
          when.className = "comment-time";
          when.textContent = formatCommentTime(comment.created_at);
          head.append(author, when);
          if (comment.author && comment.author === myId) {
            const remove = document.createElement("button");
            remove.type = "button";
            remove.className = "comment-delete";
            remove.textContent = "Delete";
            remove.onclick = () => deleteComment(comment.uuid);
            head.append(remove);
          }
          const body = document.createElement("div");
          body.className = "comment-text";
          body.textContent = comment.text;
          item.append(head, body);
          list.append(item);
        }
      }

      async function addComment() {
        if (!modalCard) return;
        const input = el("cardCommentInput");
        const text = input.value.trim();
        if (!text) return;
        try {
          await api("/api/initiative/cards/comments/create", {
            card_uuid: modalCard.uuid,
            text,
          });
          input.value = "";
          await loadBoard();
          renderCardComments();
        } catch (error) {
          showToast(error.message, true);
        }
      }

      async function deleteComment(commentUuid) {
        try {
          await api("/api/initiative/cards/comments/delete", { comment_uuid: commentUuid });
          await loadBoard();
          renderCardComments();
        } catch (error) {
          showToast(error.message, true);
        }
      }

      function formatFileSize(bytes) {
        const size = Number(bytes) || 0;
        if (size < 1024) return size + " B";
        if (size < 1024 * 1024) return (size / 1024).toFixed(1) + " KB";
        return (size / (1024 * 1024)).toFixed(1) + " MB";
      }

      function renderCardAttachments() {
        const section = el("cardAttachmentList");
        const attachRow = el("attachFileBtn");
        // Files hang off a saved card, so - like comments - they appear only
        // for an existing card in the local perspective.
        const editable = modalCard && modalPerspectiveKey === "local";
        attachRow.disabled = !editable;
        section.replaceChildren();
        if (!editable) {
          section.style.display = "none";
          return;
        }
        section.style.display = "block";
        const myId = state.user_profile?.uuid;
        const files = (state.attachments_by_card || {})[modalCard.uuid] || [];
        if (!files.length) {
          const empty = document.createElement("p");
          empty.className = "attachment-empty";
          empty.textContent = "No files attached.";
          section.append(empty);
          return;
        }
        for (const file of files) {
          const row = document.createElement("div");
          row.className = "attachment";
          const link = document.createElement("a");
          link.className = "attachment-name";
          link.href = file.url;
          // Core serves a non-image blob as an octet-stream attachment, but
          // name the download here so it keeps the name it was uploaded with.
          link.download = file.name;
          link.textContent = file.name;
          link.title = `${file.name} (${file.mime})`;
          const meta = document.createElement("span");
          meta.className = "attachment-meta";
          meta.textContent = formatFileSize(file.size)
            + (file.author_label ? " · " + file.author_label : "");
          row.append(link, meta);
          if (file.author && file.author === myId) {
            const remove = document.createElement("button");
            remove.type = "button";
            remove.className = "attachment-delete";
            remove.textContent = "Remove";
            remove.onclick = () => deleteAttachment(file.uuid);
            row.append(remove);
          }
          section.append(row);
        }
      }

      async function attachSelectedFile(file) {
        if (!modalCard || !file) return;
        try {
          // Bytes go to Core's blob endpoint; only the reference goes to
          // S-Initiative, so the application never handles the payload
          // itself.
          const response = await fetch("/api/blob", {
            method: "POST",
            headers: {
              "Content-Type": file.type || "application/octet-stream",
            },
            body: file,
          });
          const stored = await response.json();
          if (!response.ok) {
            throw new Error(stored.reason || "Could not upload the file.");
          }
          await api("/api/initiative/cards/attachments/create", {
            card_uuid: modalCard.uuid,
            attachment: {
              id: crypto.randomUUID(),
              role: "attachment",
              blob_id: stored.blob_id,
              name: file.name,
              size: stored.size,
              mime: stored.mime,
            },
          });
          await loadBoard();
          renderCardAttachments();
          showToast("File attached");
        } catch (error) {
          showToast(error.message, true);
        }
      }

      async function deleteAttachment(attachmentUuid) {
        try {
          await api("/api/initiative/cards/attachments/delete", {
            attachment_uuid: attachmentUuid,
          });
          await loadBoard();
          renderCardAttachments();
        } catch (error) {
          showToast(error.message, true);
        }
      }

      function renderCardPerspectiveSwitcher() {
        const switcher = el("cardPerspectiveSwitcher");
        switcher.replaceChildren();
        switcher.style.display = modalPerspectiveOptions.length > 1 ? "flex" : "none";
        for (const perspective of modalPerspectiveOptions) {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = perspective.label;
          button.className = "perspective-option";
          if (perspective.key === modalPerspectiveKey) button.classList.add("active");
          button.onclick = () => renderCardPerspective(perspective.key);
          switcher.append(button);
        }
      }

      el("cardForm").onsubmit = async (event) => {
        event.preventDefault();
        if (modalReadOnlyPerspective) return;
        const payload = {
          name: el("cardName").value,
          description: el("cardDescription").value,
          participants: dedupe(modalParticipants),
          owner: modalOwner || null,
        };
        if (modalCard) {
          payload.card_uuid = modalCard.uuid;
          // Lost-update guard (review U-3): the server rejects the save if
          // the card changed since this modal opened, rather than silently
          // overwriting a peer's merged edit. On conflict keep the modal
          // open so nothing typed is lost - the next poll shows the merged
          // card underneath, and re-opening edits against it.
          payload.expected_content_hash = modalCard.content_hash;
          try {
            await api("/api/initiative/cards/update", payload);
          } catch (error) {
            showToast(error.message, true);
            await loadBoard();
            return;
          }
          showToast("Card saved");
          await loadBoard();
        } else {
          payload.column_uuid = modalColumn;
          await run(() => api("/api/initiative/cards/create", payload), "Card added");
        }
        el("cardModal").close();
      };

      el("deleteCardBtn").onclick = async () => {
        if (!modalCard) return;
        await confirmAction("Delete card?", "This removes the card from this board.", async () => {
          await run(
            () => api("/api/initiative/cards/delete", { card_uuid: modalCard.uuid }),
            "Card deleted",
          );
          el("cardModal").close();
        });
      };
      el("cancelCardBtn").onclick = () => el("cardModal").close();
      el("addCommentBtn").onclick = addComment;
      el("attachFileBtn").onclick = () => el("cardFileInput").click();
      el("cardFileInput").onchange = async (event) => {
        const [file] = event.target.files || [];
        // Clear first so re-picking the same file still fires a change.
        event.target.value = "";
        await attachSelectedFile(file);
      };

      function setModalFooterMode(mode) {
        const done = mode === "done";
        el("cancelSimpleBtn").style.display = done ? "none" : "";
        el("submitSimpleBtn").textContent = done ? "Done" : "Apply";
      }

      function openSimple(title, fields, onSubmit) {
        SovereignShell.closeCollab();
        setModalFooterMode("cancel-apply");
        el("simpleTitle").textContent = title;
        el("simpleFields").replaceChildren();
        for (const field of fields) {
          const label = document.createElement("label");
          label.textContent = field.label;
          let control;
          if (field.type === "select") {
            const selection = SovereignUI.selectionField({
              name: field.name,
              items: field.options || [],
              value: field.value,
            });
            control = selection.control;
          } else if (field.type === "display") {
            control = document.createElement("div");
            control.className = "change-summary";
            control.dataset.display = field.name;
            control.textContent = field.value || "";
          } else {
            control = document.createElement("input");
            control.name = field.name;
            control.value = field.value || "";
          }
          label.append(control);
          el("simpleFields").append(label);
        }
        el("simpleForm").onsubmit = async (event) => {
          event.preventDefault();
          await run(() => onSubmit(new FormData(event.currentTarget)), "Done");
          el("simpleModal").close();
        };
        el("simpleModal").showModal();
      }
      el("cancelSimpleBtn").onclick = () => el("simpleModal").close();

      async function dropCard(event, columnUuid) {
        if (!draggedCard) return;
        event.preventDefault();
        event.stopPropagation();
        await commitCardDrop(event.currentTarget, columnUuid);
      }

      async function commitCardDrop(list, columnUuid) {
        if (!draggedCard) return;
        const dragging = document.querySelector(".card.dragging");
        // Ghosts are seats, not cards: counting them would push the index
        // past the live card the drop was aimed at.
        const order = [...list.querySelectorAll(".card:not(.ghost)")].map(
          (item) => item.dataset.uuid,
        );
        const cardUuid = draggedCard;
        draggedCard = null;
        // Dragging a card the peer has just moved would otherwise set my
        // move against theirs from a base neither of us is at any more, and
        // the pair classifies as a real divergence - a conflict invented out
        // of two ordinary moves. Taking their move first makes mine simply
        // the next one in the sequence.
        const info = transitionInfo(cardUuid);
        try {
          await run(
            async () => {
              if (info?.stage === "awaiting_me") {
                await api("/api/initiative/adopt", {
                  node_uuid: cardUuid,
                  source_addr: info.peer_addr,
                  adopt_absence: false,
                  rollback_absence: false,
                });
              }
              return api("/api/initiative/cards/move", {
                card_uuid: cardUuid,
                column_uuid: columnUuid,
                index: Math.max(0, order.indexOf(cardUuid)),
              });
            },
            "Card moved",
          );
        } finally {
          dragging?.classList.remove("dragging");
          dragActive = false;
          await loadBoard();
        }
      }

      function onCardDragOver(event) {
        if (!draggedCard) return;
        event.preventDefault();
        event.stopPropagation();
        const dragging = document.querySelector(".card.dragging");
        if (!dragging) return;
        const after = cardAfterPointer(event.currentTarget, event.clientY);
        if (after) event.currentTarget.insertBefore(dragging, after);
        else event.currentTarget.append(dragging);
      }

      function cardAfterPointer(list, y) {
        return [...list.querySelectorAll(".card:not(.dragging)")].reduce(
          (best, child) => {
            const box = child.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            return offset < 0 && offset > best.offset ? { offset, child } : best;
          },
          { offset: Number.NEGATIVE_INFINITY, child: null },
        ).child;
      }

      function columns(initiative) {
        return sortNodes(
          (initiative.children || []).filter((node) => node.data.type === "kanban_column" && !node.deleted),
        );
      }
      function cards(column) {
        return sortNodes(
          (column.children || []).filter((node) => node.data.type === "kanban_card" && !node.deleted),
        );
      }
      function solidCards(column) {
        // What is live in this column now: our own cards, less the ones the
        // peer has moved out or deleted, plus the ones they have moved in.
        // The solid card follows the current seat wherever it went.
        const local = cards(column).filter((card) => !movedByPeer(card));
        return sortNodes([...local, ...arrivedCards(column.uuid)]);
      }
      function arrivedCards(columnUuid) {
        // Read from our own tree, not by scanning peer columns: the peer who
        // authored the move is the one the transition names, so two peers
        // moving the same card cannot land it in two columns at once.
        const arrivals = new Map();
        for (const column of columns(state.initiative)) {
          for (const card of cards(column)) {
            if (!movedByPeer(card)) continue;
            const peerNode = peerCopyOf(card);
            if (peerNode && !peerNode.deleted
                && peerNode.parent_uuid === columnUuid) {
              arrivals.set(card.uuid, peerNode);
            }
          }
        }
        return [...arrivals.values()];
      }
      function ghostColumns() {
        const ghosts = new Map();
        // A column cannot change parent, so the only seat it leaves is the
        // one a deletion empties - ours when the peer deleted it.
        for (const column of columns(state.initiative)) {
          if (movedByPeer(column)) ghosts.set(column.uuid, column);
        }
        for (const root of initiativePeerRoots()) {
          for (const column of columns(root)) {
            if (ghosts.has(column.uuid)) continue;
            if (movedByMe(column) || peerOnlyNode(column)) {
              ghosts.set(column.uuid, column);
            }
          }
        }
        return sortNodes([...ghosts.values()]);
      }
      function ghostCards(columnUuid) {
        const ghosts = new Map();
        // The seat a card left when the peer moved or deleted it: our own
        // copy, still sitting here, no longer the current one.
        const localColumn = findNode(state.initiative, columnUuid);
        for (const card of cards(localColumn || { children: [] })) {
          if (movedByPeer(card)) ghosts.set(card.uuid, card);
        }
        // The seat the peer still gives a card after I moved or deleted it,
        // and cards only they hold - both drawn from their copy.
        for (const root of initiativePeerRoots()) {
          const peerColumn = findNode(root, columnUuid);
          for (const card of cards(peerColumn || { children: [] })) {
            if (ghosts.has(card.uuid)) continue;
            if (movedByMe(card) || peerOnlyNode(card)) {
              ghosts.set(card.uuid, card);
            }
          }
        }
        return sortNodes([...ghosts.values()]);
      }
      function sortNodes(nodes) {
        return [...nodes].sort(
          (a, b) =>
            Number(a.data.order || 0) - Number(b.data.order || 0) ||
            a.created_at.localeCompare(b.created_at),
        );
      }
      function transitionInfo(uuid) {
        return (state.transition_by_node || {})[uuid] || null;
      }
      function applyTransitionClass(element, uuid, options = {}) {
        element.classList.remove("diff");
        [...element.classList]
          .filter((name) => name.startsWith("stage-"))
          .forEach((name) => element.classList.remove(name));
        element.removeAttribute("title");
        delete element.dataset.transitionLabel;
        const info = transitionInfo(uuid);
        if (!info || info.stage === "settled" || options.suppress) return;
        // One border colour per stage, and nothing else. The badge said what
        // relation the difference was, which is the one thing a person does
        // not need at a glance - and it said "+" for a deletion, because it
        // was keyed on the relation rather than on what actually changed.
        element.classList.add("diff", `stage-${info.stage}`);
        element.title = transitionLabel(info);
        element.dataset.transitionLabel = transitionLabel(info);
      }
      function peerLabel(address) {
        const user = (state.users || []).find((item) => item.address === address);
        if (user?.name && user.name !== "?") return user.name;
        const identityName = peerIdentityValue(address, "name");
        if (identityName) return identityName;
        const text = String(address || "");
        const match = text.match(/:(\d+)(?:\/)?$/);
        return match ? match[1] : text.replace(/^https?:\/\//, "") || "peer";
      }
      function peerStatus(address) {
        return (
          state.network?.peer_status?.[address] ||
          state.network?.peers?.[address]?.status || {
            state: "online",
            failures: 0,
            last_error: null,
          }
        );
      }
      function peerChannel(address) {
        // The only transport-shaped thing this app is allowed to show -
        // which channel (direct/relay) last delivered for this peer, or
        // null if unknown. Purely informational, never affects behavior.
        return state.network?.peers?.[address]?.channel || null;
      }
      function initiativePeerAddresses() {
        const initiativeUuid = state.initiative?.uuid;
        if (!initiativeUuid) return [];
        return Object.entries(state.network?.peers || {})
          .filter(([, info]) => (info.topic_uuids || []).includes(initiativeUuid))
          .map(([addr]) => addr);
      }
      function initiativePeerRoots() {
        const initiativeUuid = state.initiative?.uuid;
        return initiativePeerAddresses()
          .map((addr) => findNode(state.peers?.[addr], initiativeUuid))
          .filter(Boolean);
      }
      function userForParticipant(participant) {
        const users = state.users || [];
        return (
          users.find((user) => user.id === participant) ||
          users.find((user) => user.profile_uuid === participant) ||
          users.find((user) => user.identity_key === participant) ||
          users.find((user) => user.address === participant) ||
          users.find((user) => user.name === participant) || {
            id: participant,
            profile_uuid: participant,
            identity_key: participant,
            address: "",
            name: "?",
            picture: "",
          }
        );
      }
      function initials(name) {
        return (
          String(name || "?")
            .split(/\s+/)
            .filter(Boolean)
            .slice(0, 2)
            .map((part) => part[0].toUpperCase())
            .join("") || "?"
        );
      }
      function cssUrl(value) {
        return String(value || "")
          .replaceAll("\\", "\\\\")
          .replaceAll('"', '\\"');
      }
      function peerIdentityValue(address, field) {
        const root = (state.peers || {})[address];
        const profile = findIdentityProfile(root);
        const node = findIdentityField(profile || root, field);
        return node?.data?.value || node?.data?.[field] || "";
      }
      function findIdentityProfile(node) {
        if (!node) return null;
        if (node.data?.type === "shared_user_profile") return node;
        for (const child of node.children || []) {
          const found = findIdentityProfile(child);
          if (found) return found;
        }
        return null;
      }
      function findIdentityField(node, field) {
        if (!node) return null;
        if (node.data?.type === "shared_user_profile") {
          if (field === "name" && node.data?.display_name)
            return { data: { value: node.data.display_name } };
          return node.data?.[field] ? node : null;
        }
        for (const child of node.children || []) {
          const found = findIdentityField(child, field);
          if (found) return found;
        }
        return null;
      }
      function findNode(node, uuid) {
        if (!node) return null;
        if (node.uuid === uuid) return node;
        for (const child of node.children || []) {
          const found = findNode(child, uuid);
          if (found) return found;
        }
        return null;
      }
      async function run(action, ok) {
        try {
          await action();
          showToast(ok || "Done");
          await loadBoard();
          return true;
        } catch (error) {
          showToast(error.message, true);
          return false;
        }
      }

      // The adopt tools belong beside the initiative's name, which is the
      // thing they decide about. The auto-adopt indicator that used to sit in
      // the shell's right-hand slot is gone: a setting is not a header
      // control, and it is read as a labelled row in the collaboration pane
      // (U7).
      const initiativeControls = el("initiativeHeaderControls").content;
      const adoptTools = initiativeControls.querySelector("#boardAdoptTools");

      SovereignShell.mount({
        container: el("shell"),
        applicationId: "initiative",
        topicUuid: () => state?.initiative?.uuid || "",
        state: () => state || {},
        // The pane is the shell's; S-Initiative supplies where its routes
        // live and the two extra modes judged against card ownership, which
        // Core stores without interpreting.
        agendaRoutes: {
          topicKey: 'initiative_uuid',
          create: '/api/initiative/agenda/create',
          delete: '/api/initiative/agenda/delete',
          update: '/api/initiative/agenda/update',
          setPriority: '/api/initiative/agenda/set_priority',
          move: '/api/initiative/agenda/move',
        },
        autoAdoptRoute: {path: '/api/initiative/auto_adopt', topicKey: 'initiative_uuid'},
        autoAdoptLabels: AUTO_ADOPT_LABELS,
        autoAdoptDescriptions: AUTO_ADOPT_DESCRIPTIONS,
        renderAutoAdoptIndicator: (container, mode) => {
          container.classList.add("auto-adopt-square");
          renderAutoAdoptSquare(container, mode);
        },
        describeNode: (uuid) => {
          const node = findNode(state?.initiative, uuid);
          return node ? (node.data.name || node.data.text || '') : '';
        },
        revealNode: (uuid) => highlightCard(uuid),
        reactNode: (uuid, choice) => applyReaction(uuid, choice),
        onChanged: () => loadBoard(),
      });
      SovereignShell.setTopicActions(adoptTools);

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") SovereignShell.closeCollab();
      });

      // `topic` and not `initiative`: one name for "open this one", so the
      // can compose a link to any application's topic without knowing what
      // that application calls its topics.
      async function selectInitiativeFromUrl() {
        const params = new URLSearchParams(window.location.search);
        const initiativeUuid = params.get("topic");
        if (!initiativeUuid) return;
        try {
          await api("/api/initiative/initiatives/select", { initiative_uuid: initiativeUuid });
        } catch (error) {
          showToast(error.message, true);
        }
        params.delete("topic");
        const query = params.toString();
        window.history.replaceState({}, "", window.location.pathname + (query ? `?${query}` : ""));
      }

      setInterval(() => loadBoard(), 1500);
      selectInitiativeFromUrl().then(loadBoard);
    </script>
  </body>
</html>
